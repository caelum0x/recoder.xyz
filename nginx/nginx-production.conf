# Production Nginx Configuration for Recoder.xyz
# Reverse proxy for all subdomains, behind Cloudflare (SSL terminated at origin)
#
# Subdomain Routing Table:
#   recoder.xyz / www.recoder.xyz  -> app (recoder-app)            :3000
#   api.recoder.xyz                -> backend (recoder-backend)     :8000
#   docker.recoder.xyz             -> docker-backend                :3100
#   web.recoder.xyz                -> recoder-web                   :5173
#   agents.recoder.xyz / app.recoder.xyz   -> recoder-agents        :3001
#   studio.recoder.xyz             -> recoder-studio                :3005
#   agency.recoder.xyz             -> recoder-agency                :3007
#   pm.recoder.xyz                 -> recoder-pm                    :3004
#   openclaw.recoder.xyz           -> openclaw-gateway               :18789
#   *.sandbox.recoder.xyz          -> daytona-proxy                 :4000

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ================================================================
    # Basic Settings
    # ================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Buffers
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;

    # ================================================================
    # Gzip Compression
    # ================================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    # NOTE: text/event-stream intentionally excluded from gzip.
    # Gzip buffers output, which defeats SSE streaming and causes ERR_HTTP2_PROTOCOL_ERROR.

    # ================================================================
    # Security Headers (applied globally, can be overridden per-block)
    # ================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://tagmanager.google.com https://js.stripe.com https://static.cloudflareinsights.com https://api.recoder.xyz https://*.recoder.xyz; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: wss: ws: https://recoder.xyz https://www.recoder.xyz https://*.recoder.xyz wss://*.recoder.xyz https://www.google-analytics.com https://region1.google-analytics.com https://*.posthog.com https://*.i.posthog.com https://api.stripe.com https://r.stripe.com https://m.stripe.network https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' blob: https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://*.recoder.xyz https://*.sandbox.recoder.xyz; object-src 'self' https://api.recoder.xyz https://*.recoder.xyz; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;

    # ================================================================
    # Rate Limiting Zones
    # ================================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/s;

    # ================================================================
    # SSL Configuration (Cloudflare Origin Certificate)
    # Cloudflare terminates public SSL; this is origin-to-Cloudflare encryption.
    # Replace with Cloudflare origin cert or keep Let's Encrypt if preferred.
    # ================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ssl_stapling handled by Cloudflare (origin cert has no issuer chain)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ================================================================
    # WebSocket connection upgrade map
    # ================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ================================================================
    # Logging
    # ================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ================================================================
    # Upstream Definitions (Docker service names from docker-compose)
    # ================================================================

    # recoder-app (Next.js main site) - recoder.xyz / www.recoder.xyz
    upstream app_main {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # backend (Python FastAPI) - api.recoder.xyz
    upstream backend_api {
        least_conn;
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # docker-backend (Express + WS) - docker.recoder.xyz
    upstream docker_backend {
        least_conn;
        server 127.0.0.1:3100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-web (Remix/Vite) - web.recoder.xyz
    upstream web_app {
        least_conn;
        server 127.0.0.1:5173 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-agents (Next.js) - app.recoder.xyz / frontend.recoder.xyz
    upstream frontend_app {
        least_conn;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-agency (Next.js) - agency.recoder.xyz
    upstream agency_app {
        least_conn;
        server 127.0.0.1:3007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-pm (Next.js) - pm.recoder.xyz
    upstream pm_app {
        least_conn;
        server 127.0.0.1:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # openclaw-gateway - openclaw.recoder.xyz (A2A gateway)
    upstream openclaw_gateway {
        server 127.0.0.1:18789 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # daytona-proxy - *.sandbox.recoder.xyz (sandbox live preview)
    upstream daytona_proxy {
        server 127.0.0.1:4000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ================================================================
    # HTTP Entrypoint (Cloudflare terminates public SSL)
    # ================================================================
    # When Cloudflare SSL mode is "Flexible", traffic arrives here on port 80.
    # When Cloudflare SSL mode is "Full (Strict)", traffic goes to the 443 blocks below.
    # This block serves actual content so the site works immediately without origin certs.
    # ================================================================

    # --- recoder.xyz / www.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name recoder.xyz www.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # --- api.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name api.recoder.xyz;

        # Kill browser QUIC cache — forces downgrade to HTTP/2
        add_header Alt-Svc 'clear' always;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # SSE streaming endpoints (long-lived connections)
        location ~ ^/v1/.*/stream {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';

            # SSE: disable all buffering so events stream immediately
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;

            # Graceful disconnect handling — prevents backend worker crashes
            proxy_ignore_client_abort on;

            # Long timeout for SSE (24h keep-alive for browser tab lifetime)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Strip upstream CORS headers to prevent duplicates (FastAPI also adds them)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Max-Age;
            proxy_hide_header Access-Control-Expose-Headers;

            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key, X-Project-Id, X-MCP-URL, X-MCP-Type, X-MCP-Headers, X-Trace-Id, X-Connector-Id, X-Request-Id, traceparent, tracestate" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Alt-Svc 'clear' always;
            # Tell Cloudflare/CDN not to buffer SSE
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;

            # Strip upstream CORS headers to prevent duplicates (FastAPI also adds them)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Max-Age;
            proxy_hide_header Access-Control-Expose-Headers;

            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key, X-Project-Id, X-MCP-URL, X-MCP-Type, X-MCP-Headers, X-Trace-Id, X-Connector-Id, X-Request-Id, traceparent, tracestate" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Alt-Svc 'clear' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # --- docker.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name docker.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ws {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # A2A SSE streaming endpoints
        location /api/a2a/stream {
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_set_header Accept text/event-stream;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            proxy_ignore_client_abort on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        # Chat SSE streaming
        location /api/chat {
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_set_header Accept text/event-stream;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            proxy_ignore_client_abort on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;

            # CORS handled by Express cors() middleware — not here
        }
    }

    # --- web.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name web.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ws {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # A2A SSE intents
        location /api/a2a/ {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection '';
            proxy_set_header Accept text/event-stream;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            proxy_ignore_client_abort on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # --- app.recoder.xyz / agents.recoder.xyz / frontend.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name app.recoder.xyz agents.recoder.xyz frontend.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API routes (includes SSE streams for agent runs, notifications, etc.)
        location /api/ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            proxy_ignore_client_abort on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # --- studio.recoder.xyz (port 80) — SERVICE RETIRED ---
    server {
        listen 80;
        server_name studio.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 302 https://agency.recoder.xyz;
        }
    }

    # --- agency.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name agency.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API routes (SSE streams for project copilot chat and task execution)
        location /api/ {
            proxy_pass http://agency_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            proxy_ignore_client_abort on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        location / {
            proxy_pass http://agency_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }
    }

    # --- pm.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name pm.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API routes (SSE streams for insights copilot chat)
        location /api/ {
            proxy_pass http://pm_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            proxy_ignore_client_abort on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        location / {
            proxy_pass http://pm_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }
    }

    # --- openclaw.recoder.xyz (port 80) -> redirect to HTTPS ---
    server {
        listen 80;
        server_name openclaw.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================================================================
    # 1. Main Website - recoder.xyz / www.recoder.xyz -> app :3000
    # ================================================================
    server {
        listen 443 ssl http2;
        server_name recoder.xyz www.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/recoder.crt;
        ssl_certificate_key /etc/nginx/ssl/recoder.key;

        # Error reporter injection (self-hosted error monitoring)
        sub_filter "</head>" "<script src=\"https://api.recoder.xyz/v1/errors/reporter.js?app=recoder-app\" defer></script></head>";
        sub_filter_once on;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Next.js build output (content-hashed, long cache)
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://app_main;
