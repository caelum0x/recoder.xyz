            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /_next/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # API routes (includes SSE streams for agent runs, notifications, etc.)
        # Higher burst to handle SSE reconnection storms after deploys
        location /api/ {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE: disable all buffering so events stream immediately
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;

            # Graceful disconnect handling — prevents backend worker crashes
            proxy_ignore_client_abort on;

            # Long timeout for SSE (agent runs can last 10+ minutes)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Tell Cloudflare / nginx not to buffer streaming responses
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        # Default
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # Prevent stale HTML caching — forces browser to load new JS chunks after deploy
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }
    }

