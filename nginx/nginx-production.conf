            # Override the http-block "always" headers: no framing restriction for preview
            # (location-level add_header replaces http-block add_header for this location)
            add_header X-Frame-Options "" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # API routes (includes SSE streams for A2A intents and other streaming)
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection '';

            # SSE: disable all buffering so events stream immediately
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_request_buffering off;

            # Graceful disconnect handling
            proxy_ignore_client_abort on;

            # Long timeout for SSE (10 min)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Tell Cloudflare / nginx not to buffer streaming responses
            add_header X-Accel-Buffering 'no' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        # Published sites: web.recoder.xyz/published/{slug}/* → docker-backend static
        location /published/ {
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 15s;

            # Allow iframing published content
            add_header X-Frame-Options "" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Default
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

    # ================================================================
