    # ================================================================
    # 10. Daytona Sandbox Previews - *.sandbox.recoder.xyz -> daytona-proxy :4000
    #    URL pattern: https://{port}-{sandboxId}.sandbox.recoder.xyz
    #    DNS: *.sandbox.recoder.xyz -> 77.42.23.19 (Cloudflare wildcard)
    #    SSL cert: *.sandbox.recoder.xyz covered by recoder.crt
    # ================================================================
    server {
        listen 443 ssl http2;
        server_name ~^(?<port>\d+)-(?<sandbox_id>[a-zA-Z0-9\-]+)\.sandbox\.recoder\.xyz$;

        # Let's Encrypt wildcard cert for *.sandbox.recoder.xyz
        # (Cloudflare Origin cert not trusted by browsers when DNS is not proxied)
        ssl_certificate /etc/letsencrypt/live/sandbox.recoder.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sandbox.recoder.xyz/privkey.pem;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # All traffic proxied to daytona-proxy which routes to the correct sandbox port
        location / {
            proxy_pass http://daytona_proxy;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_buffering off;

            # Allow sandbox content in iframes on web.recoder.xyz
            add_header X-Frame-Options "" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }

    # ================================================================
    # Custom Domain Configs (generated by domain-manager)
    # ================================================================
    include /etc/nginx/conf.d/custom-domains/*.conf;

    # ================================================================
    # Default Server (catch-all + internal health check)
    # ================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME Challenge (for custom domains)
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Nginx-level health check (used by monitoring/load balancers)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Drop all other requests to unknown hosts
        location / {
            return 444;
        }
    }
}
