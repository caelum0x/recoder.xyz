# Production Nginx Configuration for Recoder.xyz
# High-performance, secure, SSL-terminating reverse proxy

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic Settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    
    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    
    # Buffer Settings
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # Production Security Headers - Unicorn Startup Grade
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://tagmanager.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: wss: ws:; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    
    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=1r/s;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    
    # Upstream Definitions
    upstream backend_api {
        least_conn;
        server backend:3100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream web_app {
        least_conn;
        server web:5173 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream pm_app {
        least_conn;
        server pm:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream agency_app {
        least_conn;
        server agency:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream monitoring {
        server grafana:3000 max_fails=3 fail_timeout=30s;
    }
    
    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name recoder.xyz www.recoder.xyz api.recoder.xyz pm.recoder.xyz monitor.recoder.xyz web.recoder.xyz agency.recoder.xyz;
        
        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }
        
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # Main Website - recoder.xyz
    server {
        listen 443 ssl http2;
        server_name recoder.xyz www.recoder.xyz;
        
        ssl_certificate /etc/nginx/ssl/live/recoder.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/recoder.xyz/privkey.pem;
        
        # Main application
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # Smart caching for static assets
            # Content-hashed files (with hash in filename) get long cache
            location ~* [-_][a-f0-9]{8,}\.(js|css)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                proxy_pass http://web_app;
            }

            # Non-hashed JS/CSS files - short cache with revalidation
            location ~* \.(js|css)$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600, must-revalidate";
                proxy_pass http://web_app;
            }

            # Images - 1 day cache with revalidation
            location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
                expires 1d;
                add_header Cache-Control "public, max-age=86400, must-revalidate";
                proxy_pass http://web_app;
            }

            # Fonts - long cache (they rarely change)
            location ~* \.(woff|woff2|ttf|eot|otf)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                proxy_pass http://web_app;
            }
        }
        
        # Next.js/Remix build output paths (typically contain content hashes)
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://web_app;
        }

        # Other _next paths may not have content hashes
        location /_next/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
        }

        # Remix/Vite assets directory (typically content-hashed)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://web_app;
        }

        # HTML files should never be cached long-term
        location ~* \.html?$ {
            expires 0;
            add_header Cache-Control "no-cache, must-revalidate";
            proxy_pass http://web_app;
        }
        
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # API Gateway - api.recoder.xyz
    server {
        listen 443 ssl http2;
        server_name api.recoder.xyz;
        
        ssl_certificate /etc/nginx/ssl/live/recoder.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/recoder.xyz/privkey.pem;
        
        location / {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
        
        # WebSocket support for real-time features
        location /ws {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
    }
    
    # PM Platform - pm.recoder.xyz
    server {
        listen 443 ssl http2;
        server_name pm.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/live/recoder.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/recoder.xyz/privkey.pem;

        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://pm_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://pm_app;
        }

        location /_next/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://pm_app;
        }
    }
    
    # Monitoring Dashboard - monitor.recoder.xyz
    server {
        listen 443 ssl http2;
        server_name monitor.recoder.xyz;
        
        ssl_certificate /etc/nginx/ssl/live/recoder.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/recoder.xyz/privkey.pem;
        
        # Basic authentication for monitoring (optional)
        # auth_basic "Monitoring Access";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        location / {
            proxy_pass http://monitoring;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
    
    # Agency Platform - agency.recoder.xyz
    server {
        listen 443 ssl http2;
        server_name agency.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/live/recoder.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/recoder.xyz/privkey.pem;

        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://agency_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://agency_app;
        }

        location /_next/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://agency_app;
        }
    }

    # Published Projects - web.recoder.xyz
    # Serves static sites built via "Go Live" feature from /data/published/<slug>/
    # SSL: Uses same wildcard cert as other subdomains (*.recoder.xyz)
    # DNS: Add A record for web.recoder.xyz pointing to production server IP (or CNAME to recoder.xyz)
    server {
        listen 443 ssl http2;
        server_name web.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/live/recoder.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/recoder.xyz/privkey.pem;

        # Published projects: web.recoder.xyz/<slug>/
        location ~ ^/([a-z0-9][a-z0-9-]*)(/.*)?$ {
            alias /data/published/$1/;

            # SPA routing: try the exact path, then index.html
            try_files $2 $2/ /index.html =404;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
            }

            # HTML files should not be cached long-term
            location ~* \.html?$ {
                expires 0;
                add_header Cache-Control "no-cache, must-revalidate";
            }

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;

            # CORS for fonts and assets
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Root: redirect to main site
        location = / {
            return 302 https://recoder.xyz;
        }
    }

    # ==================== Custom Domain Configs ====================
    # Dynamic include for custom domain server blocks.
    # Each file is generated by the domain-manager when a custom domain is activated.
    # Files live in /etc/nginx/conf.d/custom-domains/<domain>.conf
    include /etc/nginx/conf.d/custom-domains/*.conf;

    # Health Check Endpoint (Internal)
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME Challenge (for custom domains)
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 444;
        }
    }
}

