            return 404;
        }

        # Live preview proxy - /preview/:projectId/* -> recoder-web -> docker-backend
        # Must NOT have X-Frame-Options so the preview iframe can render inside web.recoder.xyz.
        # A location-level add_header replaces the http-block global headers for this location.
        location /preview/ {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_buffering off;

            # Do NOT inject error reporter or dark theme into preview content.
            # The server-level sub_filter would modify user preview HTML otherwise.
            # Set sub_filter_types to a non-existent type to effectively disable sub_filter.
            sub_filter_types text/x-no-match;
            sub_filter "x-no-match-sentinel" "";
            # Re-enable Accept-Encoding so preview content can be compressed
            proxy_set_header Accept-Encoding $http_accept_encoding;

