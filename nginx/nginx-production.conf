# Production Nginx Configuration for Recoder.xyz
# Reverse proxy for all subdomains, behind Cloudflare (SSL terminated at origin)
#
# Subdomain Routing Table:
#   recoder.xyz / www.recoder.xyz  -> app (recoder-app)            :3000
#   api.recoder.xyz                -> backend (recoder-backend)     :8000
#   docker.recoder.xyz             -> docker-backend                :3100
#   web.recoder.xyz                -> recoder-web                   :5173
#   agents.recoder.xyz / app.recoder.xyz   -> recoder-agents        :3001
#   studio.recoder.xyz             -> recoder-studio                :3005
#   agency.recoder.xyz             -> recoder-agency                :3007
#   pm.recoder.xyz                 -> recoder-pm                    :3004

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ================================================================
    # Basic Settings
    # ================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Buffers
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;

    # ================================================================
    # Gzip Compression
    # ================================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml
        text/event-stream;

    # ================================================================
    # Security Headers (applied globally, can be overridden per-block)
    # ================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://tagmanager.google.com https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: wss: ws: https://recoder.xyz https://www.recoder.xyz https://*.recoder.xyz wss://*.recoder.xyz https://www.google-analytics.com https://region1.google-analytics.com https://*.posthog.com https://*.i.posthog.com https://api.stripe.com https://r.stripe.com https://m.stripe.network https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;

    # ================================================================
    # Rate Limiting Zones
    # ================================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/s;

    # ================================================================
    # SSL Configuration (Cloudflare Origin Certificate)
    # Cloudflare terminates public SSL; this is origin-to-Cloudflare encryption.
    # Replace with Cloudflare origin cert or keep Let's Encrypt if preferred.
    # ================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ssl_stapling handled by Cloudflare (origin cert has no issuer chain)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ================================================================
    # WebSocket connection upgrade map
    # ================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ================================================================
    # Logging
    # ================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ================================================================
    # Upstream Definitions (Docker service names from docker-compose)
    # ================================================================

    # recoder-app (Next.js main site) - recoder.xyz / www.recoder.xyz
    upstream app_main {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # backend (Python FastAPI) - api.recoder.xyz
    upstream backend_api {
        least_conn;
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # docker-backend (Express + WS) - docker.recoder.xyz
    upstream docker_backend {
        least_conn;
        server 127.0.0.1:3100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-web (Remix/Vite) - web.recoder.xyz
    upstream web_app {
        least_conn;
        server 127.0.0.1:5173 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-agents (Next.js) - app.recoder.xyz / frontend.recoder.xyz
    upstream frontend_app {
        least_conn;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-studio (Next.js) - studio.recoder.xyz
    upstream studio_app {
        least_conn;
        server 127.0.0.1:3005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-agency (Next.js) - agency.recoder.xyz
    upstream agency_app {
        least_conn;
        server 127.0.0.1:3007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # recoder-pm (Next.js) - pm.recoder.xyz
    upstream pm_app {
        least_conn;
        server 127.0.0.1:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ================================================================
    # HTTP Entrypoint (Cloudflare terminates public SSL)
    # ================================================================
    # When Cloudflare SSL mode is "Flexible", traffic arrives here on port 80.
    # When Cloudflare SSL mode is "Full (Strict)", traffic goes to the 443 blocks below.
    # This block serves actual content so the site works immediately without origin certs.
    # ================================================================

    # --- recoder.xyz / www.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name recoder.xyz www.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # --- api.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name api.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location ~ ^/v1/.*/stream {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Max-Age;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Max-Age;
            proxy_read_timeout 300s;

            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # --- docker.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name docker.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ws {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;

            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # --- web.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name web.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ws {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # --- app.recoder.xyz / agents.recoder.xyz / frontend.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name app.recoder.xyz agents.recoder.xyz frontend.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # --- studio.recoder.xyz (port 80) — SERVICE RETIRED ---
    server {
        listen 80;
        server_name studio.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 302 https://agency.recoder.xyz;
        }
    }

    # --- agency.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name agency.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://agency_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }
    }

    # --- pm.recoder.xyz (port 80) ---
    server {
        listen 80;
        server_name pm.recoder.xyz;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://pm_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }
    }

    # ================================================================
    # 1. Main Website - recoder.xyz / www.recoder.xyz -> app :3000
    # ================================================================
    server {
        listen 443 ssl http2;
        server_name recoder.xyz www.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/recoder.crt;
        ssl_certificate_key /etc/nginx/ssl/recoder.key;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Next.js build output (content-hashed, long cache)
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /_next/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # API routes on the app
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # SSE support for streaming endpoints
            proxy_buffering off;
            proxy_cache off;
        }

        # Static assets with smart caching
        location ~* [-_][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9]+\.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~* \.(js|css)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400, must-revalidate";
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~* \.html?$ {
            expires 0;
            add_header Cache-Control "no-cache, must-revalidate";
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Default catch-all
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

    # ================================================================
    # 2. API Gateway - api.recoder.xyz -> backend :8000
    # ================================================================
    server {
        listen 443 ssl http2;
        server_name api.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/recoder.crt;
        ssl_certificate_key /etc/nginx/ssl/recoder.key;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Auth endpoints (stricter rate limit)
        location /v1/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Max-Age;

            # CORS headers for API
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # SSE streaming endpoints (long-lived connections)
        location ~ ^/v1/.*/stream {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Max-Age;

            # SSE: disable buffering so events stream immediately
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Long timeout for SSE (10 min keep-alive)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # CORS
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # Webhook endpoints (separate rate limit)
        location /v1/webhooks/ {
            limit_req zone=webhooks burst=30 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Default API routes
        location / {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Max-Age;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # CORS headers for API
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # ================================================================
    # 3. Docker Backend - docker.recoder.xyz -> docker-backend :3100
    # ================================================================
    server {
        listen 443 ssl http2;
        server_name docker.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/recoder.crt;
        ssl_certificate_key /etc/nginx/ssl/recoder.key;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # WebSocket endpoint (express-ws)
        location /ws {
            limit_req zone=ws burst=10 nodelay;

            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket long timeout
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # A2A SSE streaming endpoints
        location /api/a2a/stream {
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Chat SSE streaming
        location /api/chat {
            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # CORS
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Default (all other API routes)
        location / {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://docker_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # CORS headers
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # ================================================================
    # 4. Recoder Web (Remix/Vite) - web.recoder.xyz -> recoder-web :5173
    # ================================================================
    server {
        listen 443 ssl http2;
        server_name web.recoder.xyz;

        ssl_certificate /etc/nginx/ssl/recoder.crt;
        ssl_certificate_key /etc/nginx/ssl/recoder.key;

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Remix/Vite HMR and WebSocket support
        location /ws {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # A2A SSE intents
        location /api/a2a/ {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Remix content-hashed assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Explicit top-level static asset allowlist.
        # Prevents missing favicon/logo variants from falling through to Remix HTML 200 responses.
        location = /favicon.ico {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /favicon.png {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /favicon-192x192.png {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /apple-touch-icon.png {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /manifest.json {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /icon.png {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /logo.png {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /sw.js {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /offline.html {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Force removed/unknown favicon/logo variants to 404 instead of HTML fallback.
        location ~* ^/(favicon[^/]*\.(png|svg|jpg|jpeg|webp)|apple-touch-icon[^/]*\.(png|svg)|logo[^/]*\.(svg|jpg|jpeg|webp))$ {
            return 404;
        }

        # API routes
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
        }

        # Default
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

