<!DOCTYPE html>
<html>
<head>
    <title>Test Page for Desktop App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
        .status {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
        }
        .info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
        }
        .timestamp {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Desktop App Test Page</h1>
        
        <div class="status">
            <h3>✅ Success!</h3>
            <p>This page is loading correctly in the Recoder Desktop app iframe.</p>
        </div>
        
        <div class="info">
            <h3>📊 Test Information</h3>
            <p><strong>User Agent:</strong> <span id="userAgent"></span></p>
            <p><strong>Window Size:</strong> <span id="windowSize"></span></p>
            <p><strong>Current URL:</strong> <span id="currentUrl"></span></p>
            <p><strong>Referrer:</strong> <span id="referrer"></span></p>
        </div>
        
        <div class="timestamp">
            Last loaded: <span id="timestamp"></span>
        </div>
    </div>

    <script>
        // Display test information
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('windowSize').textContent = `${window.innerWidth} x ${window.innerHeight}`;
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('referrer').textContent = document.referrer || 'Direct access';
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
        
        // Log to console for debugging
        console.log('✅ Test page loaded successfully in desktop app');
        console.log('User Agent:', navigator.userAgent);
        console.log('Window size:', window.innerWidth, 'x', window.innerHeight);
        
        // Test if we're in an iframe
        if (window.parent !== window) {
            console.log('✅ Successfully loaded in iframe');
            document.querySelector('.status p').textContent += ' (Running in iframe)';
        } else {
            console.log('ℹ️ Running in main window (not iframe)');
            document.querySelector('.status p').textContent += ' (Running in main window)';
        }
    </script>
</body>
</html>
