version: '3.8'

services:
  development:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"   # Web platform
      - "3001:3001"   # Backend API
      - "3002:3002"   # Production engine
      - "3003:3003"   # Chat platform
      - "8080:8080"   # API Gateway
      - "9090:9090"   # Prometheus
      - "3100:3100"   # Grafana
    environment:
      # DEV ONLY — these credentials are for local development containers only
      - NODE_ENV=development
      - POSTGRES_PASSWORD=password
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/recoder_dev
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-key
    depends_on:
      - postgres
      - redis
    networks:
      - recoder-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      # DEV ONLY — local development database
      POSTGRES_DB: recoder_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - recoder-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - recoder-network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - recoder-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      # DEV ONLY — local Grafana password
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - recoder-network

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  recoder-network:
    driver: bridge
