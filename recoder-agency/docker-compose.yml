services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agency
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency"]
      interval: 5s
      timeout: 3s
      retries: 5

  agency:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://agency:agency@postgres:5432/agency
      POSTGRES_URL: postgresql://agency:agency@postgres:5432/agency
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
