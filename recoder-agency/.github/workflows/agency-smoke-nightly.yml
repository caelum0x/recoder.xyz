name: Agency Smokes Nightly

on:
  workflow_dispatch:
    inputs:
      playwright_base_url:
        description: "Override Playwright base URL"
        required: false
      seeded_project_id:
        description: "Seeded project id for seeded transition smoke"
        required: false
  schedule:
    - cron: "15 5 * * *"

jobs:
  smoke-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium-authenticated
          - firefox-authenticated
          - webkit-authenticated
        spec:
          - tests/e2e/logged-in/admin-playbook-bootstrap-smoke.spec.ts
          - tests/e2e/logged-in/admin-transition-history-roundtrip.spec.ts
          - tests/e2e/logged-in/admin-retry-panel-suggestions.spec.ts
          - tests/e2e/logged-in/admin-delivery-ops-risk-filters.spec.ts
          - tests/e2e/logged-in/admin-delivery-ops-sla-breach-smoke.spec.ts
          - tests/e2e/logged-in/admin-templates-dod-smoke.spec.ts
          - tests/e2e/logged-in/admin-dod-blocking-panel.spec.ts
          - tests/e2e/logged-in/admin-dashboard-kpi-cards.spec.ts
          - tests/e2e/logged-in/admin-dashboard-rollout-flags.spec.ts
          - tests/e2e/logged-in/admin-dashboard-freshness-badge.spec.ts
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Set node version to 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
          PLAYWRIGHT_LOGIN_EMAIL: ${{ secrets.PLAYWRIGHT_LOGIN_EMAIL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret: AGENCY_STAGING_DATABASE_URL"
            exit 1
          fi
          if [ -z "${PLAYWRIGHT_LOGIN_EMAIL}" ]; then
            echo "Missing secret: PLAYWRIGHT_LOGIN_EMAIL"
            exit 1
          fi

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed deterministic playbook bootstrap fixtures
        env:
          DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
          PLAYWRIGHT_LOGIN_EMAIL: ${{ secrets.PLAYWRIGHT_LOGIN_EMAIL }}
        run: |
          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v playwright_login_email="$PLAYWRIGHT_LOGIN_EMAIL" \
            -f apps/agency/db/scripts/seed_playwright_playbook_smoke.sql

      - name: Install Playwright browsers
        run: pnpm --filter agency exec playwright install --with-deps

      - name: Run smoke spec
        working-directory: apps/agency
        run: pnpm exec playwright test --project="${{ matrix.browser }}" "${{ matrix.spec }}"
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.playwright_base_url || secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_LOGIN_EMAIL: ${{ secrets.PLAYWRIGHT_LOGIN_EMAIL }}
          PLAYWRIGHT_LOGIN_PASSWORD: ${{ secrets.PLAYWRIGHT_LOGIN_PASSWORD }}
      - name: Cleanup deterministic playbook bootstrap fixtures
        if: always()
        env:
          DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
          PLAYWRIGHT_LOGIN_EMAIL: ${{ secrets.PLAYWRIGHT_LOGIN_EMAIL }}
        run: |
          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v playwright_login_email="$PLAYWRIGHT_LOGIN_EMAIL" \
            -f apps/agency/db/scripts/cleanup_playwright_playbook_smoke.sql

  seeded-state-transition:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
      PLAYWRIGHT_CLIENT_SUPABASE_USER_ID: ${{ secrets.PLAYWRIGHT_CLIENT_SUPABASE_USER_ID }}
      PLAYWRIGHT_SEEDED_PROJECT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.seeded_project_id || 'e2e_client_review_project' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Set node version to 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Validate required secrets
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret: AGENCY_STAGING_DATABASE_URL"
            exit 1
          fi
          if [ -z "${PLAYWRIGHT_CLIENT_SUPABASE_USER_ID}" ]; then
            echo "Missing secret: PLAYWRIGHT_CLIENT_SUPABASE_USER_ID"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed deterministic client review project
        run: |
          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v client_supabase_user_id="$PLAYWRIGHT_CLIENT_SUPABASE_USER_ID" \
            -v project_id="$PLAYWRIGHT_SEEDED_PROJECT_ID" \
            -f apps/agency/db/scripts/seed_playwright_client_review_project.sql

      - name: Install Playwright browsers
        run: pnpm --filter agency exec playwright install --with-deps

      - name: Run seeded state-transition smoke
        working-directory: apps/agency
        run: pnpm exec playwright test --project=chromium-authenticated tests/e2e/logged-in/client-portal-seeded-transition.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.playwright_base_url || secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_LOGIN_EMAIL: ${{ secrets.PLAYWRIGHT_LOGIN_EMAIL }}
          PLAYWRIGHT_LOGIN_PASSWORD: ${{ secrets.PLAYWRIGHT_LOGIN_PASSWORD }}
          PLAYWRIGHT_SEEDED_PROJECT_ID: ${{ env.PLAYWRIGHT_SEEDED_PROJECT_ID }}
