name: Staging DB Delivery Transition Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  verify-delivery-transitions:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure staging database URL is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret: AGENCY_STAGING_DATABASE_URL"
            exit 1
          fi

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed and verify delivery transition paths
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/agency/db/scripts/seed_test_delivery_transitions.sql

      - name: Cleanup seeded E2E records
        if: always()
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/agency/db/scripts/cleanup_e2e_delivery_transitions.sql
