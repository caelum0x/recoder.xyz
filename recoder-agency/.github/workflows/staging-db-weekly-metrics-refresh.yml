name: Staging DB Weekly Metrics Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

jobs:
  refresh-weekly-delivery-metrics:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure staging database URL is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret: AGENCY_STAGING_DATABASE_URL"
            exit 1
          fi

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Refresh weekly delivery metrics
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f apps/agency/db/scripts/refresh_weekly_delivery_metrics.sql
