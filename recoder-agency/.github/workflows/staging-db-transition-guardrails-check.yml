name: Staging DB Transition Guardrails Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  verify-transition-guardrails:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure staging database URL is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret: AGENCY_STAGING_DATABASE_URL"
            exit 1
          fi

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify transition DB guardrails
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f apps/agency/db/scripts/test_transition_guardrails.sql
