name: Staging DB Weekly Metrics Fixture Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  verify-weekly-metrics-fixture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure staging database URL is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret: AGENCY_STAGING_DATABASE_URL"
            exit 1
          fi

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed fixture and refresh weekly metrics
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f apps/agency/db/scripts/seed_weekly_delivery_metrics_fixture.sql

      - name: Assert fixture KPI rows
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f apps/agency/db/scripts/assert_weekly_delivery_metrics_fixture.sql

      - name: Cleanup fixture records
        if: always()
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f apps/agency/db/scripts/cleanup_weekly_delivery_metrics_fixture.sql
