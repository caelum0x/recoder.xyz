# Nginx Reverse Proxy Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recoder-nginx
  namespace: recoder-production
  labels:
    app: recoder-nginx
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: recoder-nginx
      tier: frontend
  template:
    metadata:
      labels:
        app: recoder-nginx
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: nginx-run
          mountPath: /var/run
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
      volumes:
      - name: nginx-config
        configMap:
          name: recoder-nginx-config
          items:
          - key: nginx.conf
            path: nginx.conf
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-logs
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      securityContext:
        fsGroup: 101

---
apiVersion: v1
kind: Service
metadata:
  name: recoder-nginx-service
  namespace: recoder-production
  labels:
    app: recoder-nginx
    tier: frontend
spec:
  type: LoadBalancer  # Use LoadBalancer for cloud environments
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
  selector:
    app: recoder-nginx
    tier: frontend

---
# Ingress for advanced routing (optional, if using ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recoder-ingress
  namespace: recoder-production
  labels:
    app: recoder
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - recoder.xyz
    - www.recoder.xyz
    - api.recoder.xyz
    secretName: recoder-tls
  rules:
  - host: recoder.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: recoder-nginx-service
            port:
              number: 80
  - host: www.recoder.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: recoder-nginx-service
            port:
              number: 80
  - host: api.recoder.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: recoder-backend-service
            port:
              number: 3001