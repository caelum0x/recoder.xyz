# Recoder Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recoder-backend
  namespace: recoder-production
  labels:
    app: recoder-backend
    tier: backend
spec:
  replicas: 3  # Scale based on load
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: recoder-backend
      tier: backend
  template:
    metadata:
      labels:
        app: recoder-backend
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/api/metrics"
    spec:
      containers:
      - name: recoder-backend
        image: recoder/backend:latest  # Replace with your registry
        imagePullPolicy: IfNotPresent
        env:
        # Configuration from ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: recoder-backend-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: recoder-backend-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: recoder-backend-config
              key: LOG_LEVEL
        - name: RATE_LIMIT_WINDOW_MS
          valueFrom:
            configMapKeyRef:
              name: recoder-backend-config
              key: RATE_LIMIT_WINDOW_MS
        - name: RATE_LIMIT_MAX_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: recoder-backend-config
              key: RATE_LIMIT_MAX_REQUESTS
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: recoder-backend-config
              key: CORS_ORIGIN
        
        # Database secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: recoder-database-secret
              key: DATABASE_URL
        
        # Redis secrets
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: recoder-redis-secret
              key: REDIS_URL
        
        # JWT secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: recoder-jwt-secret
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: recoder-jwt-secret
              key: JWT_REFRESH_SECRET
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: recoder-jwt-secret
              key: ENCRYPTION_KEY
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: recoder-jwt-secret
              key: WEBHOOK_SECRET
        
        # AI Provider secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: recoder-ai-secrets
              key: ANTHROPIC_API_KEY
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: recoder-ai-secrets
              key: GROQ_API_KEY
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: recoder-ai-secrets
              key: GOOGLE_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: recoder-ai-secrets
              key: OPENAI_API_KEY
        - name: OLLAMA_BASE_URL
          valueFrom:
            secretKeyRef:
              name: recoder-ai-secrets
              key: OLLAMA_BASE_URL
        
        # OAuth secrets
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: recoder-oauth-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: recoder-oauth-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: recoder-oauth-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: recoder-oauth-secrets
              key: GITHUB_CLIENT_SECRET
        - name: MICROSOFT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: recoder-oauth-secrets
              key: MICROSOFT_CLIENT_ID
        - name: MICROSOFT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: recoder-oauth-secrets
              key: MICROSOFT_CLIENT_SECRET
        
        # Payment secrets
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: recoder-payment-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: recoder-payment-secrets
              key: STRIPE_WEBHOOK_SECRET
        
        # Email secrets
        - name: EMAIL_SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: recoder-email-secrets
              key: EMAIL_SMTP_HOST
        - name: EMAIL_SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: recoder-email-secrets
              key: EMAIL_SMTP_PORT
        - name: EMAIL_SMTP_USER
          valueFrom:
            secretKeyRef:
              name: recoder-email-secrets
              key: EMAIL_SMTP_USER
        - name: EMAIL_SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: recoder-email-secrets
              key: EMAIL_SMTP_PASS
        
        # Monitoring secrets
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: recoder-monitoring-secrets
              key: SENTRY_DSN
        
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: uploads
          mountPath: /app/uploads
        - name: cache
          mountPath: /app/cache
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: uploads
        emptyDir: {}  # In production, use persistent volume
      - name: cache
        emptyDir: {}
      
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - recoder-backend
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: recoder-backend-service
  namespace: recoder-production
  labels:
    app: recoder-backend
    tier: backend
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: recoder-backend
    tier: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recoder-backend-hpa
  namespace: recoder-production
  labels:
    app: recoder-backend
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recoder-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max