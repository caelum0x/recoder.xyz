# SSL/TLS Certificate Management with cert-manager
# Production-ready certificate automation

# ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: recoder
    security-tier: certificates
spec:
  acme:
    # Replace with your email
    email: admin@recoder.xyz
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
        selector:
          dnsNames:
          - 'recoder.xyz'
          - '*.recoder.xyz'

---
# Staging ClusterIssuer for testing
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: recoder
    security-tier: certificates
spec:
  acme:
    email: admin@recoder.xyz
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Main domain certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: recoder-xyz-tls
  namespace: recoder-production
  labels:
    app: recoder
    security-tier: certificates
spec:
  secretName: recoder-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - recoder.xyz
  - www.recoder.xyz
  - api.recoder.xyz
  - app.recoder.xyz
  - cdn.recoder.xyz
  - ws.recoder.xyz

---
# Wildcard certificate (requires DNS validation)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: recoder-wildcard-tls
  namespace: recoder-production
  labels:
    app: recoder
    security-tier: certificates
spec:
  secretName: recoder-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - '*.recoder.xyz'
  - recoder.xyz

---
# Cloudflare API token secret (for DNS validation)
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  labels:
    app: recoder
    security-tier: certificates
type: Opaque
stringData:
  api-token: "CHANGE_ME_CLOUDFLARE_API_TOKEN"

---
# Custom CA certificate (for development/testing)
apiVersion: v1
kind: Secret
metadata:
  name: recoder-custom-ca
  namespace: recoder-production
  labels:
    app: recoder
    security-tier: certificates
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # Generate with: openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...  # CHANGE_ME
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...  # CHANGE_ME

---
# TLS Configuration for Nginx
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-tls-config
  namespace: recoder-production
  labels:
    app: recoder-nginx
    security-tier: certificates
data:
  tls.conf: |
    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss: https:; frame-ancestors 'none';" always;

---
# Certificate monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager-metrics
  namespace: recoder-production
  labels:
    app: cert-manager
    security-tier: certificates
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  endpoints:
  - port: http-metrics
    path: /metrics

---
# Alert rules for certificate expiry
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificate-expiry-alerts
  namespace: recoder-production
  labels:
    app: recoder
    security-tier: certificates
spec:
  groups:
  - name: certificates
    rules:
    - alert: CertificateExpiringSoon
      expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Certificate expires in less than 7 days"
        description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
    
    - alert: CertificateExpired
      expr: probe_ssl_earliest_cert_expiry - time() <= 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Certificate has expired"
        description: "Certificate for {{ $labels.instance }} has expired"