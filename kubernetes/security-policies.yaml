# Recoder.xyz Kubernetes Security Policies
# Enterprise-grade security configuration

# Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: recoder-restricted-psp
  namespace: recoder-production
  labels:
    app: recoder
    security-tier: restricted
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: true
  seLinux:
    rule: 'RunAsAny'

---
# Network Policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recoder-backend-netpol
  namespace: recoder-production
  labels:
    app: recoder-backend
    security-tier: backend
spec:
  podSelector:
    matchLabels:
      app: recoder-backend
      tier: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: recoder-nginx
          tier: frontend
    ports:
    - protocol: TCP
      port: 3001
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: recoder-postgres
          tier: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: recoder-redis
          tier: cache
    ports:
    - protocol: TCP
      port: 6379
  - to: []  # Allow external API calls (AI providers, etc.)
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recoder-database-netpol
  namespace: recoder-production
  labels:
    app: recoder-postgres
    security-tier: database
spec:
  podSelector:
    matchLabels:
      app: recoder-postgres
      tier: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: recoder-backend
          tier: backend
    ports:
    - protocol: TCP
      port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recoder-redis-netpol
  namespace: recoder-production
  labels:
    app: recoder-redis
    security-tier: cache
spec:
  podSelector:
    matchLabels:
      app: recoder-redis
      tier: cache
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: recoder-backend
          tier: backend
    ports:
    - protocol: TCP
      port: 6379

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recoder-nginx-netpol
  namespace: recoder-production
  labels:
    app: recoder-nginx
    security-tier: frontend
spec:
  podSelector:
    matchLabels:
      app: recoder-nginx
      tier: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []  # Allow from anywhere
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: recoder-backend
          tier: backend
    ports:
    - protocol: TCP
      port: 3001

---
# RBAC Configuration
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recoder-backend-sa
  namespace: recoder-production
  labels:
    app: recoder-backend
    security-tier: backend

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: recoder-production
  name: recoder-backend-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recoder-backend-rolebinding
  namespace: recoder-production
subjects:
- kind: ServiceAccount
  name: recoder-backend-sa
  namespace: recoder-production
roleRef:
  kind: Role
  name: recoder-backend-role
  apiGroup: rbac.authorization.k8s.io

---
# Security Context Constraints (OpenShift)
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: recoder-restricted-scc
  labels:
    app: recoder
    security-tier: restricted
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: MustRunAs
  ranges:
  - min: 1
    max: 65535
readOnlyRootFilesystem: true
requiredDropCapabilities:
- ALL
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: MustRunAs
  ranges:
  - min: 1
    max: 65535
users:
- system:serviceaccount:recoder-production:recoder-backend-sa
volumes:
- configMap
- downwardAPI
- emptyDir
- persistentVolumeClaim
- projected
- secret

---
# Resource Quotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: recoder-resource-quota
  namespace: recoder-production
  labels:
    app: recoder
    security-tier: resource-management
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
    pods: "50"

---
# Limit Ranges
apiVersion: v1
kind: LimitRange
metadata:
  name: recoder-limit-range
  namespace: recoder-production
  labels:
    app: recoder
    security-tier: resource-management
spec:
  limits:
  - type: "Pod"
    max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
  - type: "Container"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
  - type: "PersistentVolumeClaim"
    min:
      storage: "1Gi"
    max:
      storage: "100Gi"