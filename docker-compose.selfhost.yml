# Recoder one-command self-host stack.
#
# Master plan wave 6: "single-command self-hosted Recoder (compose + daemon)".
#
# Brings up the full control plane and its data dependencies:
#   backend   the Recoder control plane (backend, port 3100, built from
#             its Dockerfile — includes the substrate stage that bakes the pinned
#             tmux + bd binaries the Conductor drives)
#   postgres  postgres:17 with an init that creates recoder_main / recoder_backend
#             / recoder_pm
#   redis     redis:7 (sessions, A2A bus)
#   qdrant    vector store (mem0 / embeddings)
#   recoder-xds       Go Envoy xDS (ADS) control plane — serves DYNAMIC
#                     LDS/CDS/RDS so Envoy gets live network-config updates
#                     without a restart (mirrors backend/src/network).
#   recoder-governance  Rust governance daemon — boots a deny-biased
#                     GovernanceKernel and serves the typed IPC over a
#                     Unix-domain socket on a SHARED volume. The backend's
#                     @recoder/governance facade delegates to it via
#                     GOVERNANCE_SOCKET and falls back to its pure-TS deny-biased
#                     path on any failure (so this service is fail-safe, never a
#                     hard dependency).
#   envoy     L7 edge proxy. Consumes the DYNAMIC xDS config (ADS -> recoder-xds)
#             with the static bootstrap as the always-on fallback.
#
# Bring it up with `scripts/selfhost-up.sh` (validates env, generates safe
# secrets, waits for health). Never put real secrets in this file or in
# .env.selfhost.example — the up-script and your own .env.selfhost carry them.
#
# IMPORTANT build context: the backend image is built with the REPO ROOT as
# context (`context: .`) because backend/Dockerfile copies sibling paths
# (packages/, shared/, pi-mono-dist/, c/, go/, scripts/) and the prebuilt
# backend/dist/server.js. See deploy/README.md for the prerequisites.

name: recoder-selfhost

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    # pgvector/pgvector:pg17 (not plain postgres:17): same Postgres 17, plus
    # the pgvector extension pre-built. recoder_pm is documented as "pm +
    # pgvector" and backend's own migration 0000 unconditionally does `create
    # extension if not exists vector`, which hard-fails on plain postgres:17
    # ("extension vector is not available" — verified 2026-10-19 running this
    # stack from a fresh volume). Matches the pgvector/pgvector:pg17 image
    # this portfolio already uses for other Postgres-with-pgvector stacks
    # (e.g. infra-box/stacks/caldesk).
    image: pgvector/pgvector:pg17
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: recoder_main
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      # backend/migrations/*.sql applied into recoder_backend by the init script
      # above (see that script's header) — mounted read-only so Postgres' own
      # first-boot init can see them without needing the backend image built
      # first. Without this, the backend crashes at boot on every fresh
      # volume with "relation \"core.kv_store\" does not exist": nothing else
      # in this stack ever applies schema (verified 2026-10-19 — the backend
      # only exposes an authenticated POST /internal/persistence/migrate route
      # that requires the backend to already be running, which it can't be
      # against an unmigrated database).
      - ./backend/migrations:/docker-entrypoint-initdb.d/backend-migrations:ro
    healthcheck:
      # Wait for ALL three databases, not just the default, so dependents only
      # start once the init script has finished creating them.
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d recoder_main && pg_isready -U $${POSTGRES_USER} -d recoder_backend && pg_isready -U $${POSTGRES_USER} -d recoder_pm"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    <<: *restart
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # Qdrant's readiness probe; the image ships a TCP listener on 6333.
      # NOTE: must run via bash explicitly, not CMD-SHELL (which execs /bin/sh).
      # The qdrant/qdrant image's /bin/sh is dash, which does not support the
      # /dev/tcp bashism below ("Directory nonexistent") — verified this makes
      # the container report unhealthy forever even though it serves traffic
      # fine (2026-10-19). bash IS present in the image at /usr/bin/bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recoder/backend:selfhost
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # Ordering only (service_started), NOT a health gate: the backend governs
      # via its pure-TS fallback if the daemon is down, so we never block startup
      # on governance. This just gives the socket a head start.
      recoder-governance:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-3100}:3100"
    volumes:
      # The Conductor manages sibling containers (agent sandboxes) via the host
      # Docker socket. Mounted read-write because it must create/stop containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - backenddata:/app/backend/data
      # Shared governance IPC socket dir. The recoder-governance daemon binds the
      # socket here; the backend delegates to it via GOVERNANCE_SOCKET. Both run as
      # uid 1001 so peer-cred (same-uid) auth succeeds across containers.
      - governance-sock:/run/recoder-governance
    environment:
      NODE_ENV: production
      PORT: "3100"
      # --- Datastores (compose-internal DNS names) ---
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/recoder_backend"
      AGENT_OS_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/recoder_backend"
      AUTH_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/recoder_main"
      PM_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/recoder_pm"
      REDIS_URL: "redis://redis:6379"
      QDRANT_URL: "http://qdrant:6333"
      # Postgres here is a plain `postgres:17` container reachable only on the
      # private `recoder-selfhost` Docker network, with no TLS cert configured.
      # backend/src/bootstrap/config.ts defaults DATABASE_SSL to `isProduction`
      # (true, since NODE_ENV=production above) when unset, so the pg client
      # tried to negotiate SSL against a server that doesn't speak it and
      # crashed boot outright ("The server does not support SSL connections" —
      # fatal, not degrade-safe, verified 2026-10-19 running this exact stack
      # end-to-end). Explicitly disable it for the self-host network boundary.
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # --- Control-plane identity / governance (required) ---
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      RECODER_GOVERNANCE_SIGNING_KEY: ${RECODER_GOVERNANCE_SIGNING_KEY:?RECODER_GOVERNANCE_SIGNING_KEY is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # Required by packages/auth/src/keys.ts (no default there) for Better
      # Auth's callback base URL. Unset makes createAuth() throw and the
      # identity domain degrade truthfully (verified: backend still boots,
      # auth routes just report unavailable) — but self-host should default to
      # a working value so auth isn't silently dead out of the box. Point it
      # at the Envoy edge by default since that's the governed entry point;
      # override to your real external hostname when exposing this past
      # localhost.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${EDGE_HTTP_PORT:-8080}}
      # Delegate governance to the owned Rust daemon over the shared socket. The
      # facade falls back to its pure-TS deny-biased path on ANY failure, so an
      # unset/dead socket degrades truthfully instead of failing the backend.
      GOVERNANCE_SOCKET: ${GOVERNANCE_SOCKET:-/run/recoder-governance/governance.sock}
      # --- Billing (Polar) — optional; degrades safe when unset ---
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_SERVER: ${POLAR_SERVER:-production}
      # --- Agent sandboxes (Daytona) — optional; degrades safe when unset ---
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_ORGANIZATION_ID: ${DAYTONA_ORGANIZATION_ID:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      USE_DAYTONA_CONTAINERS: ${USE_DAYTONA_CONTAINERS:-false}
      # --- Model providers (BYOK) — optional ---
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Envoy xDS (ADS) control plane ──────────────────────────────────────────
  # Serves DYNAMIC LDS/CDS/RDS so Envoy receives live network-config updates with
  # no restart. It REUSES the backend image (recoder/backend:selfhost),
  # which bakes the recoder-xds binary at /opt/recoder/bin/recoder-xds in its
  # substrate stage — so no second large build. The `build:` block is identical to
  # `backend` so compose resolves the SAME image tag (built once) and this service
  # just overrides the entrypoint to exec the xDS binary.
  #
  # Degrade-safe: if the binary was not built (toolchain absent), the entrypoint's
  # guard exits non-zero, this service stays unhealthy, and Envoy keeps serving via
  # its static fallback listener. The edge never goes dark because of xDS.
  recoder-xds:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recoder/backend:selfhost
    <<: *restart
    depends_on:
      backend:
        condition: service_healthy
    # /opt/recoder/bin/recoder-xds is only present when the substrate build
    # produced it. Fail loudly (not silently) if absent so the service reports
    # unhealthy rather than pretending to serve.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -x /opt/recoder/bin/recoder-xds
        || { echo "recoder-xds binary not built into image; Envoy keeps static bootstrap" >&2; exit 1; };
        exec /opt/recoder/bin/recoder-xds
        --xds-addr ":${XDS_LISTEN_PORT:-18000}"
        --health-addr ":${XDS_HEALTH_PORT:-18001}"
    environment:
      # Derive the NetworkConfig from the live backend when its config route is
      # available; if XDS_CONFIG_URL is empty the daemon uses env-derived defaults
      # (matching the static generator). Never a hard failure.
      XDS_CONFIG_URL: ${XDS_CONFIG_URL:-}
      XDS_LOG_LEVEL: ${XDS_LOG_LEVEL:-info}
      # The HTTPS listener's JSON access-log sink (see envoy service's
      # envoy-logs volume comment) hits a Permission denied trying to open a
      # real file in this environment for reasons short of a full Envoy
      # sandboxing investigation. /dev/null is always openable/writable, so
      # this closes the gap without chasing Envoy's file-access internals.
      ENVOY_ACCESS_LOG: ${ENVOY_ACCESS_LOG:-/dev/null}
    healthcheck:
      # /healthz flips to 200 once the snapshot is installed and ADS is serving.
      # NOTE: must run via bash explicitly (see the qdrant healthcheck note above)
      # — this image's /bin/sh is dash, which cannot do /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${XDS_HEALTH_PORT:-18001} && echo -e 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Governance daemon (Rust) ───────────────────────────────────────────────
  # Boots a deny-biased GovernanceKernel and serves the typed IPC over a Unix
  # socket on the shared `governance-sock` volume. The backend delegates to it via
  # GOVERNANCE_SOCKET and falls back to its pure-TS deny-biased path on any
  # failure, so this is an enhancement, never a hard dependency. Built from its own
  # small Dockerfile (deploy/governance-daemon.Dockerfile) to keep the Rust
  # toolchain out of the main backend image.
  recoder-governance:
    build:
      context: .
      dockerfile: deploy/governance-daemon.Dockerfile
    image: recoder/governance-daemon:selfhost
    <<: *restart
    environment:
      # Required: the daemon refuses to start without it (fail-closed). Shared with
      # the backend so both speak the same authenticated channel.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      # Socket path on the shared volume; must match the backend's GOVERNANCE_SOCKET.
      GOVERNANCE_SOCKET: ${GOVERNANCE_SOCKET:-/run/recoder-governance/governance.sock}
    volumes:
      - governance-sock:/run/recoder-governance
    healthcheck:
      # The socket file exists once the daemon has bound and is accepting.
      test: ["CMD-SHELL", "test -S \"$${GOVERNANCE_SOCKET:-/run/recoder-governance/governance.sock}\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    <<: *restart
    depends_on:
      backend:
        condition: service_healthy
      # Ordering only: Envoy must start whether or not xDS is healthy, because its
      # static fallback listener keeps the edge serving. service_started, NOT
      # service_healthy, so a degraded/absent xDS never blocks the edge.
      recoder-xds:
        condition: service_started
    command:
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--service-cluster"
      - "recoder-selfhost"
    ports:
      - "${EDGE_HTTP_PORT:-8080}:8080"
      - "${ENVOY_ADMIN_PORT:-9901}:9901"
    volumes:
      # DYNAMIC xDS bootstrap (ADS -> recoder-xds) with a static fallback listener.
      # To pin the pure-static bootstrap instead, point this at
      # ./deploy/envoy/envoy.selfhost.yaml.
      - ./deploy/envoy/envoy.xds.yaml:/etc/envoy/envoy.yaml:ro
      # recoder-xds always emits an HTTPS listener referencing these exact
      # paths (ENVOY_TLS_CERT/ENVOY_TLS_KEY default in network_config.go);
      # without real files here Envoy NACKs that listener update in a tight,
      # noisy retry loop forever (verified 2026-10-19). scripts/selfhost-up.sh
      # generates a self-signed pair here on first run if absent.
      - ./deploy/envoy/certs:/etc/envoy/certs:ro
      # Same HTTPS listener also hard-codes a JSON access-log sink at
      # ENVOY_ACCESS_LOG (default /var/log/envoy/access.json.log); with no
      # writable directory there Envoy NACKs the listener with "unable to
      # open file" instead (verified 2026-10-19, same symptom class as the
      # cert gap above — the static HTTP listener on :8080 keeps serving
      # either way, but a perpetually-rejected config update is real log
      # spam, not a clean steady state).
      - envoy-logs:/var/log/envoy
    healthcheck:
      # Envoy admin /ready returns 200 LIVE once the listeners are warmed.
      # NOTE: must run via bash explicitly (see the qdrant healthcheck note above)
      # — envoyproxy/envoy's /bin/sh is dash, which cannot do /dev/tcp.
      # NOTE 2: the request MUST be HTTP/1.1 with a Host header (and
      # Connection: close so the socket read terminates). A bare HTTP/1.0
      # request with no Host header gets "426 Upgrade Required" from Envoy's
      # admin server instead of the real response — verified 2026-10-19
      # running this exact healthcheck command by hand: it failed 100% of the
      # time (every retry, zero output) even while `curl` from the host and
      # Envoy itself serving real traffic both worked fine. This was a false
      # "unhealthy" on a genuinely healthy Envoy, not a real outage.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q LIVE"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  backenddata:
  governance-sock:
  envoy-logs:

networks:
  default:
    name: recoder-selfhost
