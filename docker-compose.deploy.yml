services:
  redis:
    image: redis:7-alpine
    container_name: recoder-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - recoder

  docker-backend:
    build:
      context: .
      dockerfile: docker-backend/Dockerfile
    container_name: recoder-docker-backend
    restart: unless-stopped
    command: ["pnpm", "exec", "tsx", "src/server.ts"]
    ports:
      - "3100:3100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./docker-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3100
      - NODE_OPTIONS=--max_old_space_size=1536
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PUBLIC_PROMPT_TASK_QUEUE_BACKEND=redis
      - RECODER_A2A_SHARED_SECRET=${RECODER_A2A_SHARED_SECRET}
      - RECODER_A2A_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RECODER_A2A_ENABLE_CONSUMER=true
      - RECODER_A2A_CONSUMER_SERVICE=recoder_backend
      - RECODER_A2A_CONSUME_UNTARGETED=true
      - RECODER_A2A_PLAN_HANDLER_URL=http://recoder-web:5173/api/a2a/intents/plan
      - RECODER_A2A_EXECUTE_HANDLER_URL=http://recoder-web:5173/api/a2a/intents/execute
      - RECODER_A2A_HANDOFF_HANDLER_URL=http://recoder-web:5173/api/a2a/intents/handoff
      - RECODER_A2A_TOOL_CALL_HANDLER_URL=http://recoder-web:5173/api/a2a/intents/tool_call
      - RECODER_A2A_DEFAULT_HANDLER_URL=http://recoder-web:5173/api/a2a/intents/execute
      - RECODER_A2A_CANVAS_HANDLER_URL=http://recoder-agents:3001/api/canvas/push
      - RECODER_A2A_WORKER_TOKEN=${RECODER_A2A_WORKER_TOKEN}
      # A2A gateway identity and security
      - RECODER_A2A_AGENT_ID=docker-backend
      - RECODER_A2A_ADMIN_TOKEN=${RECODER_A2A_ADMIN_TOKEN:-}
      - RECODER_A2A_BRIDGE_TOKEN=${RECODER_A2A_BRIDGE_TOKEN:-}
      - RECODER_A2A_EGRESS_ALLOWLIST=http://recoder-web:5173,http://openclaw-gateway:18789
      - RECODER_A2A_ALLOWED_AGENTS=codex,claude_code,recoder-web,docker-backend,openclaw-gateway,recoder-agency,recoder-pm
      - QDRANT_URL=http://qdrant:6333
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-recoder_meili_dev_key}
      - OPENMETER_URL=http://openmeter:8888  # internal Docker port (host: 8889)
      - FLAGSMITH_URL=http://flagsmith:8000
      - NATS_URL=nats://nats:4222
      - USE_DAYTONA_CONTAINERS=${USE_DAYTONA_CONTAINERS:-true}
      - DAYTONA_SERVER_URL=${DAYTONA_SERVER_URL:-http://host.docker.internal:3900/api}
      - ZROK_API_URL=${ZROK_API_URL:-http://zrok-controller:18080}
      - ZROK_TOKEN=${ZROK_TOKEN:-}
      - ZROK_FRONTEND=${ZROK_FRONTEND:-preview.recoder.xyz}
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN:-}
      - HATCHET_CLIENT_HOST=hatchet-engine:7077
      # Tier-1 connector flags (runtime image installs codex/claude CLIs).
      - RECODER_A2A_ENABLE_CODEX=${RECODER_A2A_ENABLE_CODEX:-true}
      - RECODER_A2A_ENABLE_CLAUDE_CODE=${RECODER_A2A_ENABLE_CLAUDE_CODE:-true}
      # OpenCode centralized service
      - OPENCODE_SERVICE_URL=http://opencode-service:4096
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-recoder_opencode_key}
      - OPENCODE_SERVER_USERNAME=opencode
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    stop_grace_period: 45s
    networks:
      - recoder

  opencode-service:
    build:
      context: ./docker-backend/vendor/opencode
      dockerfile: Dockerfile.service
    container_name: recoder-opencode
    restart: unless-stopped
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-recoder_opencode_key}
      - OPENCODE_SERVER_USERNAME=opencode
      - OPENCODE_DB=/data/opencode.db
      - XDG_DATA_HOME=/data
      - XDG_CONFIG_HOME=/config
      - XDG_CACHE_HOME=/cache
      - XDG_STATE_HOME=/state
      - BUN_RUNTIME_TRANSPILER_CACHE_PATH=0
    volumes:
      - opencode-data:/data
      - opencode-config:/config
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "bun", "-e", "const u=process.env.OPENCODE_SERVER_USERNAME||'opencode';const p=process.env.OPENCODE_SERVER_PASSWORD;const h=p?{Authorization:'Basic '+Buffer.from(u+':'+p).toString('base64')}:{};fetch('http://localhost:4096/session',{headers:h}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    networks:
      - recoder

  recoder-web:
    build:
      context: .
      dockerfile: recoder-web/Dockerfile
    container_name: recoder-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./recoder-web/.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5173
      - DOCKER_BACKEND_URL=http://recoder-docker-backend:3100
      - VITE_DOCKER_BACKEND_URL=http://recoder-docker-backend:3100
      - MAIN_SITE_URL=https://recoder.xyz
      - MAIN_SITE_INTERNAL_URL=http://host.docker.internal:3000
      - VITE_MAIN_SITE_URL=https://recoder.xyz
      - RECODER_A2A_SHARED_SECRET=${RECODER_A2A_SHARED_SECRET}
      - RECODER_A2A_AGENT_ID=recoder-web
      - RECODER_A2A_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RECODER_A2A_PLAN_HANDLER_URL=http://recoder-docker-backend:3100/api/a2a/intent/plan
      - RECODER_A2A_EXECUTE_HANDLER_URL=http://recoder-docker-backend:3100/api/a2a/intent/execute
      - RECODER_A2A_HANDOFF_HANDLER_URL=http://recoder-docker-backend:3100/api/a2a/intent/handoff
      - RECODER_A2A_TOOL_CALL_HANDLER_URL=http://recoder-docker-backend:3100/api/a2a/intent/tool_call
      - RECODER_A2A_WORKER_TOKEN=${RECODER_A2A_WORKER_TOKEN}
      - RECODER_A2A_EGRESS_ALLOWLIST=http://recoder-docker-backend:3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/api/health',{redirect:'manual'}).then(r => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    stop_grace_period: 30s
    networks:
      - recoder

  recoder-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: recoder-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./app/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=https://recoder.xyz
      - NEXT_PUBLIC_RECODER_WEB_URL=https://web.recoder.xyz
      - BACKEND_URL=http://recoder-docker-backend:3100
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_main
      - AUTH_DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_main
      - REDIS_URL=redis://recoder-redis:6379
    depends_on:
      redis:
        condition: service_healthy
      docker-backend:
        condition: service_healthy
    healthcheck:
      # Use node fetch instead of curl: recoder-app can hit its 2G cgroup limit,
      # at which point forking curl triggers OOM-kill (exit 137) even when the
      # app itself is responsive. node -e runs in-process, no fork. See
      # plan.md "recoder-app unhealthy" section for the 2026-04-05 incident.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  recoder-frontend:
    build:
      context: .
      dockerfile: recoder-agents/Dockerfile
      args:
        APP_PORT: 3001
        PNPM_LOCKFILE_MODE: --no-frozen-lockfile
    container_name: recoder-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./recoder-agents/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_APP_URL=https://agents.recoder.xyz
      - NEXT_PUBLIC_API_URL=http://recoder-docker-backend:3100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001',{redirect:'manual'}).then(r => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    stop_grace_period: 30s
    networks:
      - recoder

  openclaw-gateway:
    build: ./openclaw
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - NODE_OPTIONS=--max_old_space_size=1536
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
    command: ["node", "dist/index.js", "gateway", "--allow-unconfigured", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:18789/health').then(r => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - recoder

  # --- Monitoring exporters ---
  node-exporter:
    image: prom/node-exporter:latest
    container_name: recoder-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD-SHELL", "node_exporter --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - recoder

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: recoder-redis-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    networks:
      - recoder

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:latest
    container_name: recoder-blackbox-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9115:9115"
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9115/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    networks:
      - recoder

  # ================================================================
  # VictoriaMetrics — Prometheus-compatible TSDB (lighter, faster)
  # Replaces Prometheus. Uses same prometheus.yml scrape config.
  # Listens on :9090 for PromQL-compat so Grafana works unchanged.
  # ================================================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: recoder-victoriametrics
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8428"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - victoriametrics-data:/victoria-metrics-data
    command:
      - '-promscrape.config=/etc/prometheus/prometheus.yml'
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=30d'
      - '-httpListenAddr=:8428'
      - '-search.latencyOffset=5s'
      - '-promscrape.config.strictParse=false'
    depends_on:
      node-exporter:
        condition: service_healthy
      redis-exporter:
        condition: service_healthy
      blackbox-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8428/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - recoder

  alertmanager:
    image: prom/alertmanager:latest
    container_name: recoder-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
      - ./scripts/alertmanager-entrypoint.sh:/app/alertmanager-entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_CRITICAL_WEBHOOK_URL=${ALERT_CRITICAL_WEBHOOK_URL:-}
      - ALERT_SLACK_API_URL=${ALERT_SLACK_API_URL:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_AUTH_USERNAME=${SMTP_AUTH_USERNAME:-}
      - SMTP_AUTH_PASSWORD=${SMTP_AUTH_PASSWORD:-}
    entrypoint: ["/bin/sh", "/app/alertmanager-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    networks:
      - recoder

  grafana:
    image: grafana/grafana:11.4-alpine
    container_name: recoder-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://recoder.xyz/grafana}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    networks:
      - recoder

  # Build the base workspace image
  recoder-base:
    build: ./docker-backend/docker
    image: recoder-workspace:latest
    profiles:
      - build-base

  # ================================================================
  # Qdrant — Vector store for agent memory and semantic code search
  # ================================================================
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: recoder-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__ENABLE_TLS=false
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - recoder

  # ================================================================
  # Trigger.dev — Background job execution (indexing, email, webhooks)
  # Apache 2.0, self-hosted, long-running tasks with retries + queues.
  # Dashboard: http://localhost:3010
  # ================================================================
  trigger-dev:
    image: ghcr.io/triggerdotdev/trigger.dev:latest
    container_name: recoder-trigger
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_backend
      - DIRECT_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_backend
      - SESSION_SECRET=${TRIGGER_SESSION_SECRET:-recoder_trigger_session_secret}
      - MAGIC_LINK_SECRET=${TRIGGER_MAGIC_LINK_SECRET:-recoder_trigger_magic_link_secret}
      - ENCRYPTION_KEY=${TRIGGER_ENCRYPTION_KEY:-recoder_trigger_encryption_key_32ch}
      - LOGIN_ORIGIN=http://localhost:3010
      - APP_ORIGIN=http://localhost:3010
      - V3_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  # ================================================================
  # Steel — Managed browser pool for agent web automation
  # Provides anti-detection, session persistence, CDP access.
  # ================================================================
  steel:
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: recoder-steel
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3000"
    environment:
      - STEEL_LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    shm_size: '1gb'
    networks:
      - recoder

  # ================================================================
  # Hatchet — Durable workflow execution engine (replaces Giselle)
  # Dashboard: http://localhost:8080 (admin)
  # API: http://localhost:7077 (gRPC for workers)
  # Bootstrap: docker exec recoder-hatchet /hatchet-admin quickstart --skip create-tenant
  # ================================================================
  # Migration init: runs DB migration before engine starts
  hatchet-migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:latest
    container_name: recoder-hatchet-migrate
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder
    restart: "no"

  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:latest
    container_name: recoder-hatchet
    restart: unless-stopped
    depends_on:
      hatchet-migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7077:7077"
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_backend
      - DATABASE_POSTGRES_PORT=5432
      - DATABASE_POSTGRES_HOST=${HOST_POSTGRES_HOST:-host.docker.internal}
      - DATABASE_POSTGRES_USERNAME=recoder
      - DATABASE_POSTGRES_PASSWORD=recoder_prod_2026
      - DATABASE_POSTGRES_DB_NAME=recoder_backend
      - SERVER_GRPC_BIND_ADDRESS=0.0.0.0
      - SERVER_GRPC_PORT=7077
      - SERVER_GRPC_INSECURE=true
      - SERVER_AUTH_SET_IF_NOT_EXISTS=true
      - SERVER_AUTH_COOKIE_DOMAIN=localhost
      - SERVER_AUTH_COOKIE_INSECURE=true
      - SERVER_ENCRYPTION_MASTER_KEYSET=${HATCHET_MASTER_ENCRYPTION_KEY:-}
      - SERVER_ENCRYPTION_JWT_PRIVATE_KEYSET=${HATCHET_JWT_SECRET:-}
      - SERVER_TASKQUEUE_KIND=postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7077/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  hatchet-api:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-api:latest
    container_name: recoder-hatchet-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_backend
      - SERVER_AUTH_SET_IF_NOT_EXISTS=true
    depends_on:
      hatchet-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  # ================================================================
  # Zrok — Zero-trust overlay tunnels for instant preview URLs
  # Provides {projectId}.preview.recoder.xyz → sandbox:5173
  # Prerequisite: Cloudflare wildcard DNS *.preview.recoder.xyz → 77.42.23.19
  # Bootstrap: docker exec recoder-zrok zrok admin bootstrap
  # ================================================================
  zrok-controller:
    image: openziti/zrok:latest
    container_name: recoder-zrok
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    environment:
      - ZROK_ADMIN_TOKEN=${ZROK_ADMIN_TOKEN:-recoder_zrok_admin}
      - ZROK_API_ENDPOINT=http://0.0.0.0:18080
      - PFXLOG_NO_JSON=true
    command: ["controller", "/etc/zrok/ctrl.yml"]
    volumes:
      - ./monitoring/zrok/ctrl.yml:/etc/zrok/ctrl.yml:ro
      - zrok-data:/var/lib/zrok
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18080/api/v1/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    networks:
      - recoder

  zrok-frontend:
    image: openziti/zrok:latest
    container_name: recoder-zrok-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    command: ["access", "public", "--headless"]
    environment:
      - ZROK_API_ENDPOINT=http://zrok-controller:18080
    depends_on:
      zrok-controller:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    networks:
      - recoder

  # ================================================================
  # Docs — Starlight developer documentation (docs.recoder.xyz)
  # Build: cd docs/site && npm install && npm run build
  # Serves static output via nginx
  # ================================================================
  docs:
    image: nginx:1.27-alpine
    container_name: recoder-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:80"
    volumes:
      - ./docs/site/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    networks:
      - recoder

  # ================================================================
  # NATS — Lightweight event bus with JetStream for A2A messaging
  # Replaces Redis pub/sub for real-time event fan-out. ~20MB RAM.
  # ================================================================
  nats:
    image: nats:2.10-alpine
    container_name: recoder-nats
    restart: unless-stopped
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"   # monitoring dashboard
    entrypoint: ["nats-server"]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    networks:
      - recoder

  # ================================================================
  # OpenMeter — Usage metering for billing foundation
  # Provides per-user token spend, per-project cost, per-model breakdown.
  # ================================================================
  openmeter:
    image: ghcr.io/openmeterio/openmeter:latest
    container_name: recoder-openmeter
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8888"
    environment:
      - POSTGRES_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  # ================================================================
  # Flagsmith — Feature flags for gradual rollouts, A/B tests, kill-switches
  # ================================================================
  flagsmith:
    image: flagsmith/flagsmith:latest
    container_name: recoder-flagsmith
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/recoder_backend
      - DJANGO_SECRET_KEY=${FLAGSMITH_SECRET:-change_me_flagsmith_secret}
      - ENABLE_ADMIN_ACCESS_USER_PASS=True
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  # ================================================================
  # Umami — Privacy-first web analytics (GDPR compliant, no cookies)
  # ================================================================
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: recoder-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3000"
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/umami
      - APP_SECRET=${UMAMI_SECRET:-change_me_umami_secret}
      - DISABLE_UPDATES=1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  # ================================================================
  # Chatwoot — Omnichannel inbox (replaces OpenClaw social gateway)
  # nginx: chat.recoder.xyz → port 3005
  # Bootstrap: chatwoot-init runs bundle exec rails db:chatwoot_prepare
  # Verify: bash scripts/verify-chatwoot.sh remote
  # ================================================================
  chatwoot-init:
    image: chatwoot/chatwoot:v3.10.1
    container_name: recoder-chatwoot-init
    restart: "no"
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/chatwoot
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/2
      - SECRET_KEY_BASE=${CHATWOOT_SECRET:-change_me_in_production_chatwoot_secret}
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_NAME=Recoder
      - DEFAULT_LOCALE=en
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=false
      - FRONTEND_URL=https://chat.recoder.xyz
      - RECODER_A2A_WEBHOOK_URL=http://docker-backend:3100/api/a2a/webhook/chatwoot
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  chatwoot:
    image: chatwoot/chatwoot:v3.10.1
    container_name: recoder-chatwoot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - DATABASE_URL=postgresql://recoder:recoder_prod_2026@${HOST_POSTGRES_HOST:-host.docker.internal}:5432/chatwoot
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/2
      - SECRET_KEY_BASE=${CHATWOOT_SECRET:-change_me_in_production_chatwoot_secret}
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_NAME=Recoder
      - DEFAULT_LOCALE=en
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=false
      - FRONTEND_URL=https://chat.recoder.xyz
      # Webhook back to docker-backend A2A gateway
      - RECODER_A2A_WEBHOOK_URL=http://docker-backend:3100/api/a2a/webhook/chatwoot
    depends_on:
      redis:
        condition: service_healthy
      chatwoot-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "status=$$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: chat.recoder.xyz' http://127.0.0.1:3000/auth/sign_in || true); case \"$$status\" in 200|302|303|307|308) exit 0 ;; *) exit 1 ;; esac"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder

  # ================================================================
  # Meilisearch — Fast hybrid (text + vector) search for platform content
  # ================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: recoder-meilisearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-recoder_meili_dev_key}
      - MEILI_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - recoder

volumes:
  backend-data:
  redis-data:
  qdrant-data:
  meili-data:
  openclaw-config:
  openclaw-workspace:
  victoriametrics-data:
  nats-data:
  zrok-data:
  alertmanager-data:
  opencode-data:
  opencode-config:
  grafana-data:

networks:
  recoder:
    external: true
    name: recoder-network
