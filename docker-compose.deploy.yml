version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: recoder-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  docker-backend:
    build: ./docker-backend
    container_name: recoder-docker-backend
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/app/data
    env_file:
      - ./docker-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3100
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - PUBLIC_PROMPT_TASK_QUEUE_BACKEND=redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  recoder-web:
    build: ./recoder-web
    container_name: recoder-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./recoder-web/.env
    environment:
      - NODE_ENV=production
      - PORT=5173
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173',{redirect:'manual'}).then(r => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Build the base workspace image
  recoder-base:
    build: ./docker-backend/docker
    image: recoder-workspace:latest
    profiles:
      - build-base

volumes:
  backend-data:
  redis-data:

networks:
  default:
    name: recoder-network
