# Recoder.xyz Domain Production Deployment
# For deployment to recoder.xyz with HTTPS SSL via Let's Encrypt

version: '3.8'

services:
  # Traefik reverse proxy with SSL termination
  traefik:
    image: traefik:v3.0
    container_name: recoder-traefik
    restart: unless-stopped
    command:
      # API and dashboard
      - --api.dashboard=true
      - --api.insecure=false
      
      # Entry points
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=recoder-network
      
      # Let's Encrypt configuration
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      
      # Global redirect to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      
      # Security headers
      - --entrypoints.websecure.http.middlewares=security-headers@docker
      
      # Logging
      - --log.level=INFO
      - --accesslog=true
      
      # Metrics
      - --metrics.prometheus=true
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard (secured with auth)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ssl/letsencrypt:/letsencrypt
      - ./logs/traefik:/var/log/traefik
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      
      # Dashboard
      - "traefik.http.routers.dashboard.rule=Host(`traefik.recoder.xyz`)"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      
      # Dashboard authentication
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$2y$$10$$B8ZlnCYdTkM4N8rQJj1pQeKFVzN5n5QKjJ5nQxCvKx8xZw9zN5N5m"
      
      # Security headers middleware
      - "traefik.http.middlewares.security-headers.headers.accessControlAllowMethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.security-headers.headers.accessControlMaxAge=100"
      - "traefik.http.middlewares.security-headers.headers.accessControlAllowOriginList=https://recoder.xyz,https://chat.recoder.xyz,https://api.recoder.xyz"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.customFrameOptionsValue=DENY"
      - "traefik.http.middlewares.security-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
    environment:
      - TRAEFIK_API_DASHBOARD=true

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recoder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recoder_production
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    networks:
      - recoder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d recoder_production"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: recoder-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
      - ./backups/redis:/backups
    networks:
      - recoder-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  recoder-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: recoder-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/recoder_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./logs/api:/app/logs
    networks:
      - recoder-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.recoder.xyz`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=security-headers"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Production Engine
  production-engine:
    build:
      context: ./production-engine
      dockerfile: Dockerfile.production
    container_name: recoder-production-engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/recoder_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - API_BASE_URL=https://api.recoder.xyz
    volumes:
      - ./logs/engine:/app/logs
    networks:
      - recoder-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.engine.rule=Host(`engine.recoder.xyz`)"
      - "traefik.http.routers.engine.tls=true"
      - "traefik.http.routers.engine.tls.certresolver=letsencrypt"
      - "traefik.http.routers.engine.middlewares=security-headers"
      - "traefik.http.services.engine.loadbalancer.server.port=8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Web Platform (recoder.xyz)
  recoder-web:
    build:
      context: ./recoder-web
      dockerfile: Dockerfile.production
    container_name: recoder-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.recoder.xyz
      - NEXT_PUBLIC_WEB_URL=https://recoder.xyz
      - NEXT_PUBLIC_CHAT_URL=https://chat.recoder.xyz
      - NEXTAUTH_URL=https://recoder.xyz
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/recoder_production
    volumes:
      - ./logs/web:/app/logs
    networks:
      - recoder-network
    depends_on:
      - recoder-api
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`recoder.xyz`) || Host(`www.recoder.xyz`)"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=security-headers,www-redirect"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      
      # WWW redirect middleware
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www.recoder.xyz/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://recoder.xyz/$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Chat Platform (chat.recoder.xyz)
  recoder-chat:
    build:
      context: ./recoder-chat
      dockerfile: Dockerfile.production
    container_name: recoder-chat
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.recoder.xyz
      - NEXT_PUBLIC_WEB_URL=https://recoder.xyz
      - NEXT_PUBLIC_CHAT_URL=https://chat.recoder.xyz
      - NEXTAUTH_URL=https://chat.recoder.xyz
      - AUTH_SECRET=${AUTH_SECRET}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/recoder_production
    volumes:
      - ./logs/chat:/app/logs
    networks:
      - recoder-network
    depends_on:
      - recoder-api
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`chat.recoder.xyz`)"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.routers.chat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.chat.middlewares=security-headers"
      - "traefik.http.services.chat.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Ollama (Local AI)
  ollama:
    image: ollama/ollama:latest
    container_name: recoder-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.recoder.xyz`)"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.routers.ollama.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ollama.middlewares=security-headers,ollama-auth"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
      
      # Ollama basic auth (internal use only)
      - "traefik.http.middlewares.ollama-auth.basicauth.users=ollama:$$2y$$10$$B8ZlnCYdTkM4N8rQJj1pQeKFVzN5n5QKjJ5nQxCvKx8xZw9zN5N5m"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: recoder-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.recoder.xyz`)"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=security-headers,prometheus-auth"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      
      # Prometheus basic auth
      - "traefik.http.middlewares.prometheus-auth.basicauth.users=admin:$$2y$$10$$B8ZlnCYdTkM4N8rQJj1pQeKFVzN5n5QKjJ5nQxCvKx8xZw9zN5N5m"

  # Grafana Analytics
  grafana:
    image: grafana/grafana:latest
    container_name: recoder-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_DOMAIN=grafana.recoder.xyz
      - GF_SERVER_ROOT_URL=https://grafana.recoder.xyz
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./data/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - recoder-network
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.recoder.xyz`)"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=security-headers"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  recoder-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local