# Self-hosted, keyless capability layer for Recoder's agent capabilities.
#
# On-box policy (prod is 16GB / no-GPU): do NOT self-host LLM inference here.
# Use cloud LLM (BYOK / OpenRouter / Gemini) for the unified router and mem0 OSS
# LLM + embeddings. This compose only provisions the light, on-box-safe backends:
#   - Qdrant   -> mem0 OSS vector store (agent memory)
#   - OpenZiti -> optional zero-trust controller (runner identities)
#
# Bring up Qdrant:   docker compose -f docker-compose.capabilities.yml up -d qdrant
# Add OpenZiti:      docker compose -f docker-compose.capabilities.yml --profile ziti up -d qdrant ziti-controller
# Then set the matching vars from .env.capabilities.example on the backend.
#
# NOTE (2026-06-19): Ollama and vLLM inference services were removed. They were
# never viable on this no-GPU / 16GB box; run inference via cloud LLM or a
# separate GPU host instead.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recoder-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - recoder-capabilities

  # Optional: OpenZiti zero-trust controller (auto-generates PKI + admin creds;
  # see container logs for the admin password). Enable with: --profile ziti
  ziti-controller:
    image: openziti/ziti-controller:latest
    container_name: recoder-ziti-controller
    profiles: ["ziti"]
    restart: unless-stopped
    environment:
      # Advertised address MUST match the host:port the backend dials
      # (ZITI_CONTROLLER_URL), or TLS hostname verification fails. Default to
      # localhost since 1280 is published to the host below.
      ZITI_CTRL_ADVERTISED_ADDRESS: ${ZITI_ADVERTISED_ADDRESS:-localhost}
      ZITI_CTRL_ADVERTISED_PORT: "1280"
      ZITI_USER: ${ZITI_ADMIN_USERNAME:-admin}
      # Non-empty default: an empty password blocks first-boot bootstrap.
      ZITI_PWD: ${ZITI_ADMIN_PASSWORD:-recoder_ziti_admin}
    ports:
      - "1280:1280"
    volumes:
      - ziti-data:/persistent
    networks:
      - recoder-capabilities
    healthcheck:
      test: ["CMD", "curl", "-skf", "https://localhost:1280/edge/management/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  qdrant-data:
  ziti-data:

networks:
  recoder-capabilities:
    name: recoder-capabilities
