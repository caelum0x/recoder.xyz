# Ruff configuration for recoder backend
# https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",  # line too long — handled by formatter / acceptable in tests
]

[lint.isort]
known-first-party = ["core", "tests"]

[format]
quote-style = "double"
indent-style = "space"
