openapi: 3.0.3
info:
  title: Recoder Docker Backend API
  description: |
    API for managing containerized development environments in Recoder.

    ## Authentication
    All endpoints require a Better Auth session token passed in the Authorization header.

    ## Rate Limiting
    - General API: 100 requests/minute
    - Container Creation: 10 requests/minute
  version: 1.0.0
  contact:
    name: Recoder Support
    url: https://recoder.xyz
  license:
    name: Proprietary

servers:
  - url: https://docker.recoder.xyz
    description: Production server
  - url: http://localhost:3100
    description: Local development

tags:
  - name: Health
    description: Health check and status endpoints
  - name: Container
    description: Container lifecycle management
  - name: File
    description: File operations in containers
  - name: DevServer
    description: Development server management
  - name: Snapshot
    description: Version control with snapshots
  - name: Search
    description: Search and replace in files
  - name: Package
    description: Package manager operations
  - name: Secret
    description: Environment variables and secrets
  - name: Git
    description: Git operations
  - name: LSP
    description: Language Server Protocol
  - name: Collaboration
    description: Real-time collaboration
  - name: Sync
    description: CLI-Web synchronization
  - name: MCP
    description: Model Context Protocol servers
  - name: Tunnel
    description: Public URL tunneling
  - name: Browser
    description: Browser automation
  - name: CodeIndex
    description: Semantic code search
  - name: Debug
    description: Debug session management (DAP protocol)
  - name: Organizations
    description: Enterprise organization management
  - name: Mobile
    description: Mobile API for React Native/Expo apps

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  containers:
                    type: integer
                    example: 5

  /api/pool/stats:
    get:
      tags: [Health]
      summary: Get container pool statistics
      security: []
      responses:
        '200':
          description: Pool statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  available:
                    type: integer
                  total:
                    type: integer
                  inUse:
                    type: integer

  /api/container:
    post:
      tags: [Container]
      summary: Create or get container for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Container created or retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerResponse'
        '429':
          description: Container limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerLimitError'

  /api/container/{projectId}:
    delete:
      tags: [Container]
      summary: Delete container
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Container deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Container not found

  /api/keep-alive/{projectId}:
    post:
      tags: [Container]
      summary: Reset container idle timer
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Timer reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timeRemaining:
                    type: integer
                    description: Milliseconds until idle timeout

  /api/file/{projectId}:
    post:
      tags: [File]
      summary: Write file to container
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path:
                  type: string
                  example: src/index.ts
                content:
                  type: string
      responses:
        '200':
          description: File written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      tags: [File]
      summary: Read file from container
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: path
          in: query
          required: true
          schema:
            type: string
          example: src/index.ts
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
    delete:
      tags: [File]
      summary: Delete file or folder
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/file/{projectId}/rename:
    put:
      tags: [File]
      summary: Rename or move file
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPath, newPath]
              properties:
                oldPath:
                  type: string
                newPath:
                  type: string
      responses:
        '200':
          description: File renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/files/{projectId}:
    get:
      tags: [File]
      summary: List files in container
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: path
          in: query
          schema:
            type: string
            default: /workspace
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: string

  /api/files/{projectId}/batch:
    post:
      tags: [File]
      summary: Write multiple files at once
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      content:
                        type: string
      responses:
        '200':
          description: Files written
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer

  /api/folder/{projectId}:
    post:
      tags: [File]
      summary: Create folder
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/exec/{projectId}:
    post:
      tags: [Container]
      summary: Execute command in container
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  example: npm install
                cwd:
                  type: string
                  default: /workspace
                background:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      output:
                        type: string
                  - type: object
                    properties:
                      output:
                        type: string
                      background:
                        type: boolean
                      ready:
                        type: boolean
                      port:
                        type: integer
        '403':
          description: Command blocked for security

  /api/dev-server/start:
    post:
      tags: [DevServer]
      summary: Start development server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
                framework:
                  type: string
                  enum: [vite, next, cra, remix]
                  default: vite
      responses:
        '200':
          description: Dev server started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  port:
                    type: integer
                  url:
                    type: string

  /api/dev-server/stop:
    post:
      tags: [DevServer]
      summary: Stop development server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
      responses:
        '200':
          description: Dev server stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/dev-server/restart:
    post:
      tags: [DevServer]
      summary: Restart development server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
      responses:
        '200':
          description: Dev server restarted

  /api/dev-server/status/{projectId}:
    get:
      tags: [DevServer]
      summary: Get development server status
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Dev server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                  isRunning:
                    type: boolean
                  backgroundDev:
                    type: boolean

  /api/logs/{projectId}:
    get:
      tags: [DevServer]
      summary: Get development server logs
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: tail
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Dev server logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: string

  /api/errors/{projectId}:
    get:
      tags: [DevServer]
      summary: Get parsed build errors
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: tail
          in: query
          schema:
            type: integer
            default: 200
        - name: autoRestore
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Parsed errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'

  /api/snapshot/{projectId}:
    post:
      tags: [Snapshot]
      summary: Create snapshot
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  default: Manual snapshot
                author:
                  type: string
                  default: user
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'

  /api/snapshots/{projectId}:
    get:
      tags: [Snapshot]
      summary: List snapshots
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Snapshot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/Snapshot'

  /api/snapshot/{projectId}/current:
    get:
      tags: [Snapshot]
      summary: Get current snapshot
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Current snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    $ref: '#/components/schemas/Snapshot'

  /api/snapshot/{projectId}/restore:
    post:
      tags: [Snapshot]
      summary: Restore to snapshot
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshotId]
              properties:
                snapshotId:
                  type: string
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  restoredTo:
                    type: string

  /api/search/{projectId}:
    post:
      tags: [Search]
      summary: Search in files
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                options:
                  type: object
                  properties:
                    regex:
                      type: boolean
                    caseSensitive:
                      type: boolean
                    wholeWord:
                      type: boolean
                    include:
                      type: string
                    exclude:
                      type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  total:
                    type: integer

  /api/replace/{projectId}:
    post:
      tags: [Search]
      summary: Replace in files
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [searchQuery, replaceText]
              properties:
                searchQuery:
                  type: string
                replaceText:
                  type: string
                files:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Replace completed

  /api/packages/{projectId}:
    get:
      tags: [Package]
      summary: Get installed packages
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: manager
          in: query
          required: true
          schema:
            type: string
            enum: [npm, bun, pip, cargo, go, composer, gem]
      responses:
        '200':
          description: Package list
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Package'
                  manager:
                    type: string

  /api/packages/{projectId}/search:
    post:
      tags: [Package]
      summary: Search package registry
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, manager]
              properties:
                query:
                  type: string
                manager:
                  type: string
                  enum: [npm, bun, pip, cargo, go, composer, gem]
      responses:
        '200':
          description: Search results

  /api/packages/{projectId}/install:
    post:
      tags: [Package]
      summary: Install package
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageName, manager]
              properties:
                packageName:
                  type: string
                manager:
                  type: string
                  enum: [npm, bun, pip, cargo, go, composer, gem]
                isDev:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Package installed

  /api/packages/{projectId}/uninstall:
    post:
      tags: [Package]
      summary: Uninstall package
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageName, manager]
              properties:
                packageName:
                  type: string
                manager:
                  type: string
      responses:
        '200':
          description: Package uninstalled

  /api/secrets/{projectId}:
    get:
      tags: [Secret]
      summary: Get secrets
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: environment
          in: query
          schema:
            type: string
            enum: [development, production, test, local]
            default: development
      responses:
        '200':
          description: Secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: object
                    additionalProperties:
                      type: string
                  environment:
                    type: string
    post:
      tags: [Secret]
      summary: Set secret
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
                environment:
                  type: string
                  default: development
      responses:
        '200':
          description: Secret set

  /api/secrets/{projectId}/{key}:
    delete:
      tags: [Secret]
      summary: Delete secret
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: environment
          in: query
          schema:
            type: string
            default: development
      responses:
        '200':
          description: Secret deleted

  /api/git/{projectId}/status:
    get:
      tags: [Git]
      summary: Get git status
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Git status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatus'

  /api/git/{projectId}/branches:
    get:
      tags: [Git]
      summary: Get branches
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Branch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'

  /api/git/{projectId}/branch:
    post:
      tags: [Git]
      summary: Create branch
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                checkout:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Branch created

  /api/git/{projectId}/checkout:
    post:
      tags: [Git]
      summary: Checkout branch
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                branch:
                  type: string
      responses:
        '200':
          description: Branch checked out

  /api/git/{projectId}/branch/{name}:
    delete:
      tags: [Git]
      summary: Delete branch
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Branch deleted

  /api/git/{projectId}/log:
    get:
      tags: [Git]
      summary: Get commit history
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: branch
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Commit history
          content:
            application/json:
              schema:
                type: object
                properties:
                  commits:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commit'

  /api/git/{projectId}/stage:
    post:
      tags: [Git]
      summary: Stage files
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Files staged

  /api/git/{projectId}/unstage:
    post:
      tags: [Git]
      summary: Unstage files
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Files unstaged

  /api/git/{projectId}/commit:
    post:
      tags: [Git]
      summary: Create commit
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Commit created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hash:
                    type: string

  /api/git/{projectId}/discard:
    post:
      tags: [Git]
      summary: Discard changes
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Changes discarded

  /api/git/{projectId}/init:
    post:
      tags: [Git]
      summary: Initialize git repository
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Repository initialized

  /api/lsp/{projectId}/start:
    post:
      tags: [LSP]
      summary: Start LSP servers
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: LSP servers started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        languageId:
                          type: string
                        status:
                          type: string
                  message:
                    type: string

  /api/lsp/{projectId}/stop:
    post:
      tags: [LSP]
      summary: Stop LSP servers
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: LSP servers stopped

  /api/lsp/{projectId}/status:
    get:
      tags: [LSP]
      summary: Get LSP server status
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: LSP status

  /api/lsp/configs:
    get:
      tags: [LSP]
      summary: Get available LSP configurations
      responses:
        '200':
          description: LSP configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  configs:
                    type: array
                    items:
                      type: object
                      properties:
                        languageId:
                          type: string
                        name:
                          type: string
                        extensions:
                          type: array
                          items:
                            type: string

  /api/lsp/{projectId}/request:
    post:
      tags: [LSP]
      summary: Send LSP request
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filePath, method]
              properties:
                filePath:
                  type: string
                method:
                  type: string
                  example: textDocument/completion
                params:
                  type: object
      responses:
        '200':
          description: LSP response

  /api/collab/stats:
    get:
      tags: [Collaboration]
      summary: Get collaboration statistics
      responses:
        '200':
          description: Collaboration stats
          content:
            application/json:
              schema:
                type: object
                properties:
