  /api/mobile/register:
    post:
      tags: [Mobile]
      summary: Register mobile device and create session
      description: Register a mobile device (iOS/Android/Web) and obtain a long-lived session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, deviceName, platform, appVersion, osVersion]
              properties:
                userId:
                  type: string
                deviceName:
                  type: string
                  example: iPhone 14 Pro
                platform:
                  type: string
                  enum: [ios, android, web]
                appVersion:
                  type: string
                  example: 1.0.0
                osVersion:
                  type: string
                  example: iOS 17.0
                pushToken:
                  type: string
                  description: FCM/APNS push token
                pushTokenType:
                  type: string
                  enum: [fcm, apns]
      responses:
        '200':
          description: Device registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  device:
                    $ref: '#/components/schemas/MobileDevice'
                  session:
                    $ref: '#/components/schemas/MobileSession'

  /api/mobile/logout:
    post:
      tags: [Mobile]
      summary: Logout and revoke session
      responses:
        '200':
          description: Logged out successfully

  /api/mobile/devices:
    get:
      tags: [Mobile]
      summary: Get all devices for current user
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/MobileDevice'

  /api/mobile/devices/{deviceId}:
    delete:
      tags: [Mobile]
      summary: Remove device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device removed

  /api/mobile/push/token:
    post:
      tags: [Mobile]
      summary: Update push notification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, tokenType]
              properties:
                token:
                  type: string
                tokenType:
                  type: string
                  enum: [fcm, apns]
      responses:
        '200':
          description: Token updated
    delete:
      tags: [Mobile]
      summary: Remove push notification token
      responses:
        '200':
          description: Token removed

  /api/mobile/projects:
    get:
      tags: [Mobile]
      summary: Get projects for user (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, updatedAt, createdAt]
            default: updatedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMobileProjects'

  /api/mobile/project/{projectId}:
    get:
      tags: [Mobile]
      summary: Get project details
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: includeFiles
          in: query
          schema:
            type: boolean
            default: true
        - name: depth
          in: query
          schema:
            type: integer
            default: 1
            description: Directory depth for file listing
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/MobileProjectDetail'

  /api/mobile/project/{projectId}/files:
    get:
      tags: [Mobile]
      summary: Get files in project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
            default: ''
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/MobileFile'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer

  /api/mobile/sync:
    post:
      tags: [Mobile]
      summary: Sync operations (offline-first support)
      description: Upload local changes and download remote changes with conflict resolution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, operations]
              properties:
                projectId:
                  type: string
                operations:
                  type: array
                  items:
                    $ref: '#/components/schemas/SyncOperation'
                lastSyncAt:
                  type: integer
                  description: Timestamp of last sync
                conflictResolution:
                  type: string
                  enum: [server_wins, client_wins, manual]
                  default: server_wins
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'

  /api/mobile/sync/status/{projectId}:
    get:
      tags: [Mobile]
      summary: Get sync status for project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusInfo'

  /api/mobile/sync/pending/{projectId}:
    get:
      tags: [Mobile]
      summary: Get pending changes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
            description: Timestamp to get changes since
      responses:
        '200':
          description: Pending operations
          content:
            application/json:
              schema:
                type: object
                properties:
                  operations:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncOperation'

  /api/mobile/notifications:
    get:
      tags: [Mobile]
      summary: Get notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/MobileNotification'
                  total:
                    type: integer
                  unreadCount:
                    type: integer

  /api/mobile/notifications/{notificationId}/read:
    post:
      tags: [Mobile]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read

  /api/mobile/notifications/read-all:
    post:
      tags: [Mobile]
      summary: Mark all notifications as read
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /api/mobile/notifications/{notificationId}:
    delete:
      tags: [Mobile]
      summary: Delete notification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted

  /api/mobile/session:
    get:
      tags: [Mobile]
      summary: Get current session info
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/MobileSession'
                  device:
                    $ref: '#/components/schemas/MobileDevice'

  /api/mobile/session/refresh:
    post:
      tags: [Mobile]
      summary: Refresh session token
      description: Get a new session token before the current one expires
      responses:
        '200':
          description: New session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/MobileSession'

  /api/mobile/stats:
    get:
      tags: [Mobile]
      summary: Get mobile API statistics
      responses:
        '200':
          description: Mobile API stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      push:
                        type: object
                      sync:
                        type: object

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Better Auth session token

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
      description: Project UUID

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    ContainerResponse:
      type: object
      properties:
        containerId:
          type: string
        reused:
          type: boolean
        fromPool:
          type: boolean
        port:
          type: integer
        ptyPort:
          type: integer

    ContainerLimitError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          example: CONTAINER_LIMIT_REACHED
        current:
          type: integer
        max:
          type: integer

    Snapshot:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        author:
          type: string
        timestamp:
          type: string
          format: date-time

    SearchResult:
      type: object
      properties:
        file:
          type: string
        line:
          type: integer
        column:
          type: integer
        match:
          type: string
        context:
          type: string

    Package:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        isDev:
          type: boolean

    GitStatus:
      type: object
      properties:
        isRepo:
          type: boolean
        branch:
          type: string
        staged:
          type: array
          items:
            type: string
        unstaged:
          type: array
          items:
            type: string
        untracked:
          type: array
          items:
            type: string
        ahead:
          type: integer
        behind:
          type: integer

    Branch:
      type: object
      properties:
        name:
          type: string
        current:
          type: boolean

    Commit:
      type: object
      properties:
        hash:
          type: string
        message:
          type: string
        author:
          type: string
        date:
          type: string
          format: date-time

    MCPServer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        preinstalled:
          type: boolean
        requiresApiKey:
          type: boolean
        requiredEnvVars:
          type: array
          items:
            type: string

    ErrorsResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
              line:
                type: integer
              column:
                type: integer
              message:
                type: string
              severity:
                type: string
        hasBlockingErrors:
          type: boolean
        devServerStatus:
          type: string
        errorCount:
          type: integer

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        ownerId:
          type: string
        settings:
          $ref: '#/components/schemas/OrganizationSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizationSettings:
      type: object
      properties:
        allowPublicProjects:
          type: boolean
          default: false
        defaultProjectVisibility:
          type: string
          enum: [private, internal, public]
          default: private
        maxSeats:
          type: integer
        ssoEnabled:
          type: boolean
          default: false
        ssoProvider:
          type: string
        allowedDomains:
          type: array
          items:
            type: string

    Team:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              role:
                type: string
                enum: [lead, member]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizationMember:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, member, viewer]
        joinedAt:
          type: string
          format: date-time

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        action:
          type: string
        actor:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            email:
              type: string
            ipAddress:
              type: string
            userAgent:
              type: string
        targetResource:
          type: string
        targetId:
          type: string
        changes:
          type: array
          items:
            type: object
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    MobileDevice:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        appVersion:
          type: string
        osVersion:
          type: string
        pushToken:
          type: string
        pushTokenType:
          type: string
          enum: [fcm, apns]
        lastActive:
          type: integer
        createdAt:
          type: integer

    MobileSession:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        deviceId:
          type: string
        token:
          type: string
        createdAt:
          type: integer
        expiresAt:
          type: integer
        lastActivity:
          type: integer
        ipAddress:
          type: string
        userAgent:
          type: string

    MobileProject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        template:
          type: string
        language:
          type: string
        framework:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
        lastOpenedAt:
          type: integer
        thumbnailUrl:
          type: string
        fileCount:
          type: integer
        totalSize:
          type: integer
        isStarred:
          type: boolean
        syncStatus:
          type: string
          enum: [synced, pending, conflict]
        lastSyncAt:
          type: integer

    MobileProjectDetail:
      allOf:
        - $ref: '#/components/schemas/MobileProject'
        - type: object
          properties:
            files:
              type: array
              items:
                $ref: '#/components/schemas/MobileFile'
            recentFiles:
              type: array
              items:
                type: string
            collaborators:
              type: array
              items:
                $ref: '#/components/schemas/MobileCollaborator'
            gitBranch:
              type: string
            gitStatus:
              $ref: '#/components/schemas/MobileGitStatus'
            devServerUrl:
              type: string
            previewUrl:
              type: string

    MobileFile:
      type: object
      properties:
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [file, directory]
        size:
          type: integer
        modifiedAt:
          type: integer
        mimeType:
          type: string
        isNew:
          type: boolean
        isModified:
          type: boolean
        isDeleted:
          type: boolean

    MobileCollaborator:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
        isOnline:
          type: boolean
        cursor:
          type: object
          properties:
            file:
              type: string
            line:
              type: integer
            column:
              type: integer

    MobileGitStatus:
      type: object
      properties:
        branch:
          type: string
        ahead:
          type: integer
        behind:
          type: integer
        staged:
          type: array
          items:
            type: string
        unstaged:
          type: array
          items:
            type: string
        untracked:
          type: array
          items:
            type: string

    MobileNotification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
        read:
          type: boolean
        createdAt:
          type: integer
        expiresAt:
          type: integer

    PaginatedMobileProjects:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MobileProject'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
        nextCursor:
          type: string

    SyncOperation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [create, update, delete, rename]
        filePath:
          type: string
        content:
          type: string
        oldPath:
          type: string
        timestamp:
          type: integer
        hash:
          type: string
        deviceId:
          type: string

    SyncResult:
      type: object
      properties:
        success:
          type: boolean
        applied:
          type: integer
        conflicts:
          type: array
          items:
            type: object
            properties:
              filePath:
                type: string
              type:
                type: string
              resolution:
                type: string
              serverVersion:
                type: string
              clientVersion:
                type: string
        serverOperations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'
        lastSyncAt:
          type: integer

    SyncStatusInfo:
      type: object
      properties:
        projectId:
          type: string
        status:
          type: string
          enum: [synced, pending, syncing, conflict, error]
        lastSyncAt:
          type: integer
        pendingOperations:
          type: integer
        conflicts:
          type: array
