      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, program]
              properties:
                language:
                  type: string
                  enum: [javascript, typescript, python, go, rust]
                  description: Programming language to debug
                program:
                  type: string
                  description: Path to file to debug
                  example: src/index.ts
                args:
                  type: array
                  items:
                    type: string
                  description: Command-line arguments for the program
                cwd:
                  type: string
                  description: Working directory
                  default: /workspace
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: Environment variables
                stopOnEntry:
                  type: boolean
                  description: Stop at first line
                  default: false
      responses:
        '200':
          description: Debug session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sessionId:
                    type: string
                  debugPort:
                    type: integer
                  wsUrl:
                    type: string
                    description: WebSocket URL for debug events
        '400':
          description: Invalid language or missing required fields
        '404':
          description: Container not found

