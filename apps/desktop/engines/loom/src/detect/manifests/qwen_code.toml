id = "qwen_code"
version = "2026.08.30.1"
min_engine_version = 1
updated_at = "2026-08-30T00:00:00Z"
aliases = ["qwen", "qwen-code", "qwen code"]

# Qwen Code inherits Gemini CLI's Ink UI. Keep blockers above activity markers
# because confirmation panels can retain an `esc to cancel` line in scrollback.
[[rules]]
id = "confirmation_blocked"
state = "blocked"
blocked_kind = "approval"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["│ Apply this change"] },
  { contains = ["│ Allow execution"] },
  { all = [{ line_regex = ['(?i)^\s*❯\s*yes\b'] }, { any = [{ contains = ["do you want to proceed"] }, { contains = ["waiting for user confirmation"] }] }] },
]

[[rules]]
id = "localized_confirmation_blocked"
state = "blocked"
blocked_kind = "approval"
priority = 290
region = "bottom_non_empty_lines(10)"
visible_blocker = true
all = [
  { any = [{ contains = ["yes"] }, { contains = ["allow"] }] },
  { any = [{ contains = ["no"] }, { contains = ["reject"] }, { contains = ["cancel"] }] },
  { any = [{ contains = ["↑↓"] }, { contains = ["enter"] }, { contains = ["esc"] }] },
]

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc to cancel"]

[[rules]]
id = "braille_spinner_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]\s+.*\(esc to cancel']

[[rules]]
id = "prompt_idle"
state = "idle"
priority = 50
region = "bottom_non_empty_lines(8)"
visible_idle = true
any = [
  { contains = ["type your message"] },
  { contains = ["tips for getting started"] },
]
not = [
  { contains = ["esc to cancel"] },
]
