services:
  # Main Website (recoder.xyz)
  - type: web
    name: recoder-main
    env: node
    plan: free
    region: frankfurt
    rootDir: app
    buildCommand: npm install && rm -rf .next && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        value: https://recoder-main.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://recoder-backend.onrender.com
      - key: NEXT_PUBLIC_ENGINE_URL
        value: https://recoder-production-engine.onrender.com
      - key: NEXT_PUBLIC_CHAT_URL
        value: https://recoder-chat.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://recoder-web.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # Backend API Service
  - type: web
    name: recoder-backend
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Production Engine Service
  - type: web
    name: recoder-production-engine
    env: node
    plan: free
    region: frankfurt
    rootDir: production-engine
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Recoder Chat Service
  - type: web
    name: recoder-chat
    env: node
    plan: free
    region: frankfurt
    rootDir: recoder-chat
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        value: https://recoder-chat.onrender.com
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://recoder-backend.onrender.com
      - key: NEXT_PUBLIC_ENGINE_URL
        value: https://recoder-production-engine.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # Recoder Web Service  
  - type: web
    name: recoder-web
    env: node
    plan: free
    region: frankfurt
    rootDir: recoder-web
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        value: https://recoder-web.onrender.com
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://recoder-backend.onrender.com
      - key: NEXT_PUBLIC_ENGINE_URL
        value: https://recoder-production-engine.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false