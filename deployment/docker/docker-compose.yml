# CodeCraft CLI - Docker Compose for development and production
version: '3.8'

services:
  # Production CodeCraft CLI
  codecraft:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: production
      args:
        - BUILDPLATFORM=${BUILDPLATFORM:-linux/amd64}
        - TARGETPLATFORM=${TARGETPLATFORM:-linux/amd64}
    image: recoder/codecraft:latest
    container_name: codecraft-cli
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CODECRAFT_HOME=/home/codecraft/.codecraft
      - CODECRAFT_AUTO_UPDATE=false
      - CODECRAFT_ANALYTICS=false
    volumes:
      - codecraft_data:/home/codecraft/.codecraft
      - ${PWD}:/workspace:rw
    working_dir: /workspace
    user: "1001:1001"
    networks:
      - codecraft_network
    command: ["--help"]

  # Development CodeCraft CLI with hot reload
  codecraft-dev:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: development
    image: recoder/codecraft:dev
    container_name: codecraft-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - CODECRAFT_DEV_MODE=true
      - CODECRAFT_DEBUG=true
    volumes:
      - ../../:/app:rw
      - codecraft_dev_data:/home/node/.codecraft
      - /app/node_modules
    working_dir: /app
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    networks:
      - codecraft_network
    command: ["dev"]

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: codecraft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codecraft_network
    command: redis-server --appendonly yes
    profiles:
      - full

  # PostgreSQL for analytics (optional)
  postgres:
    image: postgres:15-alpine
    container_name: codecraft-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=codecraft
      - POSTGRES_USER=codecraft
      - POSTGRES_PASSWORD=codecraft_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - codecraft_network
    profiles:
      - full

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: codecraft-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - codecraft_network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: codecraft-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - codecraft_network
    profiles:
      - monitoring

  # Test runner
  test:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: development
    image: recoder/codecraft:test
    container_name: codecraft-test
    environment:
      - NODE_ENV=test
      - CI=true
    volumes:
      - ../../:/app:rw
      - /app/node_modules
    working_dir: /app
    networks:
      - codecraft_network
    command: ["test"]
    profiles:
      - test

volumes:
  codecraft_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.codecraft

  codecraft_dev_data:
    driver: local

  redis_data:
    driver: local

  postgres_data:
    driver: local

  prometheus_data:
    driver: local

  grafana_data:
    driver: local

networks:
  codecraft_network:
    driver: bridge
    name: codecraft_network