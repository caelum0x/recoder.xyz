# CodeCraft CLI - Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codecraft-cli
  namespace: codecraft
  labels:
    app: codecraft-cli
    version: v1.0.0
    component: cli
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: codecraft-cli
  template:
    metadata:
      labels:
        app: codecraft-cli
        version: v1.0.0
        component: cli
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: codecraft-cli
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: codecraft-cli
        image: recoder/codecraft:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: CODECRAFT_HOME
          value: "/home/codecraft/.codecraft"
        - name: CODECRAFT_AUTO_UPDATE
          value: "false"
        - name: CODECRAFT_ANALYTICS
          valueFrom:
            configMapKeyRef:
              name: codecraft-config
              key: analytics.enabled
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: codecraft-secrets
              key: redis.url
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: codecraft-secrets
              key: postgres.url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: codecraft-data
          mountPath: /home/codecraft/.codecraft
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/codecraft
            - --version
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/codecraft
            - --version
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - /usr/local/bin/codecraft
            - --version
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: codecraft-data
        persistentVolumeClaim:
          claimName: codecraft-data-pvc
      - name: config
        configMap:
          name: codecraft-config
      - name: tmp
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "codecraft.dev/dedicated"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - codecraft-cli
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: codecraft-cli-service
  namespace: codecraft
  labels:
    app: codecraft-cli
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: codecraft-cli

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codecraft-cli
  namespace: codecraft
  labels:
    app: codecraft-cli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: codecraft
  name: codecraft-cli-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codecraft-cli-rolebinding
  namespace: codecraft
subjects:
- kind: ServiceAccount
  name: codecraft-cli
  namespace: codecraft
roleRef:
  kind: Role
  name: codecraft-cli-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codecraft-config
  namespace: codecraft
  labels:
    app: codecraft-cli
data:
  analytics.enabled: "false"
  auto.update: "false"
  log.level: "info"
  cache.ttl: "3600"
  config.json: |
    {
      "defaultTemplate": "react-typescript",
      "aiModel": "gpt-4",
      "codeStyle": "standard",
      "enableTelemetry": false,
      "autoSave": true,
      "theme": "dark"
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: codecraft-secrets
  namespace: codecraft
  labels:
    app: codecraft-cli
type: Opaque
data:
  # Base64 encoded values
  redis.url: cmVkaXM6Ly9yZWRpcy1zZXJ2aWNlOjYzNzk=  # redis://redis-service:6379
  postgres.url: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvY29kZWNyYWZ0  # postgresql://user:pass@postgres-service:5432/codecraft
  api.key: eW91ci1hcGkta2V5LWhlcmU=  # your-api-key-here

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codecraft-data-pvc
  namespace: codecraft
  labels:
    app: codecraft-cli
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codecraft-cli-ingress
  namespace: codecraft
  labels:
    app: codecraft-cli
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - cli.codecraft.dev
    secretName: codecraft-cli-tls
  rules:
  - host: cli.codecraft.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: codecraft-cli-service
            port:
              number: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: codecraft-cli-pdb
  namespace: codecraft
  labels:
    app: codecraft-cli
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: codecraft-cli

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codecraft-cli-hpa
  namespace: codecraft
  labels:
    app: codecraft-cli
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codecraft-cli
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15