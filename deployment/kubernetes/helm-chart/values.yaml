# Default values for codecraft-cli Helm chart
# This is a YAML-formatted file.

# Global configuration
global:
  imageRegistry: "docker.io"
  storageClass: ""
  
# Image configuration
image:
  registry: docker.io
  repository: recoder/codecraft
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL

# Deployment configuration
replicaCount: 3

# Rolling update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: cli.codecraft.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: codecraft-cli-tls
      hosts:
        - cli.codecraft.dev

# Persistence configuration
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# ConfigMap data
config:
  analytics:
    enabled: false
  autoUpdate: false
  logLevel: "info"
  cacheTTL: 3600
  settings:
    defaultTemplate: "react-typescript"
    aiModel: "gpt-4"
    codeStyle: "standard"
    enableTelemetry: false
    autoSave: true
    theme: "dark"

# Secret data (base64 encoded)
secrets:
  redis:
    url: "cmVkaXM6Ly9yZWRpcy1zZXJ2aWNlOjYzNzk="
  postgres:
    url: "cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvY29kZWNyYWZ0"
  api:
    key: "eW91ci1hcGkta2V5LWhlcmU="

# Environment variables
env:
  NODE_ENV: "production"
  CODECRAFT_HOME: "/home/codecraft/.codecraft"
  CODECRAFT_AUTO_UPDATE: "false"

# Probes configuration
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - codecraft-cli
          topologyKey: kubernetes.io/hostname

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Pod labels
podLabels: {}

# Network policy
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Monitoring
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}

# Redis dependency (optional)
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi

# PostgreSQL dependency (optional)
postgresql:
  enabled: false
  auth:
    postgresPassword: "codecraft_password"
    username: "codecraft"
    password: "codecraft_password"
    database: "codecraft"
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Extra containers
extraContainers: []

# Init containers
initContainers: []

# Lifecycle hooks
lifecycle: {}

# Custom annotations for all resources
commonAnnotations: {}

# Custom labels for all resources
commonLabels: {}

# Test configuration
tests:
  enabled: true
  image:
    repository: busybox
    tag: latest
    pullPolicy: IfNotPresent