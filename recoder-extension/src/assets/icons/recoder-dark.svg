<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Recoder.xyz Icon - Light Theme -->
  
  <!-- Icon Background Circle -->
  <circle cx="24" cy="24" r="20" fill="url(#gradient-primary)" stroke="none"/>
  
  <!-- Code Brackets Icon -->
  <g transform="translate(24, 24)">
    <!-- Left bracket -->
    <path d="M-6 -8 L-10 -4 L-10 4 L-6 8" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Right bracket -->
    <path d="M6 -8 L10 -4 L10 4 L6 8" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Center dot (cursor) -->
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.8"/>
    
    <!-- AI Spark indicators -->
    <circle cx="8" cy="-8" r="2" fill="#ffffff" opacity="0.3"/>
    <circle cx="8" cy="-8" r="1" fill="#ffffff"/>
    
    <circle cx="-8" cy="8" r="1.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="-8" cy="8" r="0.5" fill="#ffffff"/>
  </g>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>