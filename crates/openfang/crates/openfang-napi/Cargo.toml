[package]
name = "openfang-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NAPI-RS binding crate — exposes openfang-kernel entry points as a Node.js native addon (.node)"

# cdylib: the .node shared library loaded by Node.js via require().
# rlib: allows `cargo check --lib` / unit tests without a full build.
[lib]
crate-type = ["cdylib", "rlib"]
name = "openfang_napi"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
napi-build = "2"

# napi-derive macros internally emit unsafe code (FFI boundary).
# The workspace-level `unsafe_code = "forbid"` lint cannot apply here.
[lints.rust]
unsafe_code = "allow"
