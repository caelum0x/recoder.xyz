[package]
name = "openfang-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NAPI-RS binding crate — exposes openfang-kernel entry points as a Node.js native addon (.node)"

# cdylib: the .node shared library loaded by Node.js via require().
# lib: allows `cargo check --lib` / unit tests without a full build.
[lib]
crate-type = ["cdylib", "lib"]
name = "openfang_napi"

[dependencies]
openfang-types = { path = "../openfang-types" }
openfang-kernel = { path = "../openfang-kernel" }
napi = { workspace = true }
napi-derive = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }

[build-dependencies]
napi-build = "2"
