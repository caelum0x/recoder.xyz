name: Social Media Deployment Announcement (Manual)

# This workflow announces deployments on social media.
# It does NOT deploy — production deployment is handled by deploy.yml (Hetzner SSH).
# Use this after a successful deploy to announce the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (e.g., v2026.02.27-abc1234)'
        required: true
        type: string
      environment:
        description: 'Environment that was deployed'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== GENERATE ANNOUNCEMENT CONTEXT =====
  prepare-announcement:
    name: Prepare Announcement
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.context.outputs.changes }}
      files-changed: ${{ steps.context.outputs.files-changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Generate deployment context
        id: context
        run: |
          # Extract recent commit messages for changes summary
          CHANGES=$(git log --oneline -5 --pretty=format:"- %s" | head -3)

          # Count files changed
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l || echo "0")

          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "files-changed=$FILES_CHANGED" >> $GITHUB_OUTPUT

  # ===== SOCIAL MEDIA ANNOUNCEMENT =====
  social-media-announcement:
    name: Required - Social Media Announcement
    runs-on: ubuntu-latest
    needs: [prepare-announcement]
    if: inputs.environment == 'production'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Execute Social Media Announcement via CLI
        working-directory: ./packages/cli
        run: |
          # Install deps and run social-deploy
          npm install --production

          if [ -f src/index.js ]; then
            node src/index.js social-deploy announce \
              --project "Recoder Platform" \
              --version "${{ inputs.version }}" \
              --environment "${{ inputs.environment }}" \
              --url "https://recoder.xyz" \
              --changes "Platform updates" "Enhanced AI features" "Performance improvements"
          else
            echo "CLI entry point not found: packages/cli/src/index.js" >&2
            exit 1
          fi
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Social Media Report
        if: always()
        run: |
          echo "## Social Media Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://recoder.xyz" >> $GITHUB_STEP_SUMMARY
          echo "**Files Changed:** ${{ needs.prepare-announcement.outputs.files-changed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Recent Changes:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.prepare-announcement.outputs.changes }}" >> $GITHUB_STEP_SUMMARY

  # ===== NOTIFICATION =====
  notify:
    name: Advisory - Notify Team
    runs-on: ubuntu-latest
    needs: [prepare-announcement, social-media-announcement]
    if: always()

    steps:
      - name: Slack Notification
        if: needs.social-media-announcement.result == 'success'
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Slack webhook not configured, skipping"
            exit 0
          fi
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "Recoder ${{ inputs.version }} deployment announced on social media",
              "channel": "#deployments"
            }'
