name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # Job 1: Build and Test Core Packages
  test-core:
    name: Test Core Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: recoder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm run typecheck:all

      - name: Lint all packages
        run: pnpm run lint:all

      - name: Test CLI package
        working-directory: packages/cli
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/recoder_test
          REDIS_URL: redis://localhost:6379
        run: |
          pnpm test --coverage --maxWorkers=2

      - name: Test shared package
        working-directory: packages/shared
        run: |
          pnpm test --coverage --maxWorkers=2

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/recoder_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          npx prisma generate
          npx prisma migrate deploy
          pnpm test --coverage --maxWorkers=2

      - name: Test production engine
        working-directory: production-engine
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/recoder_test
          REDIS_URL: redis://localhost:6379
        run: |
          pnpm test --coverage --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: core
          fail_ci_if_error: false

  # Job 2: Build and Test Web Platforms
  test-web:
    name: Test Web Platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test recoder-web
        working-directory: recoder-web
        run: |
          pnpm build
          pnpm test --coverage --maxWorkers=2

      - name: Build and test recoder-chat
        working-directory: recoder-chat
        run: |
          pnpm build
          pnpm test --coverage --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: web
          fail_ci_if_error: false

  # Job 3: Test Mobile and Desktop
  test-desktop-mobile:
    name: Test Desktop & Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test mobile app
        working-directory: recoder-chat-mobile
        run: |
          pnpm test --coverage --maxWorkers=2

      - name: Test desktop app
        working-directory: recoder-desktop
        run: |
          pnpm test --coverage --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: platforms
          fail_ci_if_error: false

  # Job 4: Test VS Code Extension
  test-extension:
    name: Test VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test VS Code extension
        working-directory: recoder-extension/src
        run: |
          pnpm test --coverage --maxWorkers=2

      - name: Build extension
        working-directory: recoder-extension/src
        run: |
          pnpm bundle

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: extension
          fail_ci_if_error: false

  # Job 5: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-core, test-web, test-desktop-mobile, test-extension]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: recoder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:all

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/recoder_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
        run: |
          pnpm run test:integration

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: |
            test-results/
            coverage/
            logs/

  # Job 6: Security and Quality Checks
  security-quality:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          pnpm audit --audit-level high

      - name: Check for vulnerabilities
        run: |
          npx audit-ci --high

      - name: Check dependencies
        run: |
          npx depcheck

      - name: Validate package.json files
        run: |
          find . -name "package.json" -not -path "./node_modules/*" | xargs -I {} node -e "
            try { 
              JSON.parse(require('fs').readFileSync('{}', 'utf8')); 
              console.log('✅ {} is valid JSON'); 
            } catch(e) { 
              console.error('❌ {} has invalid JSON:', e.message); 
              process.exit(1); 
            }
          "

  # Job 7: Build and Deploy (on main branch only)
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [integration-tests, security-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production packages
        run: |
          NODE_ENV=production pnpm run build:all

      - name: Create deployment package
        run: |
          tar -czf deployment.tar.gz \
            packages/cli/dist \
            backend/dist \
            production-engine/dist \
            recoder-web/.next \
            recoder-chat/.next \
            recoder-extension/src/dist \
            package.json \
            docker-compose.production.yml

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v3
        with:
          name: deployment-package
          path: deployment.tar.gz

      - name: Deploy to staging
        if: success()
        run: |
          echo "🚀 Deployment package ready for staging"
          echo "Package size: $(du -h deployment.tar.gz | cut -f1)"
          
      - name: Notify deployment
        if: success()
        run: |
          echo "✅ CI/CD Pipeline completed successfully"
          echo "🔍 Test Coverage: Core packages tested"
          echo "🛡️ Security: Audit passed"
          echo "📦 Build: Production ready"
          echo "🚀 Ready for staging deployment"