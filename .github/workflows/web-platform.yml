name: Web Platform CI/CD

# CI checks for recoder-web changes.
# Production deployment is handled by deploy.yml (Hetzner SSH).

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'recoder-web/**'
      - 'packages/shared/**'
      - '.github/workflows/web-platform.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'recoder-web/**'
      - 'packages/shared/**'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ===== BUILD AND TEST =====
  test:
    name: Required - Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./recoder-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test
        env:
          NODE_ENV: test

  # ===== SECURITY SCAN =====
  security:
    name: Required - Security Scan
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run strict leak scan
        run: bash scripts/leak-scan-strict.sh

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ===== BUILD =====
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      build-id: ${{ steps.build-info.outputs.build-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./recoder-web
        run: pnpm install --frozen-lockfile

      - name: Build application
        working-directory: ./recoder-web
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: true

      - name: Generate build info
        id: build-info
        run: |
          BUILD_ID=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-platform-build-${{ steps.build-info.outputs.build-id }}
          path: |
            recoder-web/.next
            recoder-web/package.json
            recoder-web/next.config.ts
          retention-days: 7

  # ===== POST-BUILD SMOKE TEST =====
  smoke-test:
    name: Advisory - Static Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static asset smoke test
        run: |
          if [ -f app/scripts/smoke-static-assets.sh ]; then
            chmod +x app/scripts/smoke-static-assets.sh
            BASE_URL="https://web.recoder.xyz" app/scripts/smoke-static-assets.sh
          else
            echo "Smoke test script not found, skipping"
          fi

  # Note: Production deployment is handled by deploy.yml (Hetzner SSH + Docker Compose).
  # This workflow only runs CI checks (test, lint, build, security scan).

  # ===== CI SUMMARY =====
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, security, build, smoke-test]
    if: always()

    steps:
      - name: Generate report
        run: |
          echo "## Web Platform CI Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test & Lint | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build ID: ${{ needs.build.outputs.build-id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production deployment is handled by **deploy.yml** on push to main." >> $GITHUB_STEP_SUMMARY

  # ===== CLEANUP =====
  cleanup:
    name: Advisory - Cleanup
    runs-on: ubuntu-latest
    needs: [build]
    if: always()

    steps:
      - name: Clean up old artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const oldArtifacts = artifacts.data.artifacts
              .filter(artifact => artifact.name.startsWith('web-platform-build-'))
              .filter(artifact => {
                const createdAt = new Date(artifact.created_at);
                const threeDaysAgo = new Date();
                threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
                return createdAt < threeDaysAgo;
              });

            for (const artifact of oldArtifacts) {
              console.log(`Deleting artifact: ${artifact.name}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
