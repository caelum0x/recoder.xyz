name: Automated Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - load

env:
  NODE_VERSION: '20'

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================
  # UNIT TESTS
  # =============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.test_suite == 'unit' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == ''

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: 'docker-backend', path: 'docker-backend', install: 'pnpm install', test: 'pnpm test', node: '20' }
          - { name: 'app', path: 'app', install: 'pnpm install', test: 'pnpm test', node: '20' }
          - { name: 'desktop', path: 'apps/desktop', install: 'npm ci', test: 'npx vitest run', node: '20' }
          - { name: 'recoder-studio', path: 'recoder-studio', install: 'pnpm install', test: 'pnpm test', node: '24' }
          - { name: 'recoder-pm', path: 'recoder-pm', install: 'pnpm install', test: 'pnpm test', node: '20' }
          - { name: 'recoder-frontend', path: 'recoder-frontend', install: 'pnpm install', test: 'pnpm run ci:test', node: '20' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.platform.node || env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.platform.path }}
        run: ${{ matrix.platform.install }}

      - name: Run ${{ matrix.platform.name }} tests
        working-directory: ${{ matrix.platform.path }}
        run: ${{ matrix.platform.test }}
        env:
          CI: true
          SKIP_ENV_VALIDATION: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform.name }}
          path: |
            ${{ matrix.platform.path }}/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # =============================================
  # MOBILE TYPE CHECK
  # =============================================
  mobile-typecheck:
    name: Mobile TypeCheck
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.test_suite == 'unit' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: pnpm install

      - name: TypeCheck
        working-directory: apps/mobile
        run: pnpm run typecheck
        env:
          CI: true

  # =============================================
  # INTEGRATION TESTS
  # =============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.test_suite == 'integration' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == ''

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install docker-backend
        working-directory: docker-backend
        run: pnpm install

      - name: Run docker-backend integration tests
        working-directory: docker-backend
        run: pnpm test
        env:
          CI: true
          SKIP_ENV_VALIDATION: true
          REDIS_URL: redis://localhost:6379

  # =============================================
  # K6 LOAD TESTS (PR smoke only)
  # =============================================
  load-test-smoke:
    name: Advisory - Load Test (Smoke)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event.inputs.test_suite == 'load' ||
      github.event.inputs.test_suite == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/smoke.k6.js
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'https://recoder.xyz' }}
        continue-on-error: true

  # =============================================
  # TEST SUMMARY
  # =============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, mobile-typecheck, integration-tests, load-test-smoke]
    if: always()

    steps:
      - name: Generate report
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile TypeCheck | ${{ needs.mobile-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Test (Smoke) | ${{ needs.load-test-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
