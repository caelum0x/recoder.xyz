name: Phase 3 Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  phase3-gates-dev:
    name: Phase 3 Gates (Dev Mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Run Phase 3 gates (dev, dry)
        env:
          PHASE3_MODE: local-dev
          DRY_RUN: true
          SKIP_ENV_GATES: true
          SKIP_TYPECHECK_GATES: true
          ENABLE_A2A_INTEROP_SMOKE: false
          A2A_WORKER_STATUS_CHECK: false
        run: pnpm run phase3:gates

      - name: Build Phase 3 evidence bundle
        if: always()
        run: pnpm run phase3:evidence-pack

      - name: Upload Phase 3 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-gates-evidence
          path: |
            logs/phase3-gates/
            logs/phase3-evidence/
          if-no-files-found: ignore
