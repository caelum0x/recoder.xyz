name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_cooldown:
        description: 'Skip deploy cooldown (emergency only)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # =============================================
  # PRE-DEPLOY GATES
  # =============================================
  pre-deploy:
    name: Pre-Deploy Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run strict leak scan
        run: bash scripts/leak-scan-strict.sh

      - name: Deploy cooldown check
        if: github.event.inputs.skip_cooldown != 'true'
        run: |
          echo "Checking deploy cooldown..."
          # Use GitHub API to check last successful deploy
          LAST_RUN=$(gh run list --workflow=deploy.yml --status=success --limit=1 --json updatedAt --jq '.[0].updatedAt // empty' 2>/dev/null || echo "")
          if [[ -n "$LAST_RUN" ]]; then
            LAST_TS=$(date -d "$LAST_RUN" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_RUN" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - LAST_TS))
            if [[ "$DIFF" -lt 600 ]]; then
              echo "WARNING: Last deploy was $((DIFF / 60))m ago (cooldown: 10m). Proceeding anyway for push-to-main."
            else
              echo "OK: Last deploy was $((DIFF / 60))m ago. Cooldown satisfied."
            fi
          else
            echo "OK: No previous deploy found."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pre-deploy health check (production)
        run: |
          echo "Checking current production health before deploying..."
          ENDPOINTS=(
            "https://recoder.xyz/"
            "https://api.recoder.xyz/health"
          )
          ALL_OK=true
          for url in "${ENDPOINTS[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 -L "$url" 2>/dev/null || echo "000")
            if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
              echo "  [OK] $url -> HTTP $HTTP_CODE"
            else
              echo "  [WARN] $url -> HTTP $HTTP_CODE (may be down already)"
              ALL_OK=false
            fi
          done
          if [[ "$ALL_OK" == "false" ]]; then
            echo "WARNING: Some endpoints are already unhealthy. Deploying may fix this."
          fi

  # =============================================
  # DEPLOY
  # =============================================
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [pre-deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record deploy start
        run: echo "DEPLOY_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build & Rolling Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "========================================="
            echo "  Deploying recoder.xyz to production"
            echo "  Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "========================================="

            cd /root/recoder.xyz

            # Save current commit for potential rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "$PREV_COMMIT" > /tmp/recoder-prev-deploy-commit

            # Pull latest code
            echo ""
            echo ">>> Pulling latest code..."
            git pull origin main

            NEW_COMMIT=$(git rev-parse HEAD)
            echo ">>> Deploying: ${PREV_COMMIT:0:8} -> ${NEW_COMMIT:0:8}"

            # ── Batch 1: parallel builds ──
            echo ""
            echo ">>> Batch 1: Building app, recoder-frontend, docker-backend, openclaw..."

            BUILD_FAILURES=0

            (
              cd /root/recoder.xyz/app && npm install && npx next build
              echo "  [batch1] app build complete"
            ) &
            PID_APP=$!

            (
              cd /root/recoder.xyz/recoder-frontend && npm install && npx next build
              echo "  [batch1] recoder-frontend build complete"
            ) &
            PID_FRONTEND=$!

            (
              cd /root/recoder.xyz/docker-backend && npm install && npm run build
              echo "  [batch1] docker-backend build complete"
            ) &
            PID_DOCKER=$!

            (
              cd /root/recoder.xyz/openclaw && npm install && npm run build
              echo "  [batch1] openclaw build complete"
            ) &
            PID_OPENCLAW=$!

            for PID in $PID_APP $PID_FRONTEND $PID_DOCKER $PID_OPENCLAW; do
              if ! wait $PID; then
                BUILD_FAILURES=$((BUILD_FAILURES + 1))
              fi
            done

            if [[ "$BUILD_FAILURES" -gt 0 ]]; then
              echo "CRITICAL: ${BUILD_FAILURES} Batch 1 builds failed!"
              echo "Rolling back to ${PREV_COMMIT:0:8}..."
              git checkout "$PREV_COMMIT"
              exit 1
            fi
            echo ">>> Batch 1 complete (all builds passed)"

            # ── Batch 2: parallel builds (recoder-pm, recoder-agency) ──
            echo ""
            echo ">>> Batch 2: Building recoder-pm and recoder-agency..."

            (
              cd /root/recoder.xyz/recoder-pm && pnpm install --no-frozen-lockfile && pnpm build
              echo "  [batch2] recoder-pm build complete"
            ) &
            PID_PM=$!

            (
              cd /root/recoder.xyz/recoder-agency && pnpm install --no-frozen-lockfile && pnpm build
              echo "  [batch2] recoder-agency build complete"
            ) &
            PID_AGENCY=$!

            for PID in $PID_PM $PID_AGENCY; do
              if ! wait $PID; then
                BUILD_FAILURES=$((BUILD_FAILURES + 1))
              fi
            done

            if [[ "$BUILD_FAILURES" -gt 0 ]]; then
              echo "WARNING: ${BUILD_FAILURES} Batch 2 builds failed. Continuing with partial deploy."
            fi
            echo ">>> Batch 2 complete"

            # ── Batch 3: sequential build (recoder-studio) ──
            echo ""
            echo ">>> Batch 3: Building recoder-studio..."
            cd /root/recoder.xyz
            pnpm install --no-frozen-lockfile --filter recoder-studio...
            cd /root/recoder.xyz/recoder-studio
            if ! npx next build; then
              echo "ADVISORY: recoder-studio build failed (non-critical)"
            fi
            echo ">>> Batch 3 complete"

            # ── Create log directories for PM2 ──
            echo ""
            echo ">>> Ensuring log directories exist..."
            mkdir -p /root/recoder.xyz/logs/{recoder-app,recoder-frontend,docker-backend,recoder-backend,recoder-pm,recoder-studio,recoder-agency,openclaw}

            # ── Deploy nginx config ──
            echo ""
            echo ">>> Deploying nginx production config..."
            cp /root/recoder.xyz/nginx/nginx-production.conf /etc/nginx/nginx.conf
            if nginx -t; then
              nginx -s reload
            else
              echo "ADVISORY: nginx config test failed, skipping reload"
            fi

            # ── Rolling restart with health verification ──
            echo ""
            echo ">>> Rolling restart with health verification..."
            cd /root/recoder.xyz

            PM2_SERVICES=(
              "recoder-app|https://recoder.xyz/"
              "recoder-frontend|https://frontend.recoder.xyz/"
              "recoder-backend|https://backend.recoder.xyz/v1/health"
              "recoder-pm|https://pm.recoder.xyz/"
              "recoder-studio|https://studio.recoder.xyz/"
              "recoder-agency|https://agency.recoder.xyz/"
            )

            DOCKER_SERVICES=(
              "docker-backend|https://api.recoder.xyz/health"
              "openclaw-gateway|https://openclaw.recoder.xyz/health"
            )

            HEALTH_FAILURES=0
            FAILED_SERVICES=""

            # Restart PM2 services with rolling health checks
            for entry in "${PM2_SERVICES[@]}"; do
              PM2_NAME="${entry%%|*}"
              HEALTH_URL="${entry##*|}"

              echo ""
              echo "  Restarting ${PM2_NAME} (PM2)..."
              pm2 restart "$PM2_NAME" || { echo "  [SKIP] ${PM2_NAME} not in PM2, skipping"; continue; }

              HEALTHY=false
              for i in $(seq 1 6); do
                sleep 5
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 5 --max-time 10 \
                  -L "$HEALTH_URL" 2>/dev/null || echo "000")

                if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
                  echo "  [PASS] ${PM2_NAME} -> HTTP ${HTTP_CODE} (${HEALTH_URL})"
                  HEALTHY=true
                  break
                fi
                echo "  [WAIT] ${PM2_NAME} -> HTTP ${HTTP_CODE} (attempt ${i}/6)"
              done

              if [[ "$HEALTHY" != "true" ]]; then
                echo "  [FAIL] ${PM2_NAME} did not become healthy within 30s"
                HEALTH_FAILURES=$((HEALTH_FAILURES + 1))
                FAILED_SERVICES="${FAILED_SERVICES} ${PM2_NAME}"
              fi
            done

            # Restart Docker services
            for entry in "${DOCKER_SERVICES[@]}"; do
              COMPOSE_SVC="${entry%%|*}"
              HEALTH_URL="${entry##*|}"

              echo ""
              echo "  Restarting ${COMPOSE_SVC} (Docker)..."
              docker compose -f docker-compose.deploy.yml up -d --build "$COMPOSE_SVC"

              HEALTHY=false
              for i in $(seq 1 12); do
                sleep 5
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 5 --max-time 10 \
                  -L "$HEALTH_URL" 2>/dev/null || echo "000")

                if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
                  echo "  [PASS] ${COMPOSE_SVC} -> HTTP ${HTTP_CODE} (${HEALTH_URL})"
                  HEALTHY=true
                  break
                fi
                echo "  [WAIT] ${COMPOSE_SVC} -> HTTP ${HTTP_CODE} (attempt ${i}/12)"
              done

              if [[ "$HEALTHY" != "true" ]]; then
                echo "  [FAIL] ${COMPOSE_SVC} did not become healthy within 60s"
                HEALTH_FAILURES=$((HEALTH_FAILURES + 1))
                FAILED_SERVICES="${FAILED_SERVICES} ${COMPOSE_SVC}"
              fi
            done

            TOTAL_SERVICES=$((${#PM2_SERVICES[@]} + ${#DOCKER_SERVICES[@]}))
            echo ""
            echo ">>> Rolling restart complete: $((TOTAL_SERVICES - HEALTH_FAILURES))/${TOTAL_SERVICES} services healthy"

            # Write deploy result for post-deploy steps
            echo "$HEALTH_FAILURES" > /tmp/recoder-deploy-failures
            echo "$FAILED_SERVICES" > /tmp/recoder-deploy-failed-services

            if [[ "$HEALTH_FAILURES" -gt 2 ]]; then
              echo ""
              echo "CRITICAL: ${HEALTH_FAILURES} services failed health check!"
              echo "Failed:${FAILED_SERVICES}"
              echo ""
              echo "Automatic rollback: reverting to ${PREV_COMMIT:0:8}..."
              cd /root/recoder.xyz
              git checkout "$PREV_COMMIT"
              echo "Rollback complete. Manual investigation required."
              exit 1
            elif [[ "$HEALTH_FAILURES" -gt 0 ]]; then
              echo "WARNING: ${HEALTH_FAILURES} service(s) failed:${FAILED_SERVICES}"
            fi

            echo ""
            echo "========================================="
            echo "  Deployment complete!"
            echo "  Commit: ${NEW_COMMIT:0:8}"
            echo "  Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "========================================="

      - name: Advisory - Start A2A Workers
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /root/recoder.xyz
            if [ -x ./scripts/a2a-workers-hetzner.sh ]; then
              echo ">>> Restarting A2A workers..."
              ./scripts/a2a-workers-hetzner.sh restart
              sleep 5
              ./scripts/a2a-workers-hetzner.sh status
            else
              echo ">>> a2a-workers-hetzner.sh not found, skipping"
            fi

      - name: Post-Deploy Smoke Test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo ">>> Running post-deploy smoke tests..."
            bash /root/recoder.xyz/app/scripts/smoke-static-assets.sh
            echo ">>> Smoke tests passed"

      - name: Post-Deploy Branding Smoke Test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo ">>> Running branding endpoint smoke checks..."
            bash /root/recoder.xyz/scripts/smoke-branding-endpoints.sh
            echo ">>> Branding smoke checks passed"

      - name: A2A Production Smoke Test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /root/recoder.xyz
            if [ ! -f ./scripts/a2a-production-smoke.sh ]; then
              echo "WARN: a2a-production-smoke.sh not found — A2A smoke coverage is missing"
            else
              echo ">>> Running A2A production smoke tests..."
              BACKEND_URL=http://localhost:3100 bash ./scripts/a2a-production-smoke.sh
              echo ">>> A2A smoke tests passed"
            fi

      - name: Post-deploy comprehensive health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo ">>> Final comprehensive health check (2 minutes post-deploy)..."
            sleep 30

            ENDPOINTS=(
              "https://recoder.xyz/"
              "https://api.recoder.xyz/health"
              "https://frontend.recoder.xyz/"
              "https://pm.recoder.xyz/"
              "https://studio.recoder.xyz/"
              "https://agency.recoder.xyz/"
            )

            FINAL_FAILURES=0
            for url in "${ENDPOINTS[@]}"; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 -L "$url" 2>/dev/null || echo "000")
              if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
                echo "  [OK] $url -> HTTP $HTTP_CODE"
              else
                echo "  [FAIL] $url -> HTTP $HTTP_CODE"
                FINAL_FAILURES=$((FINAL_FAILURES + 1))
              fi
            done

            if [[ "$FINAL_FAILURES" -gt 3 ]]; then
              echo ""
              echo "CRITICAL: ${FINAL_FAILURES}/6 endpoints failing after deploy!"
              echo "Consider manual rollback: cd /root/recoder.xyz && git checkout \$(cat /tmp/recoder-prev-deploy-commit)"
              exit 1
            fi

            echo ""
            echo ">>> Post-deploy health: $((6 - FINAL_FAILURES))/6 endpoints healthy"

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Started**: ${{ env.DEPLOY_START }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
