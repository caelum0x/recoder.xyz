name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Build & Rolling Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            echo "========================================="
            echo "  Deploying recoder.xyz to production"
            echo "========================================="

            cd /root/recoder.xyz

            # Pull latest code
            echo ""
            echo ">>> Pulling latest code..."
            git pull origin main

            # ── Batch 1: parallel builds (app, recoder-frontend, recoder-web, docker-backend, openclaw) ──
            echo ""
            echo ">>> Batch 1: Building app, recoder-frontend, recoder-web, docker-backend, openclaw in parallel..."

            (
              cd /root/recoder.xyz/app && npm install && npx next build
              echo "  [batch1] app build complete"
            ) &
            PID_APP=$!

            (
              cd /root/recoder.xyz/recoder-frontend && npm install && npx next build
              echo "  [batch1] recoder-frontend build complete"
            ) &
            PID_FRONTEND=$!

            (
              cd /root/recoder.xyz/recoder-web && npm install && npm run build
              echo "  [batch1] recoder-web build complete"
            ) &
            PID_WEB=$!

            (
              cd /root/recoder.xyz/docker-backend && npm install && npm run build
              echo "  [batch1] docker-backend build complete"
            ) &
            PID_DOCKER=$!

            (
              cd /root/recoder.xyz/openclaw && npm install && npm run build
              echo "  [batch1] openclaw build complete"
            ) &
            PID_OPENCLAW=$!

            wait $PID_APP $PID_FRONTEND $PID_WEB $PID_DOCKER $PID_OPENCLAW
            echo ">>> Batch 1 complete"

            # ── Batch 2: parallel builds (recoder-pm, recoder-agency) ──
            echo ""
            echo ">>> Batch 2: Building recoder-pm and recoder-agency in parallel..."

            (
              cd /root/recoder.xyz/recoder-pm && pnpm install --no-frozen-lockfile && pnpm build
              echo "  [batch2] recoder-pm build complete"
            ) &
            PID_PM=$!

            (
              cd /root/recoder.xyz/recoder-agency && pnpm install --no-frozen-lockfile && pnpm build
              echo "  [batch2] recoder-agency build complete"
            ) &
            PID_AGENCY=$!

            wait $PID_PM $PID_AGENCY
            echo ">>> Batch 2 complete"

            # ── Batch 3: sequential build (recoder-studio — heavy, runs alone) ──
            # Studio is part of the root pnpm workspace; install from root to resolve workspace:* deps
            echo ""
            echo ">>> Batch 3: Building recoder-studio..."
            cd /root/recoder.xyz
            pnpm install --no-frozen-lockfile --filter recoder-studio...
            cd /root/recoder.xyz/recoder-studio
            npx next build
            echo ">>> Batch 3 complete"

            # ── Create log directories for PM2 ──
            echo ""
            echo ">>> Ensuring log directories exist..."
            mkdir -p /root/recoder.xyz/logs/{recoder-app,recoder-frontend,recoder-web,docker-backend,recoder-backend,recoder-pm,recoder-studio,recoder-agency,openclaw}

            # ── Deploy nginx config ──
            echo ""
            echo ">>> Deploying nginx production config..."
            cp /root/recoder.xyz/nginx/nginx-production.conf /etc/nginx/nginx.conf
            nginx -t && nginx -s reload || echo "WARNING: nginx config test failed, skipping reload"

            # ── Rolling restart with health verification ──
            echo ""
            echo ">>> Rolling restart with health verification..."
            cd /root/recoder.xyz

            SERVICES=(
              "recoder-app|https://recoder.xyz/"
              "recoder-frontend|https://frontend.recoder.xyz/"
              "recoder-web|https://web.recoder.xyz/"
              "docker-backend|https://api.recoder.xyz/health"
              "recoder-backend|https://backend.recoder.xyz/v1/health"
              "recoder-pm|https://pm.recoder.xyz/"
              "recoder-studio|https://studio.recoder.xyz/"
              "recoder-agency|https://agency.recoder.xyz/"
              "openclaw|https://openclaw.recoder.xyz/health"
            )

            HEALTH_FAILURES=0

            for entry in "${SERVICES[@]}"; do
              PM2_NAME="${entry%%|*}"
              HEALTH_URL="${entry##*|}"

              echo ""
              echo "  Restarting ${PM2_NAME}..."
              pm2 restart "$PM2_NAME" || true

              # Poll health URL for up to 30 seconds
              HEALTHY=false
              for i in $(seq 1 6); do
                sleep 5
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 5 --max-time 10 \
                  -L "$HEALTH_URL" 2>/dev/null || echo "000")

                if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
                  echo "  [PASS] ${PM2_NAME} -> HTTP ${HTTP_CODE} (${HEALTH_URL})"
                  HEALTHY=true
                  break
                fi
                echo "  [WAIT] ${PM2_NAME} -> HTTP ${HTTP_CODE} (attempt ${i}/6)"
              done

              if [[ "$HEALTHY" != "true" ]]; then
                echo "  [FAIL] ${PM2_NAME} did not become healthy within 30s"
                HEALTH_FAILURES=$((HEALTH_FAILURES + 1))
              fi
            done

            echo ""
            echo ">>> Rolling restart complete: $((${#SERVICES[@]} - HEALTH_FAILURES))/${#SERVICES[@]} services healthy"

            if [[ "$HEALTH_FAILURES" -gt 2 ]]; then
              echo "CRITICAL: ${HEALTH_FAILURES} services failed health check — deploy marked as FAILED"
              exit 1
            elif [[ "$HEALTH_FAILURES" -gt 0 ]]; then
              echo "WARNING: ${HEALTH_FAILURES} service(s) failed health check (threshold: >2 to fail deploy)"
            fi

            echo ""
            echo "========================================="
            echo "  Deployment complete!"
            echo "========================================="

      - name: Post-Deploy Smoke Test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.42.23.19
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo ">>> Running post-deploy smoke tests..."
            bash /root/recoder.xyz/app/scripts/smoke-static-assets.sh
            echo ">>> Smoke tests passed"
