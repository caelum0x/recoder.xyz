name: Test & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  COMPOSER_REQUIRE_INBOX: 'false'

jobs:
  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: recoder-web
            path: recoder-web
            install: npm install --legacy-peer-deps
          - name: recoder-extension
            path: recoder-extension/src
            install: npm install
          - name: cli
            path: packages/cli
            install: npm install
          - name: cli-router
            path: packages/recoder-cli-router
            install: npm install
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project.path }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: ${{ matrix.project.install }}
      
      - name: Run linter
        working-directory: ${{ matrix.project.path }}
        run: |
          if npm run lint --if-present; then
            echo "Linting passed"
          else
            echo "No linting configured or linting failed"
          fi
      
      - name: Run type checking
        working-directory: ${{ matrix.project.path }}
        run: |
          if npm run typecheck --if-present || npm run check-types --if-present; then
            echo "Type checking passed"
          else
            echo "No type checking configured"
          fi
      
      - name: Run tests
        working-directory: ${{ matrix.project.path }}
        run: |
          if npm run test --if-present; then
            echo "Tests passed"
          else
            echo "No tests configured"
          fi
      
      - name: Build project
        working-directory: ${{ matrix.project.path }}
        run: |
          case "${{ matrix.project.name }}" in
            "recoder-web")
              npm run build
              ;;
            "recoder-extension")
              npm run bundle
              ;;
            *)
              npm run build
              ;;
          esac

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run security audit (recoder-web)
        working-directory: recoder-web
        run: npm audit --audit-level high || true
      
      - name: Run security audit (recoder-extension)
        working-directory: recoder-extension/src
        run: npm audit --audit-level high || true
      
      - name: Run security audit (cli)
        working-directory: packages/cli
        run: npm audit --audit-level high || true
      
      - name: Run security audit (cli-router)
        working-directory: packages/recoder-cli-router
        run: npm audit --audit-level high || true

  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Test Docker build
        uses: docker/build-push-action@v5
        with:
          context: packages/recoder-cli-router
          file: packages/recoder-cli-router/Dockerfile
          push: false
          tags: recoder/cli-router:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval gate
        run: |
          node scripts/run-eval-benchmark.js
          node scripts/check-eval-gate.js

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts-${{ github.run_id }}
          path: |
            tools/evals/latest.json
            tools/evals/runs/*.json
            tools/evals/composer/latest.json
            tools/evals/composer/results/latest-results.json
          if-no-files-found: warn

  desktop-smoke:
    name: Desktop Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run desktop production smoke
        working-directory: apps/desktop
        run: npm run smoke:prod

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, security, docker-test, eval-gate, desktop-smoke]
    
    steps:
      - name: Quality Gate Check
        run: |
          echo "✅ All quality checks passed!"
          echo "- Tests completed"
          echo "- Security audit completed"
          echo "- Docker build test completed"
          echo "- Eval gate completed"
          echo "- Desktop smoke completed"
          echo "Ready for deployment!"
