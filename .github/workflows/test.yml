name: Test & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  COMPOSER_REQUIRE_INBOX: 'false'

jobs:
  test:
    name: Required - Test ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: recoder-web
            path: recoder-web
            install: npm install --legacy-peer-deps
            lint: npm run lint
            typecheck: npm run typecheck
            test: npm run test
            build: npm run build
          - name: cli
            path: packages/cli
            install: npm install
            lint: npm run lint
            typecheck: npm run typecheck
            test: npm run test
            build: npm run build
          - name: cli-router
            path: packages/recoder-cli-router
            install: npm install
            lint: ''
            typecheck: ''
            test: ''
            build: npm run build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project.path }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: ${{ matrix.project.install }}
      
      - name: Run linter
        if: matrix.project.lint != ''
        working-directory: ${{ matrix.project.path }}
        run: ${{ matrix.project.lint }}
      
      - name: Run type checking
        if: matrix.project.typecheck != ''
        working-directory: ${{ matrix.project.path }}
        run: ${{ matrix.project.typecheck }}
      
      - name: Run tests
        if: matrix.project.test != ''
        working-directory: ${{ matrix.project.path }}
        run: ${{ matrix.project.test }}
      
      - name: Build project
        working-directory: ${{ matrix.project.path }}
        run: ${{ matrix.project.build }}

  security:
    name: Advisory - Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run security audit (recoder-web)
        working-directory: recoder-web
        run: npm audit --audit-level high
      
      - name: Run security audit (cli)
        working-directory: packages/cli
        run: npm audit --audit-level high
      
      - name: Run security audit (cli-router)
        working-directory: packages/recoder-cli-router
        run: npm audit --audit-level high

  docker-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Test Docker build
        uses: docker/build-push-action@v5
        with:
          context: packages/recoder-cli-router
          file: packages/recoder-cli-router/Dockerfile
          push: false
          tags: recoder/cli-router:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval gate
        run: |
          node scripts/run-eval-benchmark.js
          node scripts/check-eval-gate.js

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts-${{ github.run_id }}
          path: |
            tools/evals/latest.json
            tools/evals/runs/*.json
            tools/evals/composer/latest.json
            tools/evals/composer/results/latest-results.json
          if-no-files-found: warn

  desktop-smoke:
    name: Desktop Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run desktop production smoke
        working-directory: apps/desktop
        run: npm run smoke:prod

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, security, docker-test, eval-gate, desktop-smoke]
    
    steps:
      - name: Quality Gate Check
        run: |
          echo "✅ All quality checks passed!"
          echo "- Tests completed"
          echo "- Security audit completed"
          echo "- Docker build test completed"
          echo "- Eval gate completed"
          echo "- Desktop smoke completed"
          echo "Ready for deployment!"
