name: Agency Deploy Gate

on:
  workflow_dispatch:
  workflow_call:

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recoder-agency
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: recoder-agency/package.json
      - name: Set node version to 24.x
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: recoder-agency/pnpm-lock.yaml
      - run: pnpm install
      - name: Build SDK
        run: pnpm build-sdk
      - name: Type check
        run: pnpm check-types
      - name: Test
        run: pnpm test

  db-guardrails:
    runs-on: ubuntu-latest
    env:
      AGENCY_STAGING_DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run transition guardrails
        if: env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/test_transition_guardrails.sql
      - name: Seed and verify metrics fixture pipeline
        if: env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/seed_weekly_delivery_metrics_fixture.sql
          psql "$AGENCY_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/assert_weekly_delivery_metrics_fixture.sql
      - name: Run release readiness assertions
        if: env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v stale_days=${WEEKLY_METRICS_STALE_AFTER_DAYS:-10} \
            -f recoder-agency/apps/agency/db/scripts/assert_delivery_release_readiness.sql
      - name: Cleanup metrics fixture
        if: always() && env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/cleanup_weekly_delivery_metrics_fixture.sql

  smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recoder-agency
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: recoder-agency/package.json
      - name: Set node version to 24.x
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: recoder-agency/pnpm-lock.yaml
      - run: pnpm install
      - name: Install Playwright browsers (chromium only)
        run: pnpm -C apps/agency exec playwright install --with-deps chromium
      - name: Run smoke tests
        run: pnpm -C apps/agency exec playwright test --project=chromium --grep @smoke
        env:
          CI: true
