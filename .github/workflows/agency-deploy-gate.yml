name: Agency Deploy Gate

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # Requires full recoder-agency codebase committed to git.
  # Skips gracefully when package.json is not present.
  typecheck-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recoder-agency
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check if agency codebase exists
        id: check
        run: test -f package.json && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - name: Isolate agency workspace
        if: steps.check.outputs.exists == 'true'
        run: rm -f ../pnpm-workspace.yaml ../package.json
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        if: steps.check.outputs.exists == 'true'
        with:
          version: "10.16.0"
      - name: Set node version to 24.x
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.x
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pnpm install
      - name: Build SDK
        if: steps.check.outputs.exists == 'true'
        run: pnpm run build-sdk
      - name: Type check
        if: steps.check.outputs.exists == 'true'
        run: pnpm run check-types
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: pnpm run test
      - name: Skip notice
        if: steps.check.outputs.exists != 'true'
        run: echo "::notice::Skipped — recoder-agency codebase not yet committed to git"

  db-guardrails:
    runs-on: ubuntu-latest
    env:
      AGENCY_STAGING_DATABASE_URL: ${{ secrets.AGENCY_STAGING_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run transition guardrails
        if: env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/test_transition_guardrails.sql
      - name: Seed and verify metrics fixture pipeline
        if: env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/seed_weekly_delivery_metrics_fixture.sql
          psql "$AGENCY_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/assert_weekly_delivery_metrics_fixture.sql
      - name: Run release readiness assertions
        if: env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v stale_days=${WEEKLY_METRICS_STALE_AFTER_DAYS:-10} \
            -f recoder-agency/apps/agency/db/scripts/assert_delivery_release_readiness.sql
      - name: Cleanup metrics fixture
        if: always() && env.AGENCY_STAGING_DATABASE_URL != ''
        run: |
          psql "$AGENCY_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f recoder-agency/apps/agency/db/scripts/cleanup_weekly_delivery_metrics_fixture.sql

  # Requires full recoder-agency codebase committed to git.
  smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recoder-agency
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check if agency codebase exists
        id: check
        run: test -f package.json && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - name: Isolate agency workspace
        if: steps.check.outputs.exists == 'true'
        run: rm -f ../pnpm-workspace.yaml ../package.json
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        if: steps.check.outputs.exists == 'true'
        with:
          version: "10.16.0"
      - name: Set node version to 24.x
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.x
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pnpm install
      - name: Install Playwright browsers (chromium only)
        if: steps.check.outputs.exists == 'true'
        run: npx -y playwright install --with-deps chromium
      - name: Run smoke tests
        if: steps.check.outputs.exists == 'true'
        run: pnpm run --filter agency test:e2e -- --project=chromium --grep @smoke
        env:
          CI: true
      - name: Skip notice
        if: steps.check.outputs.exists != 'true'
        run: echo "::notice::Skipped — recoder-agency codebase not yet committed to git"
