name: Release Automation

# Handles version bumping, changelog generation, GitHub release creation,
# and triggers deploy.yml for production deployment to Hetzner.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      release_channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      should-release: ${{ steps.check.outputs.should-release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run strict leak scan
        run: bash scripts/leak-scan-strict.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Determine new version
        id: version
        run: |
          current_version="${{ steps.current-version.outputs.version }}"
          bump_type="${{ github.event.inputs.version_bump }}"
          channel="${{ github.event.inputs.release_channel }}"

          if [ "$bump_type" = "prerelease" ]; then
            if [ "$channel" = "beta" ]; then
              new_version=$(npm version prerelease --preid=beta --no-git-tag-version)
            elif [ "$channel" = "alpha" ]; then
              new_version=$(npm version prerelease --preid=alpha --no-git-tag-version)
            else
              new_version=$(npm version prerelease --no-git-tag-version)
            fi
          else
            new_version=$(npm version $bump_type --no-git-tag-version)
          fi

          # Remove 'v' prefix if present
          new_version=${new_version#v}
          echo "new-version=$new_version" >> $GITHUB_OUTPUT
          echo "New version: $new_version"

      - name: Generate changelog
        id: changelog
        run: |
          # Install conventional-changelog-cli if not present
          npm install -g conventional-changelog-cli

          # Generate changelog
          changelog=$(conventional-changelog -p angular -u)

          # Escape for GitHub output
          changelog="${changelog//'%'/'%25'}"
          changelog="${changelog//$'\n'/'%0A'}"
          changelog="${changelog//$'\r'/'%0D'}"

          echo "changelog=$changelog" >> $GITHUB_OUTPUT

      - name: Update package.json files
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          new_version="${{ steps.version.outputs.new-version }}"

          # Update root package.json
          npm version $new_version --no-git-tag-version

          # Update workspace package.json files if they exist
          if [ -d packages ]; then
            find packages -maxdepth 2 -name "package.json" -exec npm version $new_version --prefix {} --no-git-tag-version \;
          fi

      - name: Update CHANGELOG.md
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          new_version="${{ steps.version.outputs.new-version }}"
          changelog="${{ steps.changelog.outputs.changelog }}"

          # Create new changelog entry
          echo "# Changelog" > CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md
          echo "## [$new_version] - $(date +%Y-%m-%d)" >> CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md
          echo "$changelog" >> CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md

          # Append existing changelog if it exists
          if [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md >> CHANGELOG.new.md
          fi

          mv CHANGELOG.new.md CHANGELOG.md

      - name: Commit version bump
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          new_version="${{ steps.version.outputs.new-version }}"

          git add .
          git commit -m "chore: bump version to $new_version [skip ci]"
          git tag "v$new_version"
          git push origin main
          git push origin "v$new_version"

      - name: Check if should release
        id: check
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "Dry run mode - skipping actual release"
          else
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    name: Build and Test
    needs: prepare-release
    if: needs.prepare-release.outputs.should-release == 'true'
    uses: ./.github/workflows/master-pipeline.yml
    secrets: inherit

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-and-test]
    if: always() && needs.prepare-release.outputs.should-release == 'true' && needs.build-and-test.result != 'failure'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare-release.outputs.new-version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare-release.outputs.new-version }}
          name: Recoder v${{ needs.prepare-release.outputs.new-version }}
          body: |
            ${{ needs.prepare-release.outputs.changelog }}

            ## What's Changed
            See the full changelog at https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md

            ## Deployment
            Production deployment is handled automatically via `deploy.yml` when changes are pushed to `main`.
          prerelease: ${{ contains(needs.prepare-release.outputs.new-version, '-') }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Advisory - Publish to NPM
    runs-on: ubuntu-latest
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.should-release == 'true'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare-release.outputs.new-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Check if CLI package exists
        id: check-cli
        run: |
          if [ -f packages/cli/package.json ]; then
            echo "has-cli=true" >> $GITHUB_OUTPUT
          else
            echo "has-cli=false" >> $GITHUB_OUTPUT
            echo "No CLI package found, skipping NPM publish"
          fi

      - name: Install and build CLI
        if: steps.check-cli.outputs.has-cli == 'true'
        working-directory: ./packages/cli
        run: |
          npm install
          npm run build

      - name: Publish to NPM
        if: steps.check-cli.outputs.has-cli == 'true'
        working-directory: ./packages/cli
        run: |
          channel="${{ github.event.inputs.release_channel }}"
          if [ "$channel" = "stable" ]; then
            npm publish --access public
          else
            npm publish --access public --tag $channel
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Note: Production deployment happens automatically via deploy.yml on push to main.
  # The version bump commit (with [skip ci]) won't trigger deploy.yml,
  # so trigger it explicitly for stable releases.
  deploy-production:
    name: Deploy to Production (Hetzner)
    runs-on: ubuntu-latest
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.should-release == 'true' && github.event.inputs.release_channel == 'stable'
    environment: production

    steps:
      - name: Trigger deploy workflow
        run: |
          echo "Triggering production deployment via deploy.yml..."
          gh workflow run deploy.yml \
            --ref main \
            -f skip_cooldown=true
          echo "Deploy workflow triggered for v${{ needs.prepare-release.outputs.new-version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Advisory - Notify Release
    runs-on: ubuntu-latest
    needs: [prepare-release, deploy-production]
    if: always() && needs.prepare-release.outputs.should-release == 'true'

    steps:
      - name: Notify Discord
        if: success()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Discord webhook not configured, skipping"
            exit 0
          fi
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Recoder v${{ needs.prepare-release.outputs.new-version }} Released!",
                "description": "New version has been released and deployed to production.",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Version",
                    "value": "v${{ needs.prepare-release.outputs.new-version }}",
                    "inline": true
                  },
                  {
                    "name": "Channel",
                    "value": "${{ github.event.inputs.release_channel }}",
                    "inline": true
                  }
                ],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'

      - name: Notify Slack
        if: success()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Slack webhook not configured, skipping"
            exit 0
          fi
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "Recoder v${{ needs.prepare-release.outputs.new-version }} has been released and deployed to production!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Recoder v${{ needs.prepare-release.outputs.new-version }}* has been successfully released!"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\nv${{ needs.prepare-release.outputs.new-version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Channel:*\n${{ github.event.inputs.release_channel }}"
                    }
                  ]
                }
              ]
            }'

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Discord webhook not configured, skipping"
            exit 0
          fi
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Recoder Release Failed",
                "description": "Release process for v${{ needs.prepare-release.outputs.new-version }} encountered errors.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Version",
                    "value": "v${{ needs.prepare-release.outputs.new-version }}",
                    "inline": true
                  },
                  {
                    "name": "Channel",
                    "value": "${{ github.event.inputs.release_channel }}",
                    "inline": true
                  },
                  {
                    "name": "Action",
                    "value": "[View Failed Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                    "inline": false
                  }
                ]
              }]
            }'
