name: Release Automation

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      release_channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      should-release: ${{ steps.check.outputs.should-release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Determine new version
        id: version
        run: |
          current_version="${{ steps.current-version.outputs.version }}"
          bump_type="${{ github.event.inputs.version_bump }}"
          channel="${{ github.event.inputs.release_channel }}"
          
          if [ "$bump_type" = "prerelease" ]; then
            if [ "$channel" = "beta" ]; then
              new_version=$(npm version prerelease --preid=beta --no-git-tag-version)
            elif [ "$channel" = "alpha" ]; then
              new_version=$(npm version prerelease --preid=alpha --no-git-tag-version)
            else
              new_version=$(npm version prerelease --no-git-tag-version)
            fi
          else
            new_version=$(npm version $bump_type --no-git-tag-version)
          fi
          
          # Remove 'v' prefix if present
          new_version=${new_version#v}
          echo "new-version=$new_version" >> $GITHUB_OUTPUT
          echo "New version: $new_version"

      - name: Generate changelog
        id: changelog
        run: |
          # Install conventional-changelog-cli if not present
          npm install -g conventional-changelog-cli
          
          # Generate changelog
          changelog=$(conventional-changelog -p angular -u)
          
          # Escape for GitHub output
          changelog="${changelog//'%'/'%25'}"
          changelog="${changelog//$'\n'/'%0A'}"
          changelog="${changelog//$'\r'/'%0D'}"
          
          echo "changelog=$changelog" >> $GITHUB_OUTPUT

      - name: Update package.json files
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          new_version="${{ steps.version.outputs.new-version }}"
          
          # Update root package.json
          npm version $new_version --no-git-tag-version
          
          # Update all package.json files in workspace
          find packages -name "package.json" -exec npm version $new_version --prefix {} --no-git-tag-version \;

      - name: Update CHANGELOG.md
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          new_version="${{ steps.version.outputs.new-version }}"
          changelog="${{ steps.changelog.outputs.changelog }}"
          
          # Create new changelog entry
          echo "# Changelog" > CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md
          echo "## [$new_version] - $(date +%Y-%m-%d)" >> CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md
          echo "$changelog" >> CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md
          
          # Append existing changelog if it exists
          if [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md >> CHANGELOG.new.md
          fi
          
          mv CHANGELOG.new.md CHANGELOG.md

      - name: Commit version bump
        if: ${{ !github.event.inputs.dry_run }}
        run: |
          new_version="${{ steps.version.outputs.new-version }}"
          
          git add .
          git commit -m "chore: bump version to $new_version [skip ci]"
          git tag "v$new_version"
          git push origin main
          git push origin "v$new_version"

      - name: Check if should release
        id: check
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "Dry run mode - skipping actual release"
          else
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    name: Build and Test
    needs: prepare-release
    if: needs.prepare-release.outputs.should-release == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-and-test]
    if: needs.prepare-release.outputs.should-release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare-release.outputs.new-version }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Organize release assets
        run: |
          mkdir -p release/
          find release-artifacts/ -name "codecraft-*" -type f -exec cp {} release/ \;
          find release-artifacts/ -name "*.dmg" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" | xargs -I {} cp {} release/

      - name: Generate checksums
        run: |
          cd release/
          sha256sum * > checksums.txt
          echo "## File Checksums (SHA256)" >> ../release-notes.md
          echo "\`\`\`" >> ../release-notes.md
          cat checksums.txt >> ../release-notes.md
          echo "\`\`\`" >> ../release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare-release.outputs.new-version }}
          name: CodeCraft CLI v${{ needs.prepare-release.outputs.new-version }}
          body: |
            ${{ needs.prepare-release.outputs.changelog }}
            
            ## Installation
            
            ### NPM (Recommended)
            ```bash
            npm install -g @recoder/cli@${{ needs.prepare-release.outputs.new-version }}
            ```
            
            ### Homebrew (macOS/Linux)
            ```bash
            brew install recoder/tap/codecraft
            ```
            
            ### Chocolatey (Windows)
            ```bash
            choco install codecraft
            ```
            
            ### Docker
            ```bash
            docker run -it recoder/codecraft:${{ needs.prepare-release.outputs.new-version }}
            ```
            
            ## What's Changed
            See the full changelog at https://github.com/recoder-team/recoder/blob/main/CHANGELOG.md
          files: release/*
          prerelease: ${{ contains(needs.prepare-release.outputs.new-version, '-') }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.should-release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare-release.outputs.new-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build:core

      - name: Publish to NPM
        run: |
          channel="${{ github.event.inputs.release_channel }}"
          if [ "$channel" = "stable" ]; then
            npm publish --access public
          else
            npm publish --access public --tag $channel
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-package-managers:
    name: Update Package Managers
    runs-on: ubuntu-latest
    needs: [prepare-release, publish-npm]
    if: needs.prepare-release.outputs.should-release == 'true' && github.event.inputs.release_channel == 'stable'

    steps:
      - name: Update Homebrew Formula
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.HOMEBREW_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/recoder-team/homebrew-tap/dispatches" \
            -d '{
              "event_type": "update-formula",
              "client_payload": {
                "version": "${{ needs.prepare-release.outputs.new-version }}",
                "tag": "v${{ needs.prepare-release.outputs.new-version }}"
              }
            }'

      - name: Update Chocolatey Package
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.CHOCOLATEY_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/recoder-team/chocolatey-packages/dispatches" \
            -d '{
              "event_type": "update-package",
              "client_payload": {
                "version": "${{ needs.prepare-release.outputs.new-version }}",
                "tag": "v${{ needs.prepare-release.outputs.new-version }}"
              }
            }'

      - name: Update Winget Package
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.WINGET_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/microsoft/winget-pkgs/dispatches" \
            -d '{
              "event_type": "update-package",
              "client_payload": {
                "package": "CodeCraft.CLI",
                "version": "${{ needs.prepare-release.outputs.new-version }}",
                "tag": "v${{ needs.prepare-release.outputs.new-version }}"
              }
            }'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [prepare-release, update-package-managers]
    if: needs.prepare-release.outputs.should-release == 'true' && github.event.inputs.release_channel == 'stable'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare-release.outputs.new-version }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name production-cluster

      - name: Deploy to production
        run: |
          helm upgrade --install codecraft-production \
            deployment/kubernetes/helm-chart \
            --namespace codecraft-production \
            --create-namespace \
            --set image.tag=v${{ needs.prepare-release.outputs.new-version }} \
            --set ingress.hosts[0].host=cli.codecraft.dev \
            --values deployment/kubernetes/helm-chart/values-production.yaml \
            --wait --timeout=15m

      - name: Run production health checks
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=codecraft-cli -n codecraft-production --timeout=300s
          kubectl exec -n codecraft-production deployment/codecraft-cli -- codecraft --version
          
          # Additional health checks
          curl -f https://cli.codecraft.dev/health || exit 1

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [prepare-release, deploy-production]
    if: always() && needs.prepare-release.outputs.should-release == 'true'

    steps:
      - name: Notify Discord
        if: success()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🎉 CodeCraft CLI v${{ needs.prepare-release.outputs.new-version }} Released!",
                "description": "New version is now available across all distribution channels.",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Version",
                    "value": "v${{ needs.prepare-release.outputs.new-version }}",
                    "inline": true
                  },
                  {
                    "name": "Channel",
                    "value": "${{ github.event.inputs.release_channel }}",
                    "inline": true
                  },
                  {
                    "name": "Installation",
                    "value": "`npm install -g @recoder/cli@${{ needs.prepare-release.outputs.new-version }}`",
                    "inline": false
                  }
                ],
                "timestamp": "${{ github.event.repository.updated_at }}"
              }]
            }'

      - name: Notify Slack
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚀 CodeCraft CLI v${{ needs.prepare-release.outputs.new-version }} has been released and deployed to production!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CodeCraft CLI v${{ needs.prepare-release.outputs.new-version }}* has been successfully released!"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\nv${{ needs.prepare-release.outputs.new-version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Channel:*\n${{ github.event.inputs.release_channel }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Release"
                      },
                      "url": "https://github.com/recoder-team/recoder/releases/tag/v${{ needs.prepare-release.outputs.new-version }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Documentation"
                      },
                      "url": "https://codecraft.dev/docs"
                    }
                  ]
                }
              ]
            }'

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ CodeCraft CLI Release Failed",
                "description": "Release process for v${{ needs.prepare-release.outputs.new-version }} encountered errors.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Version",
                    "value": "v${{ needs.prepare-release.outputs.new-version }}",
                    "inline": true
                  },
                  {
                    "name": "Channel",
                    "value": "${{ github.event.inputs.release_channel }}",
                    "inline": true
                  },
                  {
                    "name": "Action",
                    "value": "[View Failed Workflow](https://github.com/recoder-team/recoder/actions/runs/${{ github.run_id }})",
                    "inline": false
                  }
                ]
              }]
            }'