name: recoder-build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install (site standalone package)
        working-directory: site
        run: pnpm install --ignore-workspace --no-frozen-lockfile
      - name: build site
        working-directory: site
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: '1'
          SITE_ASSET_PREFIX: /__site
          NEXT_PUBLIC_APP_URL: https://recoder.xyz
          NEXT_PUBLIC_DOWNLOAD_MACOS_URL: https://recoder.xyz/releases/Recoder-arm64.dmg
          NEXT_PUBLIC_RELEASE_VISIBILITY: public
          NEXT_PUBLIC_RELEASE_VERSION: v0.16.5
        run: pnpm build
      - name: package standalone
        run: |
          set -e
          cd site
          test -d .next/standalone || { echo "NO standalone"; ls -la .next; exit 1; }
          SA=.next/standalone
          SRV=$(find "$SA" -maxdepth 3 -name server.js | head -1)
          echo "server.js at: $SRV"
          APPDIR=$(dirname "$SRV")
          mkdir -p "$APPDIR/.next"
          cp -r .next/static "$APPDIR/.next/static"
          [ -d public ] && cp -r public "$APPDIR/public" || true
          printf '%s' "${APPDIR#$SA/}" > "$SA/.server-subdir"
          echo "server subdir: $(cat "$SA/.server-subdir")"
          tar czf ../site-standalone.tar.gz -C "$SA" .
          ls -lh ../site-standalone.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: site-standalone
          path: site-standalone.tar.gz
          retention-days: 1
