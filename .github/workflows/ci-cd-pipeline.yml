name: 🚀 Recoder.xyz CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # ============================================================================
  # Code Quality and Testing
  # ============================================================================
  
  code-quality:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Run ESLint
        run: npm run lint
      
      - name: 🎨 Check Prettier formatting
        run: npm run format:check
      
      - name: 🔒 Security audit
        run: npm audit --audit-level=high
      
      - name: 📊 Upload code quality results
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-cli:
    name: 🧪 Test CLI Package
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      matrix:
        node-version: [18, 20, 21]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build CLI
        run: |
          cd packages/cli
          npm run build
      
      - name: 🧪 Run CLI tests
        run: |
          cd packages/cli
          npm test -- --coverage
      
      - name: 📊 Upload CLI coverage
        uses: codecov/codecov-action@v3
        with:
          file: packages/cli/coverage/lcov.info
          flags: cli
          name: cli-coverage

  test-web:
    name: 🌐 Test Web Platform
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: |
          cd recoder-web
          npm ci
      
      - name: 🏗️ Build Web Platform
        run: |
          cd recoder-web
          npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      
      - name: 🧪 Run Web Platform tests
        run: |
          cd recoder-web
          npm test -- --coverage
      
      - name: 📊 Upload Web coverage
        uses: codecov/codecov-action@v3
        with:
          file: recoder-web/coverage/lcov.info
          flags: web
          name: web-coverage

  test-extension:
    name: 🔌 Test VS Code Extension
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: |
          cd recoder-extension/src
          npm ci
      
      - name: 🏗️ Build Extension
        run: |
          cd recoder-extension/src
          npm run bundle
      
      - name: 🧪 Run Extension tests
        run: |
          cd recoder-extension/src
          npm test
        env:
          DISPLAY: ':99.0'
      
      - name: 📊 Upload Extension coverage
        uses: codecov/codecov-action@v3
        with:
          file: recoder-extension/src/coverage/lcov.info
          flags: extension
          name: extension-coverage

  # ============================================================================
  # Integration Testing
  # ============================================================================
  
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [test-cli, test-web, test-extension]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recoder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🗄️ Setup test database
        run: |
          cd recoder-web
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recoder_test
      
      - name: 🧪 Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recoder_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  # ============================================================================
  # Security Scanning
  # ============================================================================
  
  security-scan:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: 📊 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: 🔐 Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ============================================================================
  # Build Artifacts
  # ============================================================================
  
  build-artifacts:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build all packages
        run: npm run build:all
      
      - name: 📦 Package CLI
        run: |
          cd packages/cli
          npm pack
          mv *.tgz recoder-cli.tgz
      
      - name: 📦 Package Extension VSIX
        run: |
          cd recoder-extension/src
          npx vsce package --out recoder-extension.vsix
      
      - name: 📤 Upload CLI artifact
        uses: actions/upload-artifact@v3
        with:
          name: recoder-cli
          path: packages/cli/recoder-cli.tgz
      
      - name: 📤 Upload Extension artifact
        uses: actions/upload-artifact@v3
        with:
          name: recoder-extension
          path: recoder-extension/src/recoder-extension.vsix

  # ============================================================================
  # Staging Deployment
  # ============================================================================
  
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🌐 Deploy Web Platform to Vercel (staging)
        run: |
          cd recoder-web
          npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: 📦 Publish CLI to npm (beta)
        run: |
          cd packages/cli
          npm publish --tag beta
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: 🔌 Publish Extension (pre-release)
        run: |
          cd recoder-extension/src
          npx vsce publish --pre-release --pat ${{ secrets.VSCE_PAT }}

  # ============================================================================
  # Production Deployment
  # ============================================================================
  
  deploy-production:
    name: 🎉 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.event_name == 'release'
    environment: production
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🌐 Deploy Web Platform to Vercel (production)
        run: |
          cd recoder-web
          npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: 📦 Publish CLI to npm
        run: |
          cd packages/cli
          npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: 🔌 Publish Extension to Marketplace
        run: |
          cd recoder-extension/src
          npx vsce publish --pat ${{ secrets.VSCE_PAT }}
      
      - name: 🔌 Publish Extension to Open VSX
        run: |
          cd recoder-extension/src
          npx ovsx publish --pat ${{ secrets.OVSX_PAT }}

  # ============================================================================
  # Post-deployment
  # ============================================================================
  
  post-deployment:
    name: 📊 Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event_name == 'release'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔔 Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            🚀 Recoder.xyz has been deployed to production!
            
            Release: ${{ github.event.release.tag_name }}
            
            Components deployed:
            • CLI: Available on npm
            • Web Platform: https://web.recoder.xyz
            • VS Code Extension: Available on marketplace
            
            All systems operational! 🎉
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
      
      - name: 📈 Update monitoring
        run: |
          # Add monitoring setup commands here
          echo "Setting up production monitoring..."
      
      - name: 🏷️ Create deployment tag
        run: |
          git tag -a "deployment-$(date +%Y%m%d-%H%M%S)" -m "Production deployment"
          git push origin --tags

  # ============================================================================
  # Cleanup
  # ============================================================================
  
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    
    steps:
      - name: 🗑️ Clean up artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            
            // Keep artifacts for 7 days, then clean up
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);
            
            for (const artifact of artifacts.data.artifacts) {
              if (new Date(artifact.created_at) < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }