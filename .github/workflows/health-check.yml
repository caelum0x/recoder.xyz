name: Production Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes

jobs:
  health-check:
    name: Production Endpoint Health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check all production endpoints
        run: |
          # ── define services ────────────────────────────────────────
          # Format: "Name|URL"
          SERVICES=(
            "App Hub|https://recoder.xyz"
            "Suna IDE|https://frontend.recoder.xyz"
            "Bolt IDE|https://web.recoder.xyz"
            "Docker Backend|https://api.recoder.xyz/health"
            "Python Backend|https://backend.recoder.xyz/v1/health"
            "Project Management|https://pm.recoder.xyz"
            "Workflow Studio|https://studio.recoder.xyz"
            "AI Agency|https://agency.recoder.xyz"
            "OpenClaw|https://openclaw.recoder.xyz/health"
          )

          TOTAL=${#SERVICES[@]}
          PASSED=0
          FAILED=0
          FAILED_NAMES=""
          SLOW_THRESHOLD_MS=5000

          # Start JSON artifact
          echo '[' > health-results.json

          echo "## Production Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| # | Service | URL | HTTP Status | Response Time | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---------|-----|-------------|---------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          INDEX=0
          FIRST_JSON=true
          for entry in "${SERVICES[@]}"; do
            INDEX=$((INDEX + 1))
            NAME="${entry%%|*}"
            URL="${entry##*|}"

            # Capture both HTTP code and response time
            CURL_OUTPUT=$(curl -s -o /dev/null -w "%{http_code}|%{time_total}" \
              --connect-timeout 10 --max-time 30 \
              -L "$URL" 2>/dev/null || echo "000|0")

            HTTP_CODE="${CURL_OUTPUT%%|*}"
            RESPONSE_TIME="${CURL_OUTPUT##*|}"
            RESPONSE_MS=$(echo "$RESPONSE_TIME * 1000" | bc | cut -d. -f1)
            # Default to 0 if bc returns empty
            RESPONSE_MS="${RESPONSE_MS:-0}"

            SLOW_FLAG=""
            if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
              if [[ "$RESPONSE_MS" -gt "$SLOW_THRESHOLD_MS" ]]; then
                STATUS="SLOW"
                SLOW_FLAG=" :warning: SLOW"
                PASSED=$((PASSED + 1))
              else
                STATUS="UP"
                PASSED=$((PASSED + 1))
              fi
              echo "| $INDEX | $NAME | \`$URL\` | $HTTP_CODE | ${RESPONSE_MS}ms | :white_check_mark: ${STATUS}${SLOW_FLAG} |" >> "$GITHUB_STEP_SUMMARY"
            else
              STATUS="DOWN"
              FAILED=$((FAILED + 1))
              FAILED_NAMES="${FAILED_NAMES}  - ${NAME} (${URL}) -> HTTP ${HTTP_CODE}\n"
              echo "| $INDEX | $NAME | \`$URL\` | $HTTP_CODE | ${RESPONSE_MS}ms | :x: DOWN |" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "[$STATUS] $NAME ($URL) -> HTTP $HTTP_CODE, ${RESPONSE_MS}ms"

            # Append JSON entry
            if [[ "$FIRST_JSON" != "true" ]]; then
              echo ',' >> health-results.json
            fi
            FIRST_JSON=false
            cat >> health-results.json <<ENTRY
          {"name":"$NAME","url":"$URL","httpCode":$HTTP_CODE,"responseTimeMs":$RESPONSE_MS,"status":"$STATUS"}
          ENTRY
          done

          echo ']' >> health-results.json

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result: ${PASSED}/${TOTAL} services healthy** (slow threshold: ${SLOW_THRESHOLD_MS}ms)" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FAILED" -gt 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Failed services" >> "$GITHUB_STEP_SUMMARY"
            echo -e "$FAILED_NAMES" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "=== HEALTH CHECK FAILED ==="
            echo "${FAILED} service(s) unreachable:"
            echo -e "$FAILED_NAMES"
            exit 1
          fi

          echo ""
          echo "=== ALL ${TOTAL} SERVICES HEALTHY ==="

      - name: Upload health results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-results
          path: health-results.json
          retention-days: 30
