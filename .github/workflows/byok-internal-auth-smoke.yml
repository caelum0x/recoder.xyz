name: BYOK Internal Auth Smoke

on:
  workflow_dispatch:
    inputs:
      recoder_web_url:
        description: "recoder-web URL"
        required: false
        default: "https://web.recoder.xyz"
        type: string
      main_site_url:
        description: "main app URL"
        required: false
        default: "https://recoder.xyz"
        type: string
      project_id:
        description: "project id override (optional)"
        required: false
        type: string
jobs:
  byok-smoke:
    name: BYOK Prompt/Task/Stream Smoke
    runs-on: ubuntu-latest
    env:
      RECODER_WEB_URL: ${{ inputs.recoder_web_url || secrets.SMOKE_RECODER_WEB_URL || 'https://web.recoder.xyz' }}
      MAIN_SITE_URL: ${{ inputs.main_site_url || secrets.SMOKE_MAIN_SITE_URL || 'https://recoder.xyz' }}
      PROJECT_ID: ${{ inputs.project_id || secrets.SMOKE_PROJECT_ID }}
      PUBLIC_API_KEY: ${{ secrets.SMOKE_PUBLIC_API_KEY }}
      USER_SESSION_TOKEN: ${{ secrets.SMOKE_USER_SESSION_TOKEN }}
      AUTH_VERIFY_TOKEN: ${{ secrets.SMOKE_AUTH_VERIFY_TOKEN || secrets.SMOKE_USER_SESSION_TOKEN }}
      SESSION_COOKIE_NAME: ${{ secrets.SMOKE_SESSION_COOKIE_NAME || '__Secure-recoder.session_token' }}
      INTERNAL_SERVICE_KEY: ${{ secrets.SMOKE_INTERNAL_SERVICE_KEY }}
      MODEL_NAME: ${{ secrets.SMOKE_MODEL_NAME || 'openai/gpt-4o-mini' }}
      TASK_POLL_ATTEMPTS: ${{ secrets.SMOKE_TASK_POLL_ATTEMPTS || '20' }}
      TASK_POLL_SLEEP_SECONDS: ${{ secrets.SMOKE_TASK_POLL_SLEEP_SECONDS || '2' }}
      PROMPT_TEXT: ${{ secrets.SMOKE_PROMPT_TEXT || 'Create a tiny hello-world update and report done.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Advisory - Probe byok readiness endpoint
        run: |
          URL="${RECODER_WEB_URL%/}/api/health/byok-readiness"
          BODY="$(mktemp)"
          STATUS="$(curl -sS -o "$BODY" -w "%{http_code}" "$URL" || true)"
          echo "byok readiness HTTP: ${STATUS}"
          cat "$BODY"
          echo ""
          echo "## BYOK Readiness Probe" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP: ${STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Body:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required smoke secrets
        id: validate
        run: |
          missing=0
          if [ -z "${PROJECT_ID}" ]; then
            echo "Missing PROJECT_ID (set secrets.SMOKE_PROJECT_ID or workflow input project_id)"
            missing=1
          fi
          if [ -z "${PUBLIC_API_KEY}" ]; then
            echo "Missing PUBLIC_API_KEY (set secrets.SMOKE_PUBLIC_API_KEY)"
            missing=1
          fi
          if [ -z "${USER_SESSION_TOKEN}" ]; then
            echo "Missing USER_SESSION_TOKEN (set secrets.SMOKE_USER_SESSION_TOKEN)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run BYOK internal auth smoke
        if: steps.validate.outputs.ready == 'true'
        run: |
          chmod +x recoder-web/scripts/smoke-byok-internal-auth.sh
          recoder-web/scripts/smoke-byok-internal-auth.sh

      - name: Skip notice (missing secrets)
        if: steps.validate.outputs.ready != 'true'
        run: |
          echo "Skipping BYOK smoke: required secrets are not configured."
          echo "Configure SMOKE_PROJECT_ID, SMOKE_PUBLIC_API_KEY, and SMOKE_USER_SESSION_TOKEN to enable full smoke."

      - name: Summary
        if: always()
        run: |
          echo "## BYOK Internal Auth Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- recoder-web URL: ${RECODER_WEB_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- main app URL: ${MAIN_SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- project id set: $([ -n "${PROJECT_ID}" ] && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"
          echo "- smoke executed: ${{ steps.validate.outputs.ready == 'true' && 'yes' || 'no (missing secrets)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
