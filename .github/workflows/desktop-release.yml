name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_script: build:linux
          - os: windows-latest
            platform: windows
            build_script: build:win
          - os: macos-latest
            platform: mac
            build_script: build:mac:ci-signed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Desktop quality gate (lint + unit smoke)
        working-directory: apps/desktop
        run: |
          npm run lint
          npm test

      - name: Run desktop smoke gate
        working-directory: apps/desktop
        run: npm run smoke:prod

      - name: Validate Apple signing secrets (mac)
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=0
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required mac signing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build desktop artifacts (linux/windows)
        if: matrix.platform != 'mac'
        working-directory: apps/desktop
        run: npm run ${{ matrix.build_script }}

      - name: Build desktop artifacts (mac signed + notarized)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}

      - name: Validate release artifacts
        working-directory: apps/desktop
        run: npm run validate:release -- --platform ${{ matrix.platform }} --dist dist

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.platform }}
          path: |
            apps/desktop/dist/**
          if-no-files-found: error

  publish-release:
    name: Publish Desktop Release
    runs-on: ubuntu-latest
    needs: [build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release asset tree
        run: |
          mkdir -p flat-assets
          find release-assets -maxdepth 5 -type f -print0 | while IFS= read -r -d '' f; do
            parent="$(basename "$(dirname "$f")")"
            base="$(basename "$f")"
            cp "$f" "flat-assets/${parent}-${base}"
          done
          ls -la flat-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: flat-assets/*
          generate_release_notes: true
