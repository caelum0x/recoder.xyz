# Desktop Release — macOS Apple-Silicon signed + notarized DMG pipeline for the
# Recoder desktop app (apps/desktop). This is the Recoder-native replacement for
# the upstream Wave Terminal build-helper/publish workflows (which point at
# wavetermdev S3 + DigiCert infra and do NOT apply here — see
# apps/desktop/RELEASES.md).
#
# It runs the SAME orchestrator a human runs locally — scripts/release-desktop.sh
# — so CI and local releases are the identical pipeline: version bump -> build ->
# native inside-out codesign -> dmg -> notarytool -> staple -> verify.
#
# Signing/notarization is env-gated in apps/desktop/app/electron-builder.config.cjs
# and scripts/release-desktop.sh; NO cert or key is stored in the repo. All creds
# come from GitHub Actions secrets, seeded once with:
#   pnpm run set:desktop-release-secrets -- --from-env-file .env.desktop-release --write
# Required secrets (see RELEASE.md for the full table):
#   DESKTOP_CSC_LINK, DESKTOP_CSC_KEY_PASSWORD  (Developer ID Application .p12, base64)
# And one notarization credential set:
#   DESKTOP_APPLE_API_KEY (base64 .p8), DESKTOP_APPLE_API_KEY_ID,
#   DESKTOP_APPLE_API_ISSUER
# Or the legacy Apple-ID set:
#   DESKTOP_APPLE_ID, DESKTOP_APPLE_APP_SPECIFIC_PASSWORD, DESKTOP_APPLE_TEAM_ID
#
# Release only from `main` (bd recoder-mhyt). Tags: v0.0.0 / v0.0.0-beta.N.

name: Desktop Release

run-name: "Desktop Release ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Config-validate only (no build, no signing)"
        type: boolean
        default: true
      publish:
        description: "Assemble the hosted release dir after signing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.25.6"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ── Fast, cheap gate: validate the pipeline is structurally sound on every
  # trigger. Runs on Linux, needs no certs, no build. Mirrors the local
  # `scripts/release-desktop.sh dry-run`.
  validate:
    name: Validate release config
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck desktop app
        run: pnpm run typecheck:desktop
      - name: Packaging-config tests
        run: pnpm -C apps/desktop/app exec vitest run tests/packaging-config.test.ts tests/assert-extra-resources.test.ts tests/assert-license-boundary.test.ts
      - name: Release pipeline dry-run (config-validate)
        run: bash scripts/release-desktop.sh dry-run

  # ── The real signed build. macOS Apple-Silicon runner. Only runs for a tag
  # push or an explicit non-dry-run manual dispatch (needs the org secrets).
  build-sign-notarize:
    name: Build, sign & notarize (macOS arm64)
    needs: validate
    if: ${{ github.event_name == 'push' || github.event.inputs.dry-run == 'false' }}
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Build the native engine artifacts (Rust NAPI addons, loom, bd, tmux) and
      # the recoder-server binary that electron-builder's beforePack gate requires
      # as extraResources. Absent → the fail-loud gate aborts packaging.
      - name: Build desktop engines + server
        run: |
          pnpm run build:recoder:desktop:engines
          pnpm run build:recoder:desktop:server

      # Self-contained backend node_modules so the bundle's symlinks resolve
      # inside the .app (source pnpm symlinks dangle and abort codesign). Uses
      # `pnpm deploy --prod` (keeps transitive prod deps like @next/swc; see
      # docs/OWNER-RUNBOOK.md §1). If the pnpm-deploy incantation needs tuning for
      # this workspace, adjust here — this staging step is the only CI-specific
      # bit not exercised by the local `release-desktop.sh` path.
      - name: Stage self-contained backend node_modules
        id: backend_deploy
        run: |
          pnpm --filter=recoder-backend deploy --prod --legacy "$RUNNER_TEMP/backend-deploy"
          echo "path=$RUNNER_TEMP/backend-deploy/node_modules" >> "$GITHUB_OUTPUT"

      # Import the Developer ID Application cert into a throwaway keychain so
      # `codesign -s` can find it by name. CSC_LINK is the base64 .p12.
      - name: Import signing certificate
        env:
          DESKTOP_CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          DESKTOP_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/recoder-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_P12="$RUNNER_TEMP/cert.p12"
          echo "$DESKTOP_CSC_LINK" | base64 --decode > "$CERT_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$DESKTOP_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$SIGN_ID" || { echo "no Developer ID Application identity imported"; exit 1; }
          echo "RECODER_SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
          rm -f "$CERT_P12"

      - name: Prepare notarization credentials
        env:
          DESKTOP_APPLE_API_KEY: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          DESKTOP_APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          DESKTOP_APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          DESKTOP_APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          DESKTOP_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          DESKTOP_APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$DESKTOP_APPLE_API_KEY" ] && [ -n "$DESKTOP_APPLE_API_KEY_ID" ] && [ -n "$DESKTOP_APPLE_API_ISSUER" ]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${DESKTOP_APPLE_API_KEY_ID}.p8"
            printf '%s' "$DESKTOP_APPLE_API_KEY" | base64 --decode > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            {
              printf 'APPLE_API_KEY=%s\n' "$API_KEY_PATH"
              printf 'APPLE_API_KEY_ID=%s\n' "$DESKTOP_APPLE_API_KEY_ID"
              printf 'APPLE_API_ISSUER=%s\n' "$DESKTOP_APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "using App Store Connect API-key notarization"
          elif [ -n "$DESKTOP_APPLE_ID" ] && [ -n "$DESKTOP_APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$DESKTOP_APPLE_TEAM_ID" ]; then
            {
              printf 'APPLE_ID=%s\n' "$DESKTOP_APPLE_ID"
              printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$DESKTOP_APPLE_APP_SPECIFIC_PASSWORD"
              printf 'APPLE_TEAM_ID=%s\n' "$DESKTOP_APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "using Apple-ID notarization"
          else
            echo "no complete notarization credential set configured" >&2
            exit 1
          fi

      - name: Release — build, sign, notarize, staple, verify
        env:
          RECODER_BACKEND_NODE_MODULES: ${{ steps.backend_deploy.outputs.path }}
          RECODER_MAC_ARCH: arm64
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.publish }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            EXTRA="--publish"
          fi
          bash scripts/release-desktop.sh release $EXTRA

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recoder-desktop-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/app/Recoder-arm64.dmg
            apps/desktop/app/make/license-boundary-darwin-arm64.json
            dist/desktop-release/**
