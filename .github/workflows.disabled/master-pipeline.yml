name: Recoder.xyz CI Pipeline

# CI checks only — actual deployment handled by deploy.yml
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  SKIP_ENV_VALIDATION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-manifest-check:
    name: Workspace Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate pnpm workspace manifest
        run: bash scripts/validate-workspace-manifest.sh

      - name: Validate workspace boundary documentation
        run: test -f docs/workspace-boundaries.md

  first-party-script-contract-check:
    name: First-Party Script Contract Validation
    runs-on: ubuntu-latest
    needs: [workspace-manifest-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate first-party script contracts
        run: bash scripts/validate-first-party-scripts.sh

  required-workflow-policy-check:
    name: Required Workflow Policy Validation
    runs-on: ubuntu-latest
    needs: [workspace-manifest-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required workflow policy
        run: bash scripts/validate-required-workflow-policy.sh

  # =============================================
  # HEALTH CHECK & PLATFORM DETECTION
  # =============================================
  health-check:
    name: Platform Detection
    runs-on: ubuntu-latest
    needs: [workspace-manifest-check, first-party-script-contract-check, required-workflow-policy-check]
    outputs:
      has-app: ${{ steps.platforms.outputs.has-app }}
      has-backend: ${{ steps.platforms.outputs.has-backend }}
      has-docker-backend: ${{ steps.platforms.outputs.has-docker-backend }}
      has-studio: ${{ steps.platforms.outputs.has-studio }}
      has-agency: ${{ steps.platforms.outputs.has-agency }}
      has-pm: ${{ steps.platforms.outputs.has-pm }}
      has-frontend: ${{ steps.platforms.outputs.has-frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect platforms
        id: platforms
        run: |
          set -e
          echo "has-app=$([[ -d app ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-backend=$([[ -d backend ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-docker-backend=$([[ -d docker-backend ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-studio=$([[ -d recoder-studio ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-agency=$([[ -d recoder-agency ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-pm=$([[ -d recoder-pm ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has-frontend=$([[ -d recoder-frontend ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Recoder.xyz Platform Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Found |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| app (Hub) | ${{ steps.platforms.outputs.has-app }} |" >> $GITHUB_STEP_SUMMARY
          echo "| backend (Python API) | ${{ steps.platforms.outputs.has-backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| docker-backend (A2A Gateway) | ${{ steps.platforms.outputs.has-docker-backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| recoder-studio (Workflow Builder) | ${{ steps.platforms.outputs.has-studio }} |" >> $GITHUB_STEP_SUMMARY
          echo "| recoder-agency (Multi-Agent) | ${{ steps.platforms.outputs.has-agency }} |" >> $GITHUB_STEP_SUMMARY
          echo "| recoder-pm (Project Management) | ${{ steps.platforms.outputs.has-pm }} |" >> $GITHUB_STEP_SUMMARY
          echo "| recoder-frontend (AI IDE) | ${{ steps.platforms.outputs.has-frontend }} |" >> $GITHUB_STEP_SUMMARY

  # =============================================
  # DOCKER-BACKEND BUILD & TEST
  # =============================================
  docker-backend-check:
    name: Test docker-backend
    runs-on: ubuntu-latest
    needs: [health-check]
    if: needs.health-check.outputs.has-docker-backend == 'true'

    defaults:
      run:
        working-directory: ./docker-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: docker-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test
        env:
          SKIP_ENV_VALIDATION: true

  # =============================================
  # SECURITY SCANNING
  # =============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [workspace-manifest-check, first-party-script-contract-check, required-workflow-policy-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CodeQL Init
        uses: github/codeql-action/init@v3
        with:
          languages: typescript, javascript
          queries: security-and-quality

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Secret detection
        run: bash scripts/leak-scan-strict.sh

  # =============================================
  # TEST COVERAGE
  # =============================================
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # ---- docker-backend coverage ----
      - name: Install docker-backend dependencies
        if: needs.health-check.outputs.has-docker-backend == 'true'
        working-directory: ./docker-backend
        run: pnpm install --no-frozen-lockfile

      - name: Run docker-backend coverage
        if: needs.health-check.outputs.has-docker-backend == 'true'
        working-directory: ./docker-backend
        run: pnpm run test:coverage
        env:
          SKIP_ENV_VALIDATION: true

      # ---- app (Hub) coverage ----
      - name: Install app dependencies
        if: needs.health-check.outputs.has-app == 'true'
        working-directory: ./app
        run: pnpm install --no-frozen-lockfile

      - name: Run app coverage
        if: needs.health-check.outputs.has-app == 'true'
        working-directory: ./app
        run: pnpm run test:coverage
        env:
          SKIP_ENV_VALIDATION: true

      # ---- Aggregate coverage ----
      - name: Aggregate coverage reports
        run: node scripts/aggregate-coverage.mjs
        env:
          COVERAGE_MIN_LINES: '50'
          COVERAGE_MIN_STATEMENTS: '50'
          COVERAGE_MIN_FUNCTIONS: '50'
          COVERAGE_MIN_BRANCHES: '40'

      - name: Post coverage summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f logs/coverage/aggregate-summary.json ]; then
            echo "### Aggregate Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat logs/coverage/aggregate-summary.json >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract percentages for the summary table
            lines_pct=$(node -pe "JSON.parse(require('fs').readFileSync('logs/coverage/aggregate-summary.json','utf8')).aggregate.lines.pct")
            stmts_pct=$(node -pe "JSON.parse(require('fs').readFileSync('logs/coverage/aggregate-summary.json','utf8')).aggregate.statements.pct")
            funcs_pct=$(node -pe "JSON.parse(require('fs').readFileSync('logs/coverage/aggregate-summary.json','utf8')).aggregate.functions.pct")
            branches_pct=$(node -pe "JSON.parse(require('fs').readFileSync('logs/coverage/aggregate-summary.json','utf8')).aggregate.branches.pct")

            echo "| Metric | Coverage | Threshold |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${lines_pct}% | 50% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${stmts_pct}% | 50% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${funcs_pct}% | 50% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${branches_pct}% | 40% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data was generated. This is expected if:" >> $GITHUB_STEP_SUMMARY
            echo "- Services have not yet added test suites" >> $GITHUB_STEP_SUMMARY
            echo "- Dependencies failed to install" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Services with coverage configured" >> $GITHUB_STEP_SUMMARY
            echo "- **docker-backend** — vitest + @vitest/coverage-v8" >> $GITHUB_STEP_SUMMARY
            echo "- **app** — vitest + @vitest/coverage-v8 (newly added)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            app/coverage/
            docker-backend/coverage/
            logs/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # =============================================
  # CI SUMMARY
  # =============================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [health-check, docker-backend-check, security-scan, test-coverage]
    if: always()

    steps:
      - name: Generate report
        run: |
          echo "## Recoder.xyz CI Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform Detection | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| docker-backend Tests | ${{ needs.docker-backend-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Coverage | ${{ needs.test-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment is handled by the separate **Deploy Production** workflow on push to main." >> $GITHUB_STEP_SUMMARY
