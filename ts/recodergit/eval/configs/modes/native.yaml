# Native mode — RecoderGit tools only, no grep enrichment
#
# Explicit tools: recodergit-query, recodergit-context, recodergit-impact, recodergit-cypher
# Available as fast bash commands (~100ms via eval-server)
#
# Use this mode to isolate the value of explicit tools without grep augmentation.
agent:
  agent_class: 'eval.agents.recodergit_agent.RecoderGitAgent'
  recodergit_mode: 'native'
  step_limit: 30
  cost_limit: 3.0
  track_recodergit_usage: true

environment:
  environment_class: 'eval.environments.recodergit_docker.RecoderGitDockerEnvironment'
  enable_recodergit: true
  skip_embeddings: true
  recodergit_timeout: 120
  eval_server_port: 4848
