name: Setup RecoderGit
description: Setup Node.js 22, install dependencies, and optionally build

inputs:
  build:
    description: Whether to run npm run build after install
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: recodergit/package-lock.json

    - name: Build recodergit-shared
      run: npm install && npm run build
      shell: bash
      working-directory: recodergit-shared

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: recodergit

    - name: Build
      if: ${{ inputs.build == 'true' }}
      run: npm run build
      shell: bash
      working-directory: recodergit
