labels: ["discussion", "showcase"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🎯 Show & Tell
        
        Share what you've built with Recoder Code! This is a space to:
        
        - 🚀 **Showcase projects** you've created with Recoder Code
        - 📱 **Demo workflows** that others might find useful  
        - 🔧 **Share configurations** and automation setups
        - 📈 **Highlight results** and productivity improvements
        - 🎨 **Display creative uses** of the tool
        
        Help inspire the community with your creations!

  - type: input
    id: project-title
    attributes:
      label: Project/Workflow Title
      description: Give your project or workflow a catchy name
      placeholder: "My Awesome React Component Generator"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Tell us about what you built and how Recoder Code helped
      placeholder: |
        Describe your project:
        - What problem does it solve?
        - How did you use Recoder Code?
        - What was the outcome?
        - Any interesting challenges or learnings?
    validations:
      required: true

  - type: dropdown
    id: project-type
    attributes:
      label: Project Type
      description: What category best describes your project?
      options:
        - Web Application
        - Mobile App
        - API/Backend Service
        - CLI Tool
        - Library/Package
        - Automation Script
        - Configuration Setup
        - Workflow/Process
        - Educational/Tutorial
        - Other
    validations:
      required: true

  - type: checkboxes
    id: technologies
    attributes:
      label: Technologies Used
      description: What technologies did you work with?
      options:
        - label: JavaScript/TypeScript
        - label: React/Vue/Angular
        - label: Node.js
        - label: Python
        - label: Go
        - label: Rust
        - label: Java
        - label: C#/.NET
        - label: PHP
        - label: Docker
        - label: Kubernetes
        - label: AWS/GCP/Azure
        - label: Database (SQL/NoSQL)
        - label: Other

  - type: textarea
    id: code-examples
    attributes:
      label: Code Examples
      description: Share some interesting code snippets or examples
      placeholder: |
        ```javascript
        // Example of how you used Recoder Code
        const result = await processWithRecoder(input);
        ```
      render: markdown

  - type: textarea
    id: demo-links
    attributes:
      label: Demo/Links
      description: Share links to your project (GitHub, live demo, etc.)
      placeholder: |
        - GitHub: https://github.com/yourusername/project
        - Live Demo: https://your-project.com
        - Blog Post: https://your-blog.com/post

  - type: textarea
    id: results
    attributes:
      label: Results & Impact
      description: What were the results? How much time did you save?
      placeholder: |
        - Reduced development time by 50%
        - Generated 200+ lines of boilerplate code automatically
        - Improved code quality and consistency
        - Enabled faster prototyping

  - type: textarea
    id: tips
    attributes:
      label: Tips & Learnings
      description: Share any tips or lessons learned that might help others
      placeholder: |
        - Best practices you discovered
        - Common pitfalls to avoid
        - Useful prompting techniques
        - Configuration tips

  - type: checkboxes
    id: permission
    attributes:
      label: Sharing Permission
      description: How can the community use your showcase?
      options:
        - label: You can feature this in Recoder Code documentation/blog
        - label: You can share this on social media
        - label: Community members can build upon this idea
        - label: This showcase includes open source code