name: Community Management

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened]
  discussion:
    types: [created]
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  welcome-new-contributors:
    name: Welcome New Contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: Check if first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              creator: context.payload.pull_request.user.login
            });
            
            const isFirstTime = pullRequests.length === 1;
            
            if (isFirstTime) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 🎉 Welcome to Recoder Code!
                
Thank you for your first contribution! We're excited to have you join our community.

### What happens next?
- Our team will review your pull request
- We'll provide feedback if needed
- Once approved, your changes will be merged

### Resources for new contributors:
- 📖 [Contributing Guide](https://github.com/anthropics/claude-code/blob/main/CONTRIBUTING.md)
- 🤝 [Code of Conduct](https://github.com/anthropics/claude-code/blob/main/CODE_OF_CONDUCT.md)
- 👥 [Developer Onboarding](https://github.com/anthropics/claude-code/blob/main/DEVELOPER_ONBOARDING.md)

### Questions?
Feel free to ask questions here or in our [discussions](https://github.com/anthropics/claude-code/discussions).

Thanks again for contributing! 🚀`
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['first-time-contributor']
              });
            }

  auto-label-issues:
    name: Auto-label Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Auto-label based on content
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = context.payload.issue.body.toLowerCase();
            const labels = [];
            
            // Auto-detect issue types
            if (title.includes('[bug]') || body.includes('error') || body.includes('crash')) {
              labels.push('bug');
            }
            
            if (title.includes('[feature]') || body.includes('feature request') || body.includes('enhancement')) {
              labels.push('enhancement');
            }
            
            if (body.includes('documentation') || title.includes('docs')) {
              labels.push('documentation');
            }
            
            // Auto-detect areas
            if (body.includes('model') || body.includes('ai') || body.includes('claude')) {
              labels.push('area:models');
            }
            
            if (body.includes('interactive') || body.includes('tui') || body.includes('terminal')) {
              labels.push('area:interactive');
            }
            
            if (body.includes('performance') || body.includes('slow') || body.includes('speed')) {
              labels.push('area:performance');
            }
            
            if (body.includes('git') || body.includes('repository')) {
              labels.push('area:git');
            }
            
            if (body.includes('docker') || body.includes('container')) {
              labels.push('area:docker');
            }
            
            // Auto-detect priority
            if (body.includes('critical') || body.includes('urgent') || body.includes('breaking')) {
              labels.push('priority:high');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }

  triage-new-issues:
    name: Triage New Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Add to triage
        uses: actions/github-script@v7
        with:
          script: |
            // Add triage label to all new issues
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['triage']
            });
            
            // Check if it's a security issue
            const title = context.payload.issue.title.toLowerCase();
            const body = context.payload.issue.body.toLowerCase();
            
            if (title.includes('security') || body.includes('vulnerability') || 
                body.includes('exploit') || body.includes('cve')) {
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['security']
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `## 🔒 Security Issue Detected

This issue has been flagged as potentially security-related. Our security team will review it promptly.

**Please note:** If this is a critical security vulnerability, please report it privately via our [security policy](https://github.com/anthropics/claude-code/security/policy) instead of this public issue.`
              });
            }

  good-first-issue-helper:
    name: Good First Issue Helper
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'labeled' && contains(github.event.label.name, 'good first issue')
    steps:
      - name: Add helpful comment for newcomers
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `## 🌟 Good First Issue

This issue has been marked as a good first issue! This means it's a great starting point for new contributors.

### Getting Started
1. 📖 Read our [Contributing Guide](https://github.com/anthropics/claude-code/blob/main/CONTRIBUTING.md)
2. 💻 Set up your [development environment](https://github.com/anthropics/claude-code/blob/main/DEVELOPER_ONBOARDING.md)
3. 💬 Comment below if you'd like to work on this issue
4. 🔄 Submit a pull request when ready

### Need Help?
- 💬 Ask questions in [discussions](https://github.com/anthropics/claude-code/discussions)
- 📧 Email us at dev-team@recoder-code.com
- 🕐 Join our office hours (details in contributing guide)

We're here to help! Don't hesitate to ask questions. 🚀`
            });

  stale-issue-manager:
    name: Manage Stale Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Mark stale issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            ## 🕐 Stale Issue Notice
            
            This issue has been automatically marked as stale because it has not had recent activity. 
            
            **It will be closed in 7 days if no further activity occurs.**
            
            If this issue is still relevant:
            - Add a comment to keep it open
            - Remove the stale label
            - Provide additional information or updates
            
            Thank you for your contribution! 🙏
          close-issue-message: |
            ## 🔒 Issue Closed - No Recent Activity
            
            This issue has been automatically closed due to inactivity. 
            
            **Don't worry!** If this issue is still relevant, you can:
            - Reopen it with additional information
            - Create a new issue with updated details
            - Comment below and we'll reopen it
            
            Thanks for your understanding! 💙
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,good first issue'
          exempt-pr-labels: 'pinned,security'

  discussion-welcome:
    name: Welcome New Discussions
    runs-on: ubuntu-latest
    if: github.event_name == 'discussion' && github.event.action == 'created'
    steps:
      - name: Welcome to discussions
        uses: actions/github-script@v7
        with:
          script: |
            const categories = {
              'Q&A': '❓',
              'Ideas': '💡', 
              'Show and tell': '🎯',
              'General': '💬'
            };
            
            const categoryEmoji = categories[context.payload.discussion.category.name] || '💬';
            
            // Only comment on first discussion from user
            const { data: discussions } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} type:discussion author:${context.payload.discussion.user.login}`
            });
            
            if (discussions.total_count === 1) {
              await github.rest.discussions.createComment({
                discussion_number: context.payload.discussion.number,
                body: `${categoryEmoji} **Welcome to Recoder Code Discussions!**

Thank you for starting this discussion! Our community is here to help and learn together.

### 📚 Helpful Resources
- [Documentation](https://github.com/anthropics/claude-code/blob/main/README.md)
- [Examples](https://github.com/anthropics/claude-code/tree/main/examples)
- [Contributing Guide](https://github.com/anthropics/claude-code/blob/main/CONTRIBUTING.md)

### 🤝 Community Guidelines
- Be respectful and constructive
- Search existing discussions before posting
- Provide context and examples when asking questions
- Share your knowledge to help others

We're excited to have you in our community! 🚀`
              });
            }

  weekly-community-report:
    name: Weekly Community Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Generate community metrics
        uses: actions/github-script@v7
        with:
          script: |
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            
            // Get metrics for the past week
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              since: oneWeekAgo.toISOString(),
              state: 'all'
            });
            
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              since: oneWeekAgo.toISOString()
            });
            
            const newIssues = issues.filter(issue => !issue.pull_request);
            const closedIssues = newIssues.filter(issue => issue.state === 'closed');
            const newPRs = prs.length;
            const mergedPRs = prs.filter(pr => pr.merged_at).length;
            
            const report = `# 📊 Weekly Community Report
            
## 📅 Week of ${oneWeekAgo.toDateString()}

### 📋 Issues
- **New Issues**: ${newIssues.length}
- **Closed Issues**: ${closedIssues.length}
- **Open Issues**: ${newIssues.length - closedIssues.length}

### 🔄 Pull Requests  
- **New PRs**: ${newPRs}
- **Merged PRs**: ${mergedPRs}
- **Open PRs**: ${newPRs - mergedPRs}

### 🎯 Top Contributors
${prs.slice(0, 5).map(pr => `- @${pr.user.login} - ${pr.title}`).join('\n')}

### 📈 Growth
- **New Contributors**: ${[...new Set(prs.map(pr => pr.user.login))].length}
- **Community Engagement**: ${(newIssues.length + newPRs) * 100 / 7} interactions/day

---
*Generated automatically by GitHub Actions*`;

            console.log(report);
            
            // Could post to Slack, Discord, or create a discussion post
            // For now, just log the metrics