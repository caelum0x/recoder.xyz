name: Production Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          npm audit --audit-level moderate
          node scripts/security-audit.js

      - name: Run SAST scan
        uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_DOCKERFILE_HADOLINT: true

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: |
          npm run test:integration
          npm run test:performance

      - name: Check package optimization
        run: node scripts/optimize-package.js

      - name: Validate documentation
        run: |
          # Check for required documentation
          test -f README.md
          test -f CHANGELOG.md
          test -f LICENSE.md
          test -f examples/basic-usage.md

  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: [security-scan, quality-gates]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-url: ${{ steps.build.outputs.image-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            COMMIT_SHA=${{ github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to staging
        run: |
          export KUBECONFIG=kubeconfig
          export IMAGE_TAG=${{ needs.build-and-push.outputs.image-digest }}
          
          # Update deployment with new image
          kubectl set image deployment/enhanced-ai-cli \
            enhanced-ai-cli=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }} \
            --namespace=staging
          
          # Wait for rollout
          kubectl rollout status deployment/enhanced-ai-cli --namespace=staging --timeout=300s

      - name: Run staging tests
        run: |
          export KUBECONFIG=kubeconfig
          export STAGING_URL=$(kubectl get service enhanced-ai-cli-service --namespace=staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # Health check
          curl -f http://$STAGING_URL/health || exit 1
          
          # Basic functionality test
          curl -f http://$STAGING_URL/api/v1/models || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Pre-deployment checks
        run: |
          export KUBECONFIG=kubeconfig
          
          # Check cluster health
          kubectl get nodes
          kubectl get pods --all-namespaces | grep -v Running | grep -v Completed || true
          
          # Check current deployment
          kubectl get deployment enhanced-ai-cli --namespace=production

      - name: Deploy to production
        run: |
          export KUBECONFIG=kubeconfig
          export IMAGE_TAG=${{ needs.build-and-push.outputs.image-digest }}
          
          # Blue-green deployment strategy
          kubectl patch deployment enhanced-ai-cli \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"enhanced-ai-cli","image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}"}]}}}}' \
            --namespace=production
          
          # Wait for rollout
          kubectl rollout status deployment/enhanced-ai-cli --namespace=production --timeout=600s

      - name: Production smoke tests
        run: |
          export KUBECONFIG=kubeconfig
          export PROD_URL=$(kubectl get service enhanced-ai-cli-service --namespace=production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # Health checks
          for i in {1..5}; do
            curl -f http://$PROD_URL/health && break
            sleep 10
          done
          
          # API availability
          curl -f http://$PROD_URL/api/v1/models
          
          # Performance check
          response_time=$(curl -o /dev/null -s -w '%{time_total}' http://$PROD_URL/health)
          if (( $(echo "$response_time > 2.0" | bc -l) )); then
            echo "Response time too high: $response_time seconds"
            exit 1
          fi

      - name: Update monitoring
        run: |
          # Update monitoring dashboards with new version
          curl -X POST "${{ secrets.GRAFANA_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "dashboardId": "enhanced-ai-cli",
              "version": "${{ github.ref_name }}",
              "deployment": "production",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }'

  security-scan-image:
    name: Scan Container Image
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && needs.deploy-production.result == 'success'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Enhanced AI CLI ${{ github.ref }}
          body: |
            ## 🚀 Enhanced AI CLI ${{ github.ref }}
            
            This release includes:
            - 🤖 32+ AI models with intelligent selection
            - 📋 Advanced rules engine with auto-discovery
            - ⚡ Smart task automation and file watchers
            - 🔧 Native development tools integration
            - 🏢 Enterprise security and compliance features
            
            ### Deployment Information
            - **Container Image**: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}`
            - **Staging Deployed**: ✅
            - **Production Deployed**: ✅
            
            ### Security
            - Container image scanned with Trivy
            - SAST analysis completed
            - Security audit passed
            
            See [CHANGELOG.md](./CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: false