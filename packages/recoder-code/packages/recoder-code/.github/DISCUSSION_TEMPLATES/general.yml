labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💬 General Discussion
        
        Welcome to the Recoder Code community discussions! This is a place for:
        
        - 🤔 **Questions** about using Recoder Code
        - 💡 **Ideas** and suggestions for improvements
        - 📣 **Announcements** from the community
        - 🎯 **Best practices** and tips sharing
        - 🔗 **Showcases** of what you've built
        
        Please be respectful and follow our [Code of Conduct](../../CODE_OF_CONDUCT.md).

  - type: textarea
    id: discussion-content
    attributes:
      label: What would you like to discuss?
      description: Share your thoughts, questions, or ideas with the community
      placeholder: |
        Share your question, idea, or experience here...
        
        Feel free to include:
        - Code examples
        - Screenshots
        - Links to relevant resources
        - Specific use cases
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Discussion Category
      description: What type of discussion is this?
      options:
        - Question - Need help with something
        - Idea - Suggesting an improvement or feature
        - Showcase - Sharing what I've built
        - Best Practice - Tips and techniques
        - Announcement - Community news
        - Other
    validations:
      required: true

  - type: checkboxes
    id: topics
    attributes:
      label: Related Topics (optional)
      options:
        - label: AI Model Usage
        - label: Code Generation
        - label: Interactive Mode
        - label: Configuration
        - label: Performance
        - label: Integration (Git, Docker, etc.)
        - label: Automation and Rules
        - label: API Usage
        - label: Troubleshooting