name: Recoder Code - CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'

jobs:
  # Security and Quality Gates
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --audit-level moderate

      - name: Run security audit
        run: |
          npm audit --audit-level moderate
          node scripts/security-audit.js || true

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  code-quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run code formatting check
        run: npm run format -- --check

      - name: Run package optimization check
        run: node scripts/optimize-package.js

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  testing:
    name: 🧪 Testing Suite
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    strategy:
      matrix:
        node-version: [18, 20, 21]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_TEST }}

      - name: Run performance benchmarks
        run: node scripts/performance-benchmark.js

      - name: Generate test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  # Build Services
  build-cli:
    name: 🏗️ Build CLI Application
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, testing]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production

      - name: Build application
        run: npm run build

      - name: Generate version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_REF#refs/heads/}-${GITHUB_SHA::8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            COMMIT_SHA=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cli-${{ steps.version.outputs.version }}
          path: sbom.spdx.json

  build-ml-training:
    name: 🧠 Build ML Training Service
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/ml-training
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ML Training image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./ml-training-service
          file: ./ml-training-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-plugin-registry:
    name: 📦 Build Plugin Registry Service
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, testing]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/plugin-registry
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Plugin Registry image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./plugin-registry-service
          file: ./plugin-registry-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-collaboration:
    name: 🤝 Build Collaboration Service
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, testing]
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/collaboration
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Collaboration image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./collaboration-service
          file: ./collaboration-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Container Security Scanning
  container-scan:
    name: 🔍 Container Security Scan
    runs-on: ubuntu-latest
    needs: [build-cli, build-ml-training, build-plugin-registry, build-collaboration]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk Container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          args: --severity-threshold=high

  # Staging Deployment
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-cli, build-ml-training, build-plugin-registry, build-collaboration, container-scan]
    if: |
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/develop' || 
       github.event.inputs.deploy_environment == 'staging') &&
      github.event_name != 'pull_request'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to staging
        uses: azure/k8s-deploy@v1
        with:
          namespace: staging
          manifests: |
            kubernetes/staging/
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/enhanced-ai-cli -n staging --timeout=600s

      - name: Run staging smoke tests
        run: |
          # Get service endpoint
          STAGING_URL=$(kubectl get service enhanced-ai-cli-service -n staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -z "$STAGING_URL" ]; then
            STAGING_URL=$(kubectl get service enhanced-ai-cli-service -n staging -o jsonpath='{.spec.clusterIP}')
            kubectl port-forward service/enhanced-ai-cli-service 8080:80 -n staging &
            STAGING_URL="localhost:8080"
            sleep 10
          fi
          
          # Health check
          curl -f "http://$STAGING_URL/health" || exit 1
          
          # API availability
          curl -f "http://$STAGING_URL/api/v1/models" || exit 1
          
          # Performance check
          response_time=$(curl -o /dev/null -s -w '%{time_total}' "http://$STAGING_URL/health")
          if (( $(echo "$response_time > 5.0" | bc -l) )); then
            echo "Response time too high: $response_time seconds"
            exit 1
          fi

      - name: Update staging status
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            Staging Deployment: ${{ job.status }}
            Version: ${{ needs.build.outputs.version }}
            Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Production Deployment
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-cli, build-ml-training, build-plugin-registry, build-collaboration, container-scan, deploy-staging]
    if: |
      (startsWith(github.ref, 'refs/tags/v') || 
       github.event.inputs.deploy_environment == 'production') &&
      github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Pre-deployment verification
        run: |
          # Verify cluster health
          kubectl get nodes
          kubectl get pods --all-namespaces --field-selector=status.phase!=Running,status.phase!=Succeeded
          
          # Check current deployment
          kubectl get deployment recoder-code -n production || true

      - name: Deploy to production
        uses: azure/k8s-deploy@v1
        with:
          namespace: production
          manifests: |
            kubernetes/production/
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          strategy: blue-green
          traffic-split-method: pod
          percentage: 20
          baseline-and-canary-replicas: 1

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/recoder-code -n production --timeout=900s

      - name: Production smoke tests
        run: |
          # Get service endpoint
          PROD_URL=$(kubectl get service recoder-code-service -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -z "$PROD_URL" ]; then
            PROD_URL=$(kubectl get service recoder-code-service -n production -o jsonpath='{.spec.clusterIP}')
            kubectl port-forward service/recoder-code-service 8080:80 -n production &
            PROD_URL="localhost:8080"
            sleep 10
          fi
          
          # Extended health checks
          for i in {1..10}; do
            if curl -f "http://$PROD_URL/health"; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Health check failed after 10 attempts"
              exit 1
            fi
            sleep 15
          done
          
          # API functionality
          curl -f "http://$PROD_URL/api/v1/models"
          
          # Load test
          for i in {1..50}; do
            curl -s "http://$PROD_URL/health" > /dev/null &
          done
          wait
          
          # Performance verification
          response_time=$(curl -o /dev/null -s -w '%{time_total}' "http://$PROD_URL/health")
          if (( $(echo "$response_time > 3.0" | bc -l) )); then
            echo "Production response time too high: $response_time seconds"
            exit 1
          fi

      - name: Promote to full production traffic
        run: |
          kubectl patch service recoder-code-service -n production -p '{"spec":{"selector":{"version":"${{ needs.build-cli.outputs.version }}"}}}'

      - name: Update monitoring and alerting
        run: |
          # Update Prometheus targets
          curl -X POST "${{ secrets.PROMETHEUS_RELOAD_URL }}" || true
          
          # Update Grafana annotations
          curl -X POST "${{ secrets.GRAFANA_ANNOTATION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "Production deployment: ${{ needs.build.outputs.version }}",
              "tags": ["deployment", "production"],
              "time": '${{ github.event.head_commit.timestamp }}',
              "timeEnd": '$(date +%s000)'
            }' || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Recoder Code ${{ github.ref }}
          body: |
            ## 🚀 Recoder Code ${{ github.ref }}
            
            ### 🎯 Key Features
            - 🤖 32+ AI models with intelligent selection
            - 📋 Advanced rules engine with auto-discovery
            - ⚡ Smart task automation and file watchers
            - 🔧 Native development tools integration
            - 🏢 Enterprise security and compliance
            
            ### 📦 Deployment Information
            - **Container Image**: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}`
            - **Staging**: ✅ Deployed and tested
            - **Production**: ✅ Deployed successfully
            - **Security Scan**: ✅ Passed
            
            ### 🔒 Security
            - Container scanned with Trivy and Snyk
            - SAST analysis completed with CodeQL
            - Dependency vulnerabilities checked
            - SBOM generated and attached
            
            ### 🚀 Getting Started
            ```bash
            npm install -g recoder-code
            recoder-code --setup
            ```
            
            See [CHANGELOG.md](./CHANGELOG.md) for detailed changes.
            See [DEPLOYMENT_GUIDE.md](./DEPLOYMENT_GUIDE.md) for deployment instructions.
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # Notification and Cleanup
  notify:
    name: 📢 Notify & Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify deployment status
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            🚀 Recoder Code Deployment Complete!
            
            📊 **Deployment Summary:**
            - **Version**: ${{ needs.build.outputs.version }}
            - **Staging**: ${{ needs.deploy-staging.result }}
            - **Production**: ${{ needs.deploy-production.result }}
            - **Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
            
            🔗 **Links:**
            - Production: https://recoder.xyz
            - Monitoring: https://monitoring.recoder.xyz
            - Documentation: https://docs.recoder.xyz
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Update status page
        run: |
          curl -X POST "${{ secrets.STATUS_PAGE_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "component": "recoder-code",
              "status": "operational",
              "version": "${{ needs.build.outputs.version }}",
              "deployment_time": "${{ github.event.head_commit.timestamp }}"
            }' || true

      - name: Cleanup old images
        run: |
          # Keep last 10 images, delete older ones
          curl -X DELETE "${{ env.REGISTRY }}/v2/${{ env.IMAGE_NAME }}/manifests/old-digest" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" || true