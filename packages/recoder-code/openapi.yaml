openapi: 3.0.0
info:
  title: Recoder API
  description: API documentation for Recoder
  version: 1.0.0
servers:
  - url: https://api.recoder.xyz
    description: Production server
  - url: https://engine.recoder.xyz
    description: Engine server
paths:
  /chat/completions:
    post:
      summary: Create a chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: The model to use for the completion.
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                      content:
                        type: string
                        description: The content of the message.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              enum: [system, user, assistant]
                            content:
                              type: string
                              description: The content of the message.
        '400':
          description: Bad request
        '500':
          description: Internal server error