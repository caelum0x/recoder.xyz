version: '3.8'

services:
  recoder-backend:
    build: .
    ports:
      - "3100:3100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3100
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,https://recoder.xyz,https://agents.recoder.xyz,https://frontend.recoder.xyz,https://pm.recoder.xyz,https://agency.recoder.xyz,https://studio.recoder.xyz,https://openclaw.recoder.xyz,https://api.recoder.xyz,https://backend.recoder.xyz
    restart: unless-stopped

  # Build the base image first
  recoder-base:
    build: ./docker
    image: recoder-universal:latest
