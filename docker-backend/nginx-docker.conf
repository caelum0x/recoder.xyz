# Nginx config for docker.recoder.xyz
# Add this to your nginx sites-available or include in main config

upstream docker_backend {
    server 127.0.0.1:3100;
    keepalive 64;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=docker_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=docker_conn:10m;

server {
    listen 80;
    server_name docker.recoder.xyz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docker.recoder.xyz;

    # SSL - update paths to your certs
    ssl_certificate /etc/letsencrypt/live/docker.recoder.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docker.recoder.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "ALLOWALL" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Connection limits
    limit_conn docker_conn 20;

    # API endpoints
    location /api/ {
        limit_req zone=docker_api burst=50 nodelay;
        
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket terminal
    location /terminal/ {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Preview proxy
    location /preview/ {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Allow iframes
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
    }

    # Health check
    location /health {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
    }
}
