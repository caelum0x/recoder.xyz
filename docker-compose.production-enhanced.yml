# Enhanced Production Docker Compose Configuration for Recoder.xyz
# Complete production-ready setup with SSL, monitoring, auto-scaling, and security

version: '3.8'

networks:
  recoder-network:
    driver: bridge
    name: recoder-network
    ipam:
      config:
        - subnet: 172.22.0.0/16

volumes:
  postgres-data:
    driver: local
    name: recoder-postgres-prod
  postgres-backup:
    driver: local
    name: recoder-postgres-backup
  redis-data:
    driver: local
    name: recoder-redis-prod
  nginx-certs:
    driver: local
    name: recoder-ssl-certs
  grafana-data:
    driver: local
    name: recoder-grafana-data
  prometheus-data:
    driver: local
    name: recoder-prometheus-data
  loki-data:
    driver: local
    name: recoder-loki-data

services:
  #====================================
  # Database Layer
  #====================================
  postgres:
    image: postgres:15-alpine
    container_name: recoder-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-recoder_production}
      POSTGRES_USER: ${DB_USER:-recoder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      # Performance tuning
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_MAINTENANCE_WORK_MEM: "64MB"
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: "0.9"
      POSTGRES_WAL_BUFFERS: "16MB"
      POSTGRES_DEFAULT_STATISTICS_TARGET: "100"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup:/backups
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - recoder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recoder} -d ${DB_NAME:-recoder_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s

  redis:
    image: redis:7-alpine
    container_name: recoder-redis-prod
    restart: always
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:?Redis password required}
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru 
      --appendonly yes 
      --appendfsync everysec
      --save 900 1 
      --save 300 10 
      --save 60 10000
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - recoder-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  #====================================
  # Application Layer
  #====================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: recoder-backend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-recoder}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-recoder_production}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT secret required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT refresh secret required}
      # AI Provider Keys (prioritized)
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:?Together AI key required for FREE models}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # OAuth Providers
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Payment Processing
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Security & Performance
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Encryption key required}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
      - LOG_LEVEL=info
      - CORS_ORIGIN=${WEB_URL:-https://recoder.xyz}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
      - /tmp:/tmp
    ports:
      - "3001:3001"
    networks:
      - recoder-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  production-engine:
    build:
      context: ./production-engine
      dockerfile: Dockerfile
      target: production
    container_name: recoder-production-engine
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3002
      - BACKEND_URL=http://backend:3001
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LOG_LEVEL=info
    volumes:
      - ./production-engine/generated:/app/generated
      - ./production-engine/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3002:3002"
    networks:
      - recoder-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  web:
    build:
      context: ./recoder-web
      dockerfile: Dockerfile
      target: production
    container_name: recoder-web-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${API_URL:-https://api.recoder.xyz}
      - NEXT_PUBLIC_WEB_URL=${WEB_URL:-https://recoder.xyz}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - NEXTAUTH_URL=${WEB_URL:-https://recoder.xyz}
      - NEXTAUTH_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-recoder}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-recoder_production}
    ports:
      - "3000:3000"
    networks:
      - recoder-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  chat:
    build:
      context: ./recoder-chat
      dockerfile: Dockerfile
      target: production
    container_name: recoder-chat-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${API_URL:-https://api.recoder.xyz}
      - NEXTAUTH_URL=${CHAT_URL:-https://chat.recoder.xyz}
      - NEXTAUTH_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-recoder}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-recoder_production}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
    ports:
      - "3003:3000"
    networks:
      - recoder-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  #====================================
  # Reverse Proxy & SSL Termination
  #====================================
  nginx:
    image: nginx:alpine
    container_name: recoder-nginx-prod
    restart: always
    volumes:
      - ./nginx/nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/nginx/ssl
      - ./nginx/html:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - recoder-network
    depends_on:
      - web
      - chat
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  certbot:
    image: certbot/certbot
    container_name: recoder-certbot
    volumes:
      - nginx-certs:/etc/letsencrypt
      - ./nginx/html:/var/www/html
    command: >
      sh -c "
        certbot certonly --webroot -w /var/www/html 
        --email ${ACME_EMAIL:?Email required for SSL} 
        --agree-tos --no-eff-email 
        -d ${DOMAIN:-recoder.xyz} 
        -d www.${DOMAIN:-recoder.xyz} 
        -d api.${DOMAIN:-recoder.xyz} 
        -d chat.${DOMAIN:-recoder.xyz} 
        --non-interactive || true;
        trap exit TERM; while :; do sleep 12h & wait; done;
      "
    depends_on:
      - nginx

  #====================================
  # Local AI (Ollama)
  #====================================
  ollama:
    image: ollama/ollama:latest
    container_name: recoder-ollama-prod
    restart: always
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - recoder-network
    # Download models on startup
    command: >
      sh -c "
        ollama serve &
        sleep 10 &&
        ollama pull llama3.1:8b &&
        ollama pull codellama:7b &&
        ollama pull mistral:7b &&
        wait
      "
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'

  #====================================
  # Monitoring Stack
  #====================================
  prometheus:
    image: prom/prometheus:latest
    container_name: recoder-prometheus-prod
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus-production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - recoder-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:latest
    container_name: recoder-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Grafana password required}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SERVER_DOMAIN=${MONITOR_DOMAIN:-monitor.recoder.xyz}
      - GF_SERVER_ROOT_URL=https://${MONITOR_DOMAIN:-monitor.recoder.xyz}/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3004:3000"
    networks:
      - recoder-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  loki:
    image: grafana/loki:latest
    container_name: recoder-loki-prod
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-production.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - recoder-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  promtail:
    image: grafana/promtail:latest
    container_name: recoder-promtail-prod
    restart: always
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail-production.yml:/etc/promtail/config.yml:ro
    networks:
      - recoder-network
    depends_on:
      - loki

  #====================================
  # Backup Services
  #====================================
  db-backup:
    image: postgres:15-alpine
    container_name: recoder-db-backup
    restart: "no"
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-backup:/backups
    networks:
      - recoder-network
    depends_on:
      - postgres
    command: >
      sh -c "
        while true; do
          pg_dump -h postgres -U ${DB_USER:-recoder} -d ${DB_NAME:-recoder_production} | gzip > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql.gz;
          find /backups -name '*.sql.gz' -mtime +7 -delete;
          sleep 86400;
        done
      "
    profiles:
      - backup

  #====================================
  # Health Check Service
  #====================================
  healthcheck:
    image: curlimages/curl:latest
    container_name: recoder-healthcheck
    restart: always
    networks:
      - recoder-network
    depends_on:
      - web
      - chat
      - backend
    command: >
      sh -c "
        while true; do
          echo 'Running health checks...';
          curl -f http://web:3000/api/health || echo 'Web health check failed';
          curl -f http://chat:3000/api/health || echo 'Chat health check failed';
          curl -f http://backend:3001/api/health || echo 'Backend health check failed';
          curl -f http://production-engine:3002/health || echo 'Production engine health check failed';
          sleep 60;
        done
      "
    profiles:
      - monitoring

#====================================
# Production Environment Notes
#====================================

# Required Environment Variables:
# Core:
# - DB_PASSWORD
# - REDIS_PASSWORD  
# - JWT_SECRET
# - JWT_REFRESH_SECRET
# - ENCRYPTION_KEY
# - TOGETHER_API_KEY (FREE AI - Primary)
#
# Optional:
# - GROQ_API_KEY
# - GOOGLE_API_KEY
# - ANTHROPIC_API_KEY
# - OPENAI_API_KEY
# - STRIPE_SECRET_KEY
# - STRIPE_PUBLISHABLE_KEY
# - ACME_EMAIL (for SSL)
# - DOMAIN (default: recoder.xyz)
# - GRAFANA_PASSWORD
#
# URLs:
# - WEB_URL (default: https://recoder.xyz)
# - API_URL (default: https://api.recoder.xyz)
# - CHAT_URL (default: https://chat.recoder.xyz)

# Usage:
# Production: docker-compose -f docker-compose.production-enhanced.yml up -d
# With monitoring: docker-compose -f docker-compose.production-enhanced.yml --profile monitoring up -d
# With backups: docker-compose -f docker-compose.production-enhanced.yml --profile backup up -d
# Full deployment: docker-compose -f docker-compose.production-enhanced.yml --profile monitoring --profile backup up -d