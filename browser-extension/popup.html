<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recoder Local AI</title>
  <style>
    body {
      width: 320px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      color: #333;
      background: #f8fafc;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #6b7280;
    }

    .status-card {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #e5e7eb;
    }

    .status-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-icon.connected {
      background-color: #10b981;
    }

    .status-icon.disconnected {
      background-color: #ef4444;
    }

    .status-title {
      font-weight: 500;
      color: #1f2937;
    }

    .provider-list {
      margin-left: 24px;
    }

    .provider-item {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .provider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .provider-dot.available {
      background-color: #10b981;
    }

    .provider-dot.unavailable {
      background-color: #d1d5db;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.8;
    }

    .btn-primary {
      background-color: #3b82f6;
      color: white;
    }

    .btn-secondary {
      background-color: #f3f4f6;
      color: #374151;
    }

    .setup-guide {
      background: #eff6ff;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    .setup-title {
      font-weight: 500;
      color: #1e40af;
      margin-bottom: 8px;
    }

    .setup-steps {
      font-size: 12px;
      color: #1e40af;
      line-height: 1.5;
    }

    .setup-steps ol {
      margin: 0;
      padding-left: 16px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e5e7eb;
      border-top: 2px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success-message {
      background: #d1fae5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .error-message {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🚀 Recoder Local AI</div>
    <div class="subtitle">Connect to your local AI models</div>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Checking local AI status...</div>
  </div>

  <div id="content" style="display: none;">
    <div class="status-card">
      <div class="status-header">
        <div id="status-icon" class="status-icon"></div>
        <div class="status-title">Local AI Status</div>
      </div>
      <div class="provider-list">
        <div class="provider-item">
          <div id="ollama-dot" class="provider-dot"></div>
          <span>Ollama (localhost:11434)</span>
        </div>
        <div class="provider-item">
          <div id="lmstudio-dot" class="provider-dot"></div>
          <span>LM Studio (localhost:1234)</span>
        </div>
      </div>
    </div>

    <div id="success-message" class="success-message" style="display: none;"></div>
    <div id="error-message" class="error-message" style="display: none;"></div>

    <div class="actions">
      <button id="test-btn" class="btn btn-primary">Test Connection</button>
      <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
    </div>

    <div id="setup-guide" class="setup-guide" style="display: none;">
      <div class="setup-title">🆓 Quick Setup</div>
      <div class="setup-steps">
        <ol>
          <li>Install <a href="https://ollama.ai" target="_blank">Ollama</a></li>
          <li>Run: <code>ollama pull qwen2.5-coder:7b</code></li>
          <li>Start: <code>ollama serve</code></li>
          <li>Visit <a href="https://recoder.xyz/chat" target="_blank">recoder.xyz/chat</a></li>
        </ol>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
