services:
  - type: web
    name: recoder-web
    env: node
    plan: free
    rootDir: recoder-web
    buildCommand: pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        value: https://web.recoder.xyz
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://api.recoder.xyz
      - key: NEXT_PUBLIC_ENGINE_URL
        value: https://engine.recoder.xyz
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PRISMA_CLI_QUERY_ENGINE_TYPE
        value: binary
    domains:
      - web.recoder.xyz
