version: '3.8'

services:
  # Backend API Server
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecraft-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/codecraft
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    networks:
      - codecraft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production Engine
  production-engine:
    build:
      context: ./production-engine
      dockerfile: Dockerfile
    container_name: codecraft-production-engine
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    volumes:
      - ./production-engine/src:/app/src
      - ./production-engine/generated:/app/generated
    networks:
      - codecraft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codecraft-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=codecraft
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - codecraft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codecraft"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codecraft-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis-password
    volumes:
      - redis_data:/data
    networks:
      - codecraft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web Dashboard (Optional)
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: codecraft-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    depends_on:
      - backend
    networks:
      - codecraft-network
    restart: unless-stopped
    profiles:
      - web

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: codecraft-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - production-engine
    networks:
      - codecraft-network
    restart: unless-stopped
    profiles:
      - production

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: codecraft-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - codecraft-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: codecraft-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - codecraft-network
    restart: unless-stopped
    profiles:
      - monitoring

  # IPFS Node for NFT/Blockchain examples
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: codecraft-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - codecraft-network
    restart: unless-stopped
    profiles:
      - blockchain

  # Solana Test Validator (for blockchain examples)
  solana-validator:
    image: solanalabs/solana:stable
    container_name: codecraft-solana-validator
    ports:
      - "8899:8899"
      - "8900:8900"
    command: >
      bash -c "
        solana-test-validator 
        --rpc-port 8899 
        --rpc-bind-address 0.0.0.0 
        --log 
        --reset
      "
    volumes:
      - solana_data:/root/.local/share/solana
    networks:
      - codecraft-network
    restart: unless-stopped
    profiles:
      - blockchain

  # Local SMTP server for testing emails
  mailhog:
    image: mailhog/mailhog:latest
    container_name: codecraft-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - codecraft-network
    restart: unless-stopped
    profiles:
      - development

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ipfs_data:
    driver: local
  solana_data:
    driver: local

networks:
  codecraft-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16