# Recoder.xyz Production Docker Compose Configuration
# Enterprise-grade multi-service orchestration
version: '3.8'

services:
  # PostgreSQL Database - Primary data store
  postgres:
    image: postgres:15-alpine
    container_name: recoder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recoder_prod}
      POSTGRES_USER: ${POSTGRES_USER:-recoder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backups:/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - recoder-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoder} -d ${POSTGRES_DB:-recoder_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: recoder-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - recoder-backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Recoder Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=production
    container_name: recoder-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-recoder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recoder_prod}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASS=${EMAIL_SMTP_PASS}
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - FILE_UPLOAD_MAX_SIZE=${FILE_UPLOAD_MAX_SIZE:-10485760}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
      - backend_cache:/app/cache
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - recoder-backend
      - recoder-frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Production Engine
  production-engine:
    build:
      context: ./production-engine
      dockerfile: Dockerfile
    container_name: codecraft-production-engine
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    volumes:
      - ./production-engine/src:/app/src
      - ./production-engine/generated:/app/generated
    networks:
      - recoder-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # Web Dashboard (Optional)
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: codecraft-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    depends_on:
      - backend
    networks:
      - recoder-backend
    restart: unless-stopped
    profiles:
      - web


  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: codecraft-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - recoder-backend
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: codecraft-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - recoder-backend
    restart: unless-stopped
    profiles:
      - monitoring

  # IPFS Node for NFT/Blockchain examples
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: codecraft-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - recoder-backend
    restart: unless-stopped
    profiles:
      - blockchain

  # Solana Test Validator (for blockchain examples)
  solana-validator:
    image: solanalabs/solana:stable
    container_name: codecraft-solana-validator
    ports:
      - "8899:8899"
      - "8900:8900"
    command: >
      bash -c "
        solana-test-validator 
        --rpc-port 8899 
        --rpc-bind-address 0.0.0.0 
        --log 
        --reset
      "
    volumes:
      - solana_data:/root/.local/share/solana
    networks:
      - recoder-backend
    restart: unless-stopped
    profiles:
      - blockchain

  # Local SMTP server for testing emails
  mailhog:
    image: mailhog/mailhog:latest
    container_name: codecraft-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - recoder-backend
    restart: unless-stopped
    profiles:
      - development

  # Nginx - Reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: recoder-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - recoder-frontend
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

# Networks
networks:
  recoder-backend:
    driver: bridge
    name: recoder-backend
    ipam:
      config:
        - subnet: 172.20.0.0/16
  recoder-frontend:
    driver: bridge
    name: recoder-frontend
    ipam:
      config:
        - subnet: 172.21.0.0/16

# Persistent volumes
volumes:
  postgres_data:
    driver: local
    name: recoder-postgres-data
  redis_data:
    driver: local
    name: recoder-redis-data
  backend_cache:
    driver: local
    name: recoder-backend-cache
  nginx_cache:
    driver: local
    name: recoder-nginx-cache
  nginx_logs:
    driver: local
    name: recoder-nginx-logs
  prometheus_data:
    driver: local
    name: recoder-prometheus-data
  grafana_data:
    driver: local
    name: recoder-grafana-data
  ipfs_data:
    driver: local
    name: recoder-ipfs-data
  solana_data:
    driver: local
    name: recoder-solana-data