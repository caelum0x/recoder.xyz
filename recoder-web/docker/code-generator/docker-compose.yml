version: '3.8'

services:
  # JavaScript/TypeScript Container
  code-generator-javascript:
    build: 
      context: ./javascript
      dockerfile: Dockerfile
    container_name: recoder-javascript
    volumes:
      - javascript_workspace:/workspace
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - code-execution
    mem_limit: 512m
    cpus: 0.5

  # Python Container
  code-generator-python:
    build: 
      context: ./python
      dockerfile: Dockerfile
    container_name: recoder-python
    volumes:
      - python_workspace:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - code-execution
    mem_limit: 512m
    cpus: 0.5

  # Rust Container
  code-generator-rust:
    build: 
      context: ./rust
      dockerfile: Dockerfile
    container_name: recoder-rust
    volumes:
      - rust_workspace:/workspace
      - rust_cache:/usr/local/cargo
    environment:
      - RUST_BACKTRACE=1
      - CARGO_NET_RETRY=3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - code-execution
    mem_limit: 1024m
    cpus: 1.0

  # Go Container
  code-generator-go:
    build: 
      context: ./go
      dockerfile: Dockerfile
    container_name: recoder-go
    volumes:
      - go_workspace:/workspace
      - go_cache:/go/pkg
    environment:
      - GO111MODULE=on
      - GOPROXY=https://proxy.golang.org,direct
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - code-execution
    mem_limit: 1024m
    cpus: 1.0

  # C++ Container
  code-generator-cpp:
    build: 
      context: ./cpp
      dockerfile: Dockerfile
    container_name: recoder-cpp
    volumes:
      - cpp_workspace:/workspace
    environment:
      - CXX=g++
      - CC=gcc
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - code-execution
    mem_limit: 1024m
    cpus: 1.0

  # Java Container
  code-generator-java:
    build: 
      context: ./java
      dockerfile: Dockerfile
    container_name: recoder-java
    volumes:
      - java_workspace:/workspace
    environment:
      - JAVA_HOME=/usr/local/openjdk-21
      - MAVEN_OPTS=-Xmx512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      - code-execution
    mem_limit: 1024m
    cpus: 1.0

volumes:
  javascript_workspace:
    driver: local
  python_workspace:
    driver: local
  rust_workspace:
    driver: local
  go_workspace:
    driver: local
  cpp_workspace:
    driver: local
  java_workspace:
    driver: local
  rust_cache:
    driver: local
  go_cache:
    driver: local

networks:
  code-execution:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
