[project]
name = "recoder-billing"
version = "0.1.0"
description = "Recoder Distribution billing & entitlement engine — the fused Polar monetization spine, owned and edited as first-party Recoder code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Recoder" }]

# Runtime dependencies for the FUSED SPINE only. The full money/order/payout/stripe
# fusion (FastAPI + asyncpg + SQLAlchemy + dramatiq) is a follow-up and will add
# those deps when those modules land. The pure spine fused here needs PyJWT for the
# device-flow / signed-token primitives.
dependencies = [
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
# The runtime API surface (ipc/internal_api FastAPI app, Postgres) lands with the
# larger fusion. Declared here so the dependency contract is explicit, not implied.
api = [
    "fastapi>=0.110.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoder_billing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (no DB / no network)",
    "integration: tests requiring DB or network",
]

[tool.ruff]
target-version = "py311"
line-length = 88
