name: recoder-local-agents

services:
  agent-gateway:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm agent-os:gateway"
    volumes:
      - ../..:/workspace
    environment:
      AGENT_GATEWAY_PORT: "4317"
      RECODER_A2A_REQUIRE_SIGNATURE: "false"
    ports:
      - "4317:4317"

  agent-worker:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm agent-os:worker"
    volumes:
      - ../..:/workspace
    environment:
      AGENT_WORKER_MODE: local
