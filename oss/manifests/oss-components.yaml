components:
  - id: beads
    name: Beads
    kind: issue-graph
    contract: TaskGraph
    owner: agent-os
    source:
      path: .beads
      license: unknown
    healthCheck:
      command: pnpm beads:task:status
    patchPolicy: local_patch

  - id: git-nexus
    name: Git Nexus
    kind: code-intelligence
    contract: RepoContextProvider
    owner: agent-os
    source:
      path: packages/git-nexus
      license: MIT
    healthCheck:
      command: pnpm --filter @recoder/git-nexus build
    patchPolicy: local_patch

  - id: pal
    name: PAL
    kind: planner
    contract: PALPlanner
    owner: agent-os
    source:
      path: packages/pal
      license: MIT
    healthCheck:
      command: pnpm --filter @recoder/pal build
    patchPolicy: local_patch

  - id: mcp
    name: Recoder MCP
    kind: protocol
    contract: McpServer
    owner: agent-os
    source:
      path: packages/agent-mcp
      license: MIT
    healthCheck:
      command: pnpm mcp:smoke
    patchPolicy: local_patch

  - id: a2a
    name: Recoder A2A
    kind: protocol
    contract: RuntimeAdapter
    owner: agent-os
    source:
      path: packages/a2a-sdk
      license: MIT
    healthCheck:
      command: pnpm a2a:smoke
    patchPolicy: local_patch

  - id: claude-code
    name: Claude Code
    kind: runtime
    contract: RuntimeAdapter
    owner: agent-os
    source:
      path: .claude
      license: proprietary
    healthCheck:
      command: pnpm runtime:claude:health
    patchPolicy: none

  - id: codex
    name: Codex
    kind: runtime
    contract: RuntimeAdapter
    owner: agent-os
    source:
      path: mcp/recoder-codex-adapter.js
      license: proprietary
    healthCheck:
      command: pnpm runtime:codex:health
    patchPolicy: local_patch

  - id: recoder-code
    name: Recoder Code
    kind: runtime
    contract: RuntimeAdapter
    owner: agent-os
    source:
      path: homebrew-recoder
      license: proprietary
    healthCheck:
      command: pnpm runtime-adapter:verify
    patchPolicy: local_patch

  - id: playwright-mcp
    name: Playwright MCP
    kind: browser
    contract: McpServer
    owner: agent-os
    source:
      path: .playwright-mcp
      license: unknown
    healthCheck:
      command: pnpm browser:smoke
    patchPolicy: local_patch

  - id: daytona
    name: Daytona
    kind: sandbox
    contract: SandboxProvider
    owner: runtime
    source:
      path: daytona-projects/daytona
      license: unknown
    healthCheck:
      command: pnpm sandbox:daytona:health
    patchPolicy: local_patch

  - id: e2b
    name: E2B
    kind: sandbox
    contract: SandboxProvider
    owner: runtime
    source:
      path: daytona-projects/e2b-upstream
      license: unknown
    healthCheck:
      command: pnpm sandbox:e2b:health
    patchPolicy: none

  - id: mem0
    name: mem0
    kind: memory
    contract: MemoryStore
    owner: agent-os
    source:
      path: daytona-projects/mem0-upstream
      license: unknown
    healthCheck:
      command: pnpm memory:health
    patchPolicy: none

  - id: openziti-zrok
    name: OpenZiti / zrok
    kind: network
    contract: NetworkProvider
    owner: infra
    source:
      path: infra/openziti
      license: unknown
    healthCheck:
      command: pnpm network:health
    patchPolicy: local_patch

  - id: observability
    name: Recoder Observability Stack
    kind: observability
    contract: TelemetryBackend
    owner: infra
    source:
      path: infra/observability
      license: mixed
    healthCheck:
      command: pnpm observability:health
    patchPolicy: local_patch
