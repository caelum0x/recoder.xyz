patchPolicies:
  none:
    requiresReview: false
    description: Use upstream as a capability provider without local source modification.
  local_patch:
    requiresReview: true
    description: Local integration code may patch behavior, but Recoder still owns canonical state.
  vendored:
    requiresReview: true
    description: Vendored source must declare upstream version, pinned SHA, license, and update procedure.
  forked:
    requiresReview: true
    description: Forked source must declare owner, divergence reason, rebase cadence, and security review path.

rules:
  - componentPattern: "*"
    requirement: Components cannot own TaskSpec, RunEvent, Approval, Artifact, or MemoryCandidate state unless they are Recoder Agent OS packages.
  - componentPattern: "runtime"
    requirement: Runtime components must report truthful health and emit artifacts/events rather than fake success.
  - componentPattern: "sandbox"
    requirement: Sandbox providers are execution substrates only; they do not own workspace identity or approvals.
