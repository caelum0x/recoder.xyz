packages:
  # Backend services
  - "production-engine"
  - "backend"
  
  # Web applications
  - "recoder-web"
  - "recoder-chat"
  - "app"
  
  # Deployment and scripts
  - "scripts"
  - "deployment"

# Exclude specific directories that shouldn't be treated as packages
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**" 
  - "**/build/**"
  - "**/coverage/**"
  - "**/.turbo/**"
  - "**/.nx/**"
  # Exclude all published packages (should be installed from npm)
  - "packages"
  - "packages-local-backup"
  # Exclude problematic platform apps for now
  - "recoder-chat-mobile"
  - "recoder-desktop"
  - "recoder-extension"
  - "browser-extension"
  - "browser-extension"