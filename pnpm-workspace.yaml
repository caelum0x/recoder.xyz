packages:
  # Core packages
  - "packages/*"
  
  # Platform applications  
  - "recoder-chat-mobile"
  - "recoder-desktop"
  - "recoder-extension"
  - "browser-extension"
  
  # Backend services
  - "production-engine"
  
  # Deployment and scripts
  - "scripts"
  - "deployment"

# Exclude specific directories that shouldn't be treated as packages
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**" 
  - "**/build/**"
  - "**/coverage/**"
  - "**/.turbo/**"
  - "**/.nx/**"