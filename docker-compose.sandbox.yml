version: '3.8'

services:
  sandbox-service:
    build:
      context: ./sandbox-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      # Mount Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: Mount for file system access
      - sandbox_storage:/app/storage
    environment:
      - NODE_ENV=production
      - DOCKER_HOST=unix:///var/run/docker.sock
      - MAX_CONCURRENT_EXECUTIONS=10
      - DEFAULT_TIMEOUT_MS=30000
      - DEFAULT_MEMORY_LIMIT=128MB
      - DEFAULT_CPU_LIMIT=50
    restart: unless-stopped
    networks:
      - sandbox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and session management (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sandbox-network
    restart: unless-stopped

networks:
  sandbox-network:
    driver: bridge

volumes:
  sandbox_storage:
    driver: local
  redis_data:
    driver: local
