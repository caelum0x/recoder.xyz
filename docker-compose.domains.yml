# DEPRECATED — DO NOT USE FOR PRODUCTION DEPLOYMENTS
#
# The actual production compose file is: docker-compose.deploy.yml
# This file is an earlier multi-domain template that references non-existent
# services and uses Traefik instead of the nginx reverse proxy deployed on Hetzner.
#
# Kept for reference only.

version: '3.8'

networks:
  recoder-network:
    driver: bridge

services:
  # Reverse Proxy & SSL
  traefik:
    image: traefik:v3.0
    container_name: recoder-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@recoder.xyz"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.recoder.xyz`)"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

  # Main Website - recoder.xyz
  main-web:
    build:
      context: ./app
      dockerfile: Dockerfile.production
    container_name: recoder-main-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.recoder.xyz
      - NEXT_PUBLIC_ENGINE_URL=https://engine.recoder.xyz
      - NEXT_PUBLIC_WEB_URL=https://app.recoder.xyz
      - NEXT_PUBLIC_CHAT_URL=https://chat.recoder.xyz
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.main.rule=Host(`recoder.xyz`) || Host(`www.recoder.xyz`)"
      - "traefik.http.routers.main.tls.certresolver=letsencrypt"
      - "traefik.http.services.main.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API - api.recoder.xyz
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: recoder-backend-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.recoder.xyz`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production Engine - engine.recoder.xyz
  production-engine:
    build:
      context: ./production-engine
      dockerfile: Dockerfile.production
    container_name: recoder-production-engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BACKEND_URL=https://api.recoder.xyz
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.engine.rule=Host(`engine.recoder.xyz`)"
      - "traefik.http.routers.engine.tls.certresolver=letsencrypt"
      - "traefik.http.services.engine.loadbalancer.server.port=3002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Recoder Web Platform - app.recoder.xyz
  recoder-web:
    build:
      context: ./recoder-web
      dockerfile: Dockerfile.production
    container_name: recoder-web-platform
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.recoder.xyz
      - NEXT_PUBLIC_ENGINE_URL=https://engine.recoder.xyz
      - NEXT_PUBLIC_CHAT_URL=https://chat.recoder.xyz
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.recoder.xyz`)"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Chat Platform - chat.recoder.xyz
  recoder-chat:
    build:
      context: ./recoder-chat
      dockerfile: Dockerfile.production
    container_name: recoder-chat-platform
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.recoder.xyz
      - NEXT_PUBLIC_ENGINE_URL=https://engine.recoder.xyz
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`chat.recoder.xyz`)"
      - "traefik.http.routers.chat.tls.certresolver=letsencrypt"
      - "traefik.http.services.chat.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: recoder-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-recoder}
      - POSTGRES_USER=${POSTGRES_USER:-recoder}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - recoder-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoder}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: recoder-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - recoder-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: recoder-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`metrics.recoder.xyz`)"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: recoder-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - recoder-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitoring.recoder.xyz`)"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  letsencrypt:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: