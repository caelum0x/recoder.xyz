# Recoder.xyz Production Docker Compose
# Complete production deployment with all services

version: '3.8'

networks:
  recoder-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nginx-certs:

services:
  #====================================
  # Database Services
  #====================================
  postgres:
    image: postgres:15-alpine
    container_name: recoder-postgres
    environment:
      POSTGRES_DB: recoder_production
      POSTGRES_USER: ${DB_USER:-recoder}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - recoder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recoder}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: recoder-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - recoder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  #====================================
  # Application Services
  #====================================
  web:
    build:
      context: ./recoder-web
      dockerfile: ../Dockerfile
      target: web-production
    container_name: recoder-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=${WEB_URL:-https://recoder.xyz}
      - NEXT_PUBLIC_API_URL=${API_URL:-https://api.recoder.xyz}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-recoder}:${DB_PASSWORD}@postgres:5432/recoder_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recoder-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`recoder.xyz`,`www.recoder.xyz`)"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  chat:
    build:
      context: ./recoder-chat
      dockerfile: Dockerfile.production
    container_name: recoder-chat
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${CHAT_URL:-https://chat.recoder.xyz}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${API_URL:-https://api.recoder.xyz}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-recoder}:${DB_PASSWORD}@postgres:5432/recoder_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recoder-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`chat.recoder.xyz`)"
      - "traefik.http.routers.chat.tls.certresolver=letsencrypt"
      - "traefik.http.services.chat.loadbalancer.server.port=3000"

  backend:
    build:
      context: .
      target: backend-production
      dockerfile: Dockerfile
    container_name: recoder-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-recoder}:${DB_PASSWORD}@postgres:5432/recoder_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # AI API Keys
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Usage Limits
      - PREMIUM_TOKEN_LIMIT=400000
      - PREMIUM_REQUEST_LIMIT=5000
      - PRO_TOKEN_LIMIT=2000000
      - PRO_REQUEST_LIMIT=25000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recoder-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.recoder.xyz`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3001"

  production-engine:
    build:
      context: ./production-engine
      dockerfile: Dockerfile
    container_name: recoder-production-engine
    environment:
      - NODE_ENV=production
      - PORT=3002
      - API_BASE_URL=${API_URL:-https://api.recoder.xyz}
      - JWT_SECRET=${JWT_SECRET}
      # AI API Keys
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "3002:3002"
    depends_on:
      - backend
    networks:
      - recoder-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.engine.rule=Host(`engine.recoder.xyz`)"
      - "traefik.http.routers.engine.tls.certresolver=letsencrypt"
      - "traefik.http.services.engine.loadbalancer.server.port=3002"

  cli-service:
    build:
      context: .
      target: cli-production
      dockerfile: Dockerfile
    container_name: recoder-cli-service
    environment:
      - NODE_ENV=production
      - PORT=8080
      - API_BASE_URL=${API_URL:-https://api.recoder.xyz}
      - ENGINE_URL=http://production-engine:3002
      - JWT_SECRET=${JWT_SECRET}
      # AI API Keys
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - production-engine
    networks:
      - recoder-network
    restart: unless-stopped

  #====================================
  # Ollama Local AI Service
  #====================================
  ollama:
    image: ollama/ollama:latest
    container_name: recoder-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - recoder-network
    restart: unless-stopped
    # Pull required models on startup
    command: >
      sh -c "
        ollama serve &
        sleep 10 &&
        ollama pull llama3.1:8b &&
        ollama pull codellama:7b &&
        ollama pull mistral:7b &&
        wait
      "

  #====================================
  # Reverse Proxy & SSL
  #====================================
  traefik:
    image: traefik:v3.0
    container_name: recoder-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/letsencrypt
    networks:
      - recoder-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`admin.recoder.xyz`)"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"

  #====================================
  # Monitoring & Analytics
  #====================================
  prometheus:
    image: prom/prometheus:latest
    container_name: recoder-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - recoder-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: recoder-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_DOMAIN=monitor.recoder.xyz
    ports:
      - "3002:3000"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - recoder-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monitor.rule=Host(`monitor.recoder.xyz`)"
      - "traefik.http.routers.monitor.tls.certresolver=letsencrypt"

  #====================================
  # Log Aggregation
  #====================================
  loki:
    image: grafana/loki:latest
    container_name: recoder-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - recoder-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: recoder-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      - recoder-network
    restart: unless-stopped

#====================================
# Health Checks & Backup Scripts
#====================================

# Run with: docker-compose -f docker-compose.production.yml up -d
# 
# Environment variables required:
# - DB_PASSWORD
# - REDIS_PASSWORD  
# - JWT_SECRET
# - STRIPE_SECRET_KEY
# - STRIPE_PUBLISHABLE_KEY
# - STRIPE_WEBHOOK_SECRET
# - DEEPSEEK_API_KEY
# - GROQ_API_KEY
# - ANTHROPIC_API_KEY
# - GOOGLE_API_KEY
# - OPENAI_API_KEY
# - ACME_EMAIL (for SSL certificates)
#
# Optional:
# - WEB_URL (default: https://recoder.xyz)
# - API_URL (default: https://api.recoder.xyz)
# - DB_USER (default: recoder)
# - GRAFANA_PASSWORD (default: admin)