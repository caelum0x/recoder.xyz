# =============================================================================
# Recoder.xyz — Unified Production Docker Compose
# =============================================================================
#
# Replaces the old Traefik-based template and consolidates docker-compose.deploy.yml
# into a single, clean production file with nginx as the sole public ingress.
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   docker compose -f docker-compose.production.yml logs -f
#
# Build the base workspace image first (one-time):
#   docker compose -f docker-compose.production.yml --profile build-base build recoder-base
#
# Architecture:
#   nginx (80/443) -> app              (3000)  recoder.xyz / app.recoder.xyz
#                  -> backend          (8000)  api.recoder.xyz
#                  -> docker-backend   (3100)  api.recoder.xyz (container orchestration)
#                  -> recoder-agents   (3001)  app.recoder.xyz (Next.js agents dashboard)
#
# All internal ports are NOT exposed to the host. Nginx is the sole ingress.
#
# Required env vars in .env.production:
#   REDIS_PASSWORD, POSTGRES_PASSWORD, RECODER_A2A_SHARED_SECRET,
#   RECODER_A2A_WORKER_TOKEN
#
# Optional env vars:
#   POSTGRES_USER (default: recoder), WORKERS (default: 16),
#   GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD, ALERT_* / SMTP_*
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped

services:

  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  redis:
    image: redis:8-alpine
    container_name: recoder-redis
    <<: *restart-policy
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: recoder-postgres
    <<: *restart-policy
    environment:
      POSTGRES_DB: recoder
      POSTGRES_USER: ${POSTGRES_USER:-recoder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recoder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoder} -d recoder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ===========================================================================
  # Application Services
  # ===========================================================================

  # Main Next.js site — recoder.xyz / app.recoder.xyz
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: recoder-app
    <<: *restart-policy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=https://recoder.xyz
      - BACKEND_URL=http://docker-backend:3100
      - REDIS_URL=redis://:${REDIS_PASSWORD}@recoder-redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    stop_grace_period: 30s

  # FastAPI Python backend — api.recoder.xyz
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: recoder-backend-api
    <<: *restart-policy
    env_file:
      - .env.production
    environment:
      - WORKERS=${WORKERS:-16}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@recoder-redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - recoder
    # Reduce DNS lookup latency for third-party AI provider calls
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_search:
      - .
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
    stop_grace_period: 30s

  # Express container orchestration — docker.recoder.xyz / api.recoder.xyz (backend_api upstream)
  docker-backend:
    build:
      context: .
      dockerfile: docker-backend/Dockerfile
    container_name: docker-backend
    <<: *restart-policy
    command: ["pnpm", "exec", "tsx", "src/server.ts"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend_data:/app/data
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3100
      - NODE_OPTIONS=--max_old_space_size=1536
      - REDIS_URL=redis://:${REDIS_PASSWORD}@recoder-redis:6379/0
      - PUBLIC_PROMPT_TASK_QUEUE_BACKEND=redis
      # Runtime lane is temporarily deactivated from public surfacing; keep auth permissive for active control-plane consumers.
      - STRICT_AUTH=false
      - ALLOW_LOCALHOST_ORIGIN=true
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - APP_API_URL=${MAIN_SITE_INTERNAL_URL:-http://host.docker.internal:3000}
      # --- A2A inter-service communication ---
      - RECODER_A2A_SHARED_SECRET=${RECODER_A2A_SHARED_SECRET}
      - RECODER_A2A_REDIS_URL=redis://:${REDIS_PASSWORD}@recoder-redis:6379/0
      - RECODER_A2A_ENABLE_CONSUMER=true
      - RECODER_A2A_CONSUMER_SERVICE=recoder_backend
      - RECODER_A2A_CONSUME_UNTARGETED=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MAIN_LLM_MODEL=openrouter/openai/gpt-4o-mini
      - RECODER_A2A_PLAN_HANDLER_URL=http://recoder-agency:3007/api/a2a/intents/plan
      - RECODER_A2A_EXECUTE_HANDLER_URL=http://recoder-agency:3007/api/a2a/intents/execute
      - RECODER_A2A_HANDOFF_HANDLER_URL=http://recoder-agency:3007/api/a2a/intents/handoff
      - RECODER_A2A_TOOL_CALL_HANDLER_URL=http://recoder-agency:3007/api/a2a/intents/tool_call
      - RECODER_A2A_DEFAULT_HANDLER_URL=http://recoder-agency:3007/api/a2a/intents/execute
      - RECODER_A2A_WORKER_TOKEN=${RECODER_A2A_WORKER_TOKEN}
      # A2A gateway identity and security
      - RECODER_A2A_AGENT_ID=docker-backend
      - RECODER_A2A_ADMIN_TOKEN=${RECODER_A2A_ADMIN_TOKEN:-}
      - RECODER_A2A_BRIDGE_TOKEN=${RECODER_A2A_BRIDGE_TOKEN:-}
      - RECODER_A2A_EGRESS_ALLOWLIST=http://recoder-agency:3007
      - RECODER_A2A_ALLOWED_AGENTS=codex,claude_code,docker-backend,recoder-agency,recoder-pm
      # Tier-1 connector flags
      - RECODER_A2A_ENABLE_CODEX=${RECODER_A2A_ENABLE_CODEX:-true}
      - RECODER_A2A_ENABLE_CLAUDE_CODE=${RECODER_A2A_ENABLE_CLAUDE_CODE:-true}
      # Daytona sandbox integration — preview URLs via *.sandbox.recoder.xyz
      - DAYTONA_API_KEY=${DAYTONA_API_KEY:-}
      - DAYTONA_JWT_TOKEN=${DAYTONA_JWT_TOKEN:-}
      - DAYTONA_ORGANIZATION_ID=${DAYTONA_ORGANIZATION_ID:-}
      - DAYTONA_API_URL=${DAYTONA_API_URL:-http://host.docker.internal:3900/api}
      - DAYTONA_SERVER_URL=${DAYTONA_SERVER_URL:-http://host.docker.internal:3900/api}
      - USE_DAYTONA_CONTAINERS=${USE_DAYTONA_CONTAINERS:-true}
      - OPENCODE_SERVICE_URL=${OPENCODE_SERVICE_URL:-http://recoder-opencode:4096}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-recoder_opencode_key}
      # Public URL for preview and artifact references.
      - PUBLIC_URL=${NEXT_PUBLIC_AGENCY_URL:-https://agency.recoder.xyz}
      # SearXNG self-hosted search (same Docker network, port 8080 internally)
      - SEARXNG_URL=http://searxng:8080
    ports:
      - "3100:3100"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 512M
    stop_grace_period: 45s

  # Next.js agents dashboard — app.recoder.xyz
  recoder-agents:
    build:
      context: .
      dockerfile: recoder-agents/Dockerfile
      args:
        APP_PORT: 3001
        PNPM_LOCKFILE_MODE: --no-frozen-lockfile
    container_name: recoder-agents
    <<: *restart-policy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://recoder.xyz}
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL:-https://recoder.xyz}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_AGENTS_URL:-https://agents.recoder.xyz}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://api.recoder.xyz/v1}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://recoder-backend-api:8000/v1}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001',{redirect:'manual'}).then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    stop_grace_period: 30s

  # Recoder Studio — ABANDONED, no longer deployed.
  # Kept commented out for reference only.
  # recoder-studio:
  #   build:
  #     context: .
  #     dockerfile: recoder-studio/Dockerfile
  #   container_name: recoder-studio

  # Recoder Agency (agency workflows) — agency.recoder.xyz
  recoder-agency:
    build:
      context: .
      dockerfile: recoder-agency/Dockerfile
    container_name: recoder-agency
    <<: *restart-policy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3007
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://recoder.xyz}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_AGENCY_URL:-https://agency.recoder.xyz}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_AGENCY_URL:-https://agency.recoder.xyz}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@recoder-redis:6379/0
      # SearXNG self-hosted search (same Docker network, port 8080 internally)
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    stop_grace_period: 30s

  # Recoder PM (project management) — pm.recoder.xyz
  recoder-pm:
    build:
      context: .
      dockerfile: recoder-pm/Dockerfile.app
    container_name: recoder-pm
    <<: *restart-policy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3004
      - HOSTNAME=0.0.0.0
      - DOCKER=1
      - NEXT_TELEMETRY_DISABLED=1
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://recoder.xyz}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NEXT_PUBLIC_VERCEL_PROJECT_PRODUCTION_URL=${RECODER_PM_WEB_URL:-https://pm.recoder.xyz}
      - RECODER_PM_WEB_URL=${RECODER_PM_WEB_URL:-https://pm.recoder.xyz}
      - RECODER_PM_API_URL=${RECODER_PM_API_URL:-https://pm.recoder.xyz/api}
      - RECODER_PM_PORTAL_URL=${RECODER_PM_PORTAL_URL:-https://pm.recoder.xyz/portal}
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-${DATABASE_URL}}
      - POSTGRES_PRISMA_URL=${POSTGRES_PRISMA_URL:-${DATABASE_URL}}
      - POSTGRES_URL_NON_POOLING=${POSTGRES_URL_NON_POOLING:-${DATABASE_URL}}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@recoder-redis:6379/0
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_TOKEN=${RESEND_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@recoder.xyz}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST:-}
      - SMTP_AUTH_USERNAME=${SMTP_AUTH_USERNAME:-}
      - SMTP_AUTH_PASSWORD=${SMTP_AUTH_PASSWORD:-}
      # BYOK: No AI provider keys — users configure at org level
      - OPENROUTER_API_KEY=
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
      # SearXNG self-hosted search (same Docker network, port 8080 internally)
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    stop_grace_period: 30s

  # OpenClaw — REMOVED (2026-03-28). See extracted-from-openclaw/
  # Gateway code extracted. Redirect to agency.recoder.xyz via nginx.

  # ===========================================================================
  # Reverse Proxy — sole public ingress (ports 80 + 443)
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: recoder-nginx
    <<: *restart-policy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /var/www/html:/var/www/html:ro
      - /data/published:/data/published:ro
    depends_on:
      app:
        condition: service_healthy
      backend:
        condition: service_healthy
      docker-backend:
        condition: service_healthy
      recoder-agents:
        condition: service_healthy
      recoder-agency:
        condition: service_healthy
      recoder-pm:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ===========================================================================
  # Monitoring Stack
  # ===========================================================================

  node-exporter:
    image: prom/node-exporter:latest
    container_name: recoder-node-exporter
    <<: *restart-policy
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: recoder-redis-exporter
    <<: *restart-policy
    environment:
      - REDIS_ADDR=redis://recoder-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  prometheus:
    image: prom/prometheus:latest
    container_name: recoder-prometheus
    <<: *restart-policy
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      alertmanager:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
      redis-exporter:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  alertmanager:
    image: prom/alertmanager:latest
    container_name: recoder-alertmanager
    <<: *restart-policy
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
      - ./scripts/alertmanager-entrypoint.sh:/app/alertmanager-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_CRITICAL_WEBHOOK_URL=${ALERT_CRITICAL_WEBHOOK_URL:-}
      - ALERT_SLACK_API_URL=${ALERT_SLACK_API_URL:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_AUTH_USERNAME=${SMTP_AUTH_USERNAME:-}
      - SMTP_AUTH_PASSWORD=${SMTP_AUTH_PASSWORD:-}
    entrypoint: ["/bin/sh", "/app/alertmanager-entrypoint.sh"]
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: recoder-grafana
    <<: *restart-policy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://recoder.xyz/grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - recoder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  # ===========================================================================
  # Build-only: Base workspace image for user project containers
  # ===========================================================================

  recoder-base:
    build: ./docker-backend/docker
    image: recoder-workspace:latest
    profiles:
      - build-base

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis_data:
  postgres_data:
  backend_data:
  # openclaw_config: — REMOVED
  # openclaw_workspace: — REMOVED
  prometheus_data:
  alertmanager_data:
  grafana_data:

# =============================================================================
# Networks — single bridge network for all services
# =============================================================================
networks:
  recoder:
    name: recoder-network
    driver: bridge
