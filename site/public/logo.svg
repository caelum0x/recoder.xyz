<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recoder">
  <defs>
    <linearGradient id="rc" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- subtle code brackets: recoder = rewriting code -->
  <path d="M18 20 L12 20 L12 44 L18 44" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M46 20 L52 20 L52 44 L46 44" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- text cursor / I-beam caret (the mark) -->
  <g fill="url(#rc)">
    <rect x="22" y="13" width="20" height="4.5" rx="2.25"/>
    <rect x="22" y="46.5" width="20" height="4.5" rx="2.25"/>
    <rect x="29.5" y="13" width="5" height="38" rx="2.5"/>
  </g>
</svg>
