# Comprehensive Monitoring Dashboard for Recoder.xyz Ecosystem
# Deploy with: kubectl apply -f comprehensive-dashboard.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: recoder-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: recoder-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'recoder-production'
        environment: 'production'
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    
    scrape_configs:
      # API Gateway Metrics
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:8080']
        scrape_interval: 10s
        metrics_path: /metrics
        
      # Backend Services
      - job_name: 'backend-services'
        static_configs:
          - targets: 
            - 'backend:3001'
            - 'production-engine:3002'
            - 'chat-platform:3003'
            - 'web-platform:3000'
        scrape_interval: 15s
        metrics_path: /metrics
        
      # Authentication Services
      - job_name: 'auth-services'
        static_configs:
          - targets:
            - 'auth-service:3000'
            - 'oauth-callback-service:3000'
            - 'session-sync-service:8080'
        scrape_interval: 15s
        
      # AI Provider Metrics
      - job_name: 'ai-providers'
        static_configs:
          - targets: ['ai-hub:3004']
        scrape_interval: 30s
        
      # Database Metrics
      - job_name: 'databases'
        static_configs:
          - targets: 
            - 'postgres-exporter:9187'
            - 'redis-exporter:9121'
        scrape_interval: 30s
        
      # Kubernetes Metrics
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https
          
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
          
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alerting-rules
  namespace: recoder-monitoring
data:
  recoder-alerts.yml: |
    groups:
    - name: recoder-ecosystem-alerts
      rules:
      
      # High-Level System Alerts
      - alert: SystemOverallHealth
        expr: (up{job=~"backend-services|auth-services"} == 0) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Critical service down: {{ $labels.instance }}"
          description: "Service {{ $labels.instance }} has been down for more than 1 minute"
          
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"
          
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s for {{ $labels.instance }}"
          
      # AI Provider Specific Alerts
      - alert: AIProviderDown
        expr: up{job="ai-providers"} == 0
        for: 30s
        labels:
          severity: critical
          team: ai
        annotations:
          summary: "AI Provider service is down"
          description: "AI Hub service {{ $labels.instance }} is not responding"
          
      - alert: AIResponseTimeDegraded
        expr: histogram_quantile(0.95, rate(ai_request_duration_seconds_bucket[5m])) > 10
        for: 2m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "AI response time degraded"
          description: "AI response time 95th percentile is {{ $value }}s"
          
      # Authentication Alerts
      - alert: AuthServiceDown
        expr: up{job="auth-services"} == 0
        for: 30s
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Authentication service down"
          description: "Auth service {{ $labels.instance }} is not responding"
          
      - alert: HighLoginFailureRate
        expr: rate(auth_login_failures_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High login failure rate"
          description: "Login failure rate is {{ $value }} failures/sec"
          
      # Database Alerts
      - alert: DatabaseConnectionPoolHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Database connection pool usage high"
          description: "Connection pool usage is {{ $value | humanizePercentage }}"
          
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"
          
      # Resource Alerts
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
        for: 3m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% for {{ $labels.pod }}"
          
      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 90
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% for {{ $labels.pod }}"
          
      # Business Metrics Alerts
      - alert: LowUserSignups
        expr: rate(user_signups_total[1h]) < 1
        for: 1h
        labels:
          severity: info
          team: growth
        annotations:
          summary: "User signup rate is low"
          description: "Only {{ $value }} signups in the last hour"
          
      - alert: HighAPIUsage
        expr: rate(api_requests_total[5m]) > 1000
        for: 2m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "High API usage detected"
          description: "API request rate is {{ $value }} req/sec"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: recoder-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.40.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--web.enable-lifecycle'
          - '--web.enable-admin-api'
          - '--storage.tsdb.retention.time=30d'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: alerting-rules
          mountPath: /etc/prometheus/rules/
        - name: prometheus-storage
          mountPath: /prometheus/
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: alerting-rules
        configMap:
          name: alerting-rules
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: prometheus-pvc
          
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: recoder-monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: LoadBalancer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: recoder-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
      
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: recoder-monitoring
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    
    [grafana_net]
    url = https://grafana.net
    
    [log]
    mode = console
    
    [paths]
    data = /var/lib/grafana/data
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [server]
    root_url = https://monitoring.recoder.xyz
    
    [security]
    admin_user = admin
    admin_password = ${GRAFANA_ADMIN_PASSWORD}
    
    [users]
    allow_sign_up = false
    
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true
      
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'recoder-dashboards'
      orgId: 1
      folder: 'Recoder.xyz'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: recoder-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:9.3.0
        ports:
        - containerPort: 3000
        env:
        - name: GRAFANA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: monitoring-secrets
              key: grafana-admin-password
        volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: grafana-storage
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: grafana-config
        configMap:
          name: grafana-config
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: recoder-monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
  type: LoadBalancer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: recoder-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: recoder-monitoring
type: Opaque
data:
  grafana-admin-password: UmVjb2RlckFkbWluMTIzIQ== # RecoderAdmin123!
  alertmanager-webhook-url: # Base64 encoded webhook URL

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: recoder-monitoring
data:
  recoder-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Recoder.xyz - System Overview",
        "tags": ["recoder", "overview"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Overall System Health",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"backend-services|auth-services\"}",
                "legendFormat": "{{instance}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "mappings": [
                  {"options": {"0": {"text": "Down", "color": "red"}}, "type": "value"},
                  {"options": {"1": {"text": "Up", "color": "green"}}, "type": "value"}
                ],
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "{{instance}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Response Time (95th percentile)",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "{{instance}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m])",
                "legendFormat": "{{instance}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Active Users",
            "type": "stat",
            "targets": [
              {
                "expr": "active_users_total",
                "legendFormat": "Active Users"
              }
            ],
            "gridPos": {"h": 6, "w": 6, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "AI Requests per Hour",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(ai_requests_total[1h]) * 3600",
                "legendFormat": "AI Requests/hour"
              }
            ],
            "gridPos": {"h": 6, "w": 6, "x": 6, "y": 16}
          },
          {
            "id": 7,
            "title": "Database Connections",
            "type": "stat",
            "targets": [
              {
                "expr": "pg_stat_database_numbackends",
                "legendFormat": "DB Connections"
              }
            ],
            "gridPos": {"h": 6, "w": 6, "x": 12, "y": 16}
          },
          {
            "id": 8,
            "title": "Memory Usage",
            "type": "stat",
            "targets": [
              {
                "expr": "avg(container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100",
                "legendFormat": "Memory Usage %"
              }
            ],
            "gridPos": {"h": 6, "w": 6, "x": 18, "y": 16}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "10s"
      }
    }
    
  ai-performance.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Recoder.xyz - AI Performance",
        "tags": ["recoder", "ai", "performance"],
        "panels": [
          {
            "id": 1,
            "title": "AI Provider Response Times",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(ai_request_duration_seconds_bucket[5m])) by (provider)",
                "legendFormat": "{{provider}} - 95th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "AI Provider Success Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(ai_requests_total{status=\"success\"}[5m]) / rate(ai_requests_total[5m]) by (provider)",
                "legendFormat": "{{provider}} success rate"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Token Usage by Provider",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(ai_tokens_used_total[5m]) by (provider)",
                "legendFormat": "{{provider}} tokens/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Cost per Hour by Provider",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(ai_cost_total[1h]) * 3600 by (provider)",
                "legendFormat": "{{provider}} $/hour"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ],
        "time": {"from": "now-4h", "to": "now"},
        "refresh": "30s"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: recoder-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.25.0
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
          - '--storage.path=/alertmanager'
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: recoder-monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@recoder.xyz'
      
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'recoder-team'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
      - match:
          team: security
        receiver: 'security-team'
        
    receivers:
    - name: 'recoder-team'
      slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL'
        channel: '#recoder-alerts'
        title: 'Recoder.xyz Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        
    - name: 'critical-alerts'
      slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL'
        channel: '#critical-alerts'
        title: 'CRITICAL: Recoder.xyz Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      email_configs:
      - to: 'team@recoder.xyz'
        subject: 'CRITICAL Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
          
    - name: 'security-team'
      email_configs:
      - to: 'security@recoder.xyz'
        subject: 'Security Alert: {{ .GroupLabels.alertname }}'
        
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: recoder-monitoring
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093

---
# Ingress for external access to monitoring
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: recoder-monitoring
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - monitoring.recoder.xyz
    secretName: monitoring-tls-secret
  rules:
  - host: monitoring.recoder.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
      - path: /alertmanager
        pathType: Prefix
        backend:
          service:
            name: alertmanager
            port:
              number: 9093