# Prometheus Configuration for Recoder Platform
# Deployed at: monitor.recoder.xyz (behind nginx auth)
# Server: Hetzner 8 vCPU, 16GB RAM (77.42.23.19)
#
# NOTE:
# - Keep this file limited to Prometheus-compatible metrics endpoints.
# - Public JSON health endpoints and HTML pages are NOT scrapeable here.
# - External uptime checks for web/agents/agency/pm should use a blackbox
#   exporter or app-native metrics when those are added.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

# Alert rules files — evaluated at `evaluation_interval`
rule_files:
  - 'alert-rules.yml'

# Alertmanager instances to send firing alerts to
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      # Timeout for sending alerts to Alertmanager
      timeout: 10s

scrape_configs:
  # Docker backend metrics
  - job_name: 'docker-backend'
    static_configs:
      - targets: ['docker-backend:3100']
    metrics_path: /api/metrics/prometheus
    scrape_interval: 30s

  # A2A SLO metrics (connector success rates, circuit breakers, latency)
  - job_name: 'docker-backend-a2a'
    static_configs:
      - targets: ['docker-backend:3100']
    metrics_path: /api/a2a/metrics/prometheus
    scrape_interval: 30s

  # VictoriaMetrics self-metrics
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']
    metrics_path: /metrics
    scrape_interval: 30s

  # Alertmanager self-metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics
    scrape_interval: 30s

  # Blackbox exporter self-metrics
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']
    metrics_path: /metrics
    scrape_interval: 30s

  # Public HTTPS uptime probes for user-facing services.
  - job_name: 'public-http-uptime'
    metrics_path: /probe
    params:
      module: ['http_public_site']
    static_configs:
      - targets:
          - https://recoder.xyz
          - https://web.recoder.xyz
          - https://agents.recoder.xyz
          - https://agency.recoder.xyz
          - https://pm.recoder.xyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: 'https://([^/]+).*'
        replacement: '$1'
        target_label: public_service
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s

  # Redis metrics via redis_exporter sidecar
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Node exporter for system metrics (CPU, memory, disk)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 60s
