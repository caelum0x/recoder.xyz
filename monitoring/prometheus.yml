global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Recoder Web Platform
  - job_name: 'recoder-web'
    static_configs:
      - targets: ['web.recoder.xyz:443']
    metrics_path: /api/metrics
    scheme: https
    scrape_interval: 30s

  # Recoder CLI Router
  - job_name: 'recoder-cli-router'
    static_configs:
      - targets: ['recoder-cli-router:3000']
    metrics_path: /metrics
    scrape_interval: 30s

  # External services monitoring
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://web.recoder.xyz
        - https://marketplace.visualstudio.com/items?itemName=recoderxyz.recoder-vscode
        - https://www.npmjs.com/package/@recoder/cli
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # API endpoints monitoring
  - job_name: 'api-endpoints'
    static_configs:
      - targets:
        - 'web.recoder.xyz'
    metrics_path: /api/health
    scheme: https
    scrape_interval: 10s