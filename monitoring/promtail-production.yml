# Promtail Configuration for Production Log Collection

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|](?P<image_name>(?:[^|](?P<image_id>(?:[^|]*)))\|)*))\|(?P<container_id>(?:[^|]*))
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
          image_name:
          container_id:
      - output:
          source: output

  # System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: "(?P<timestamp>\\S+\\s+\\d+\\s+\\d+:\\d+:\\d+)\\s+(?P<hostname>\\S+)\\s+(?P<service>\\S+)(?:\\[(?P<pid>\\d+)\\])?:\\s*(?P<message>.*)"
      - timestamp:
          format: "Jan 2 15:04:05"
          source: timestamp
      - labels:
          hostname:
          service:
          pid:

  # Nginx access logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" "(?P<http_x_forwarded_for>[^"]*)" rt=(?P<request_time>\S+) uct="(?P<upstream_connect_time>\S*)" uht="(?P<upstream_header_time>\S*)" urt="(?P<upstream_response_time>\S*)"'
      - timestamp:
          format: "02/Jan/2006:15:04:05 -0700"
          source: time_local
      - labels:
          method:
          path:
          status:
          remote_addr:

  # Nginx error logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: "(?P<timestamp>\\d{4}/\\d{2}/\\d{2} \\d{2}:\\d{2}:\\d{2}) \\[(?P<level>\\w+)\\] (?P<pid>\\d+)#(?P<tid>\\d+): (?P<message>.*)"
      - timestamp:
          format: "2006/01/02 15:04:05"
          source: timestamp
      - labels:
          level:
          pid:
          tid:

  # Application logs from Recoder services
  - job_name: recoder-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: recoder-backend
          service: backend
          __path__: /app/logs/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            context: context
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          service:

  - job_name: recoder-production-engine
    static_configs:
      - targets:
          - localhost
        labels:
          job: recoder-production-engine
          service: production-engine
          __path__: /app/logs/production-engine/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            task: task
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          service:
          task:

  # PostgreSQL logs
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          service: database
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: "(?P<timestamp>\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d{3}) \\w+ \\[(?P<pid>\\d+)\\] (?P<level>\\w+):\\s*(?P<message>.*)"
      - timestamp:
          format: "2006-01-02 15:04:05.000"
          source: timestamp
      - labels:
          level:
          service:
          pid:

  # Redis logs
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          service: cache
          __path__: /var/log/redis/*.log
    pipeline_stages:
      - regex:
          expression: "(?P<pid>\\d+):\\w+ (?P<timestamp>\\d+ \\w+ \\d{2}:\\d{2}:\\d{2}\\.\\d{3}) (?P<level>\\S) (?P<message>.*)"
      - timestamp:
          format: "2 Jan 15:04:05.000"
          source: timestamp
      - labels:
          level:
          service:
          pid: