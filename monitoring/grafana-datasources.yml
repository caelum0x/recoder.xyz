# Grafana Datasource Provisioning
# VictoriaMetrics is Prometheus-compatible — same PromQL queries work.
# VM listens on port 8428 inside the container.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
