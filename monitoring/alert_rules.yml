groups:
  - name: recoder.alerts
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 2 minutes on {{ $labels.instance }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 90% for more than 2 minutes on {{ $labels.instance }}"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% on {{ $labels.instance }}"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} service is down on {{ $labels.instance }}"

      # High response time
      - alert: HighResponseTime
        expr: avg_over_time(prometheus_http_request_duration_seconds[5m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "Response time is above 1 second for {{ $labels.instance }}"

      # Container restart
      - alert: ContainerRestarted
        expr: increase(container_start_time_seconds[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} has restarted"

      # Recoder Web Platform specific alerts
      - alert: RecoderWebDown
        expr: probe_success{instance="https://web.recoder.xyz"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Recoder Web Platform is down"
          description: "The main web platform at web.recoder.xyz is not responding"

      # VS Code Extension marketplace
      - alert: VSCodeExtensionDown
        expr: probe_success{instance="https://marketplace.visualstudio.com/items?itemName=recoderxyz.recoder-vscode"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VS Code Extension page unreachable"
          description: "The VS Code marketplace page for Recoder extension is not responding"

      # NPM Package
      - alert: NPMPackageDown
        expr: probe_success{instance="https://www.npmjs.com/package/@recoder/cli"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NPM package page unreachable"
          description: "The NPM package page for @recoder/cli is not responding"