# Legacy zrok v1 controller template for docker-compose.deploy.yml.
# The live preview path uses docker-compose.zrok.yml and zrok2 instead.
# Keep this file minimally parse-valid for the legacy openziti/zrok image.
v: 4

admin:
  # This must match the docker-compose.deploy.yml fallback token.
  secrets:
    - recoder_zrok_admin

endpoint:
  host: 0.0.0.0
  port: 18080

store:
  path: /var/lib/zrok/zrok.db
  type: sqlite3
