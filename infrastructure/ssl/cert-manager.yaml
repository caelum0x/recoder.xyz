# SSL Certificate Management for Recoder.xyz
# Automated certificate provisioning and renewal with cert-manager

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@recoder.xyz
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        cloudflare:
          email: admin@recoder.xyz
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@recoder.xyz
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        cloudflare:
          email: admin@recoder.xyz
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: recoder-xyz-tls
  namespace: recoder-system
spec:
  secretName: recoder-xyz-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - recoder.xyz
  - www.recoder.xyz
  - web.recoder.xyz
  - api.recoder.xyz
  - cli.recoder.xyz
  - status.recoder.xyz
  - docs.recoder.xyz
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: recoder-wildcard-tls
  namespace: recoder-system
spec:
  secretName: recoder-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "*.recoder.xyz"
  - recoder.xyz
---
# Certificate monitoring and alerting
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager-metrics
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  endpoints:
  - port: tcp-prometheus-servicemonitor
    interval: 60s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: cert-manager
spec:
  groups:
  - name: cert-manager
    rules:
    - alert: CertManagerCertExpirySoon
      expr: cert_manager_certificate_expiration_timestamp_seconds - time() < 604800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Certificate expiring soon"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in less than 7 days"
    
    - alert: CertManagerCertNotReady
      expr: cert_manager_certificate_ready_status == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Certificate not ready"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} is not ready"
    
    - alert: CertManagerHTTP01ChallengeFailed
      expr: cert_manager_http_acme_client_request_count{status!="200"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "HTTP01 challenge failed"
        description: "HTTP01 challenge failed for certificate issuance"