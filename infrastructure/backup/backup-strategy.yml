# Comprehensive Backup and Disaster Recovery Strategy for Recoder.xyz
# Automated backup procedures for all critical data and services

apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-config
  namespace: recoder-system
data:
  backup-schedule.yaml: |
    schedules:
      # Database backups
      database:
        frequency: "0 2 * * *"  # Daily at 2 AM UTC
        retention: "30d"
        encryption: true
        compression: true
        verification: true
        destinations:
          - s3://recoder-backups/database/
          - gs://recoder-backups-eu/database/
          - azure://recoderbackups/database/
      
      # Application data backups  
      application:
        frequency: "0 4 * * *"  # Daily at 4 AM UTC
        retention: "14d"
        encryption: true
        destinations:
          - s3://recoder-backups/app-data/
          - gs://recoder-backups-eu/app-data/
      
      # Configuration backups
      config:
        frequency: "0 6 * * 0"  # Weekly on Sunday at 6 AM UTC
        retention: "90d"
        encryption: true
        destinations:
          - s3://recoder-backups/config/
          - git://github.com/recoderxyz/config-backups.git
      
      # Log archives
      logs:
        frequency: "0 3 * * *"  # Daily at 3 AM UTC
        retention: "7d"
        compression: true
        destinations:
          - s3://recoder-backups/logs/
  
  restore-procedures.yaml: |
    procedures:
      # Database restore
      database:
        steps:
          - name: "Stop application services"
            command: "kubectl scale deployment --replicas=0 --all -n recoder"
          - name: "Create new database instance"
            command: "terraform apply -target=module.database_restore"
          - name: "Restore from backup"
            command: "pg_restore -d recoder_restored backup.sql"
          - name: "Verify data integrity"
            command: "psql -d recoder_restored -f verify.sql"
          - name: "Update DNS records"
            command: "terraform apply -target=module.dns_failover"
          - name: "Start application services"
            command: "kubectl scale deployment --replicas=3 --all -n recoder"
        
        rollback:
          - name: "Revert DNS records"
            command: "terraform apply -target=module.dns_primary"
          - name: "Scale down restore instance"
            command: "terraform destroy -target=module.database_restore"
      
      # Application restore
      application:
        steps:
          - name: "Create temporary environment"
            command: "kubectl create namespace recoder-restore"
          - name: "Deploy from backup"
            command: "helm install recoder-restore ./charts/recoder -n recoder-restore"
          - name: "Restore application data"
            command: "kubectl exec -n recoder-restore deploy/web -- restore-data.sh"
          - name: "Run health checks"
            command: "kubectl exec -n recoder-restore deploy/web -- health-check.sh"
          - name: "Switch traffic"
            command: "kubectl patch service web -p '{\"spec\":{\"selector\":{\"version\":\"restore\"}}}'"
  
  monitoring.yaml: |
    alerts:
      backup_failed:
        condition: "backup_job_success == 0"
        severity: "critical"
        message: "Backup job failed for {{ $labels.service }}"
        channels: ["pagerduty", "slack"]
      
      backup_delayed:
        condition: "time() - backup_last_success_time > 86400"
        severity: "warning"
        message: "Backup is overdue for {{ $labels.service }}"
        channels: ["slack", "email"]
      
      restore_test_failed:
        condition: "restore_test_success == 0"
        severity: "warning"
        message: "Restore test failed for {{ $labels.service }}"
        channels: ["slack", "email"]
    
    dashboards:
      backup_overview:
        panels:
          - backup_success_rate
          - backup_duration
          - backup_size_trends
          - restore_test_results
          - retention_compliance